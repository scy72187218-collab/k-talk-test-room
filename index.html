<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk LIVE</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}
#ktLoading{position:fixed;inset:0;display:grid;place-items:center;background:#000;text-align:center;padding:24px}
#ktLoading b{font-size:24px;color:#ffe071}#ktLoading span{display:block;margin-top:10px;font-size:14px;color:#bbb}
</style>
</head>
<body>
<div id="ktLoading"><div><b>♛ K-Talk LIVE</b><span>화면을 불러오는 중입니다...</span></div></div>
<script>
(function(){
  var SOURCE='https://k-talk-live-final.vercel.app/';
  function fail(){
    var el=document.getElementById('ktLoading');
    if(el)el.innerHTML='<div><b>♛ K-Talk LIVE</b><span>연결을 다시 시도해 주세요.</span></div>';
  }
  fetch(SOURCE+'?ktnew='+Date.now(),{cache:'no-store',mode:'cors'})
    .then(function(r){if(!r.ok)throw new Error('load');return r.text();})
    .then(function(html){
      if(!/<head[\s>]/i.test(html))throw new Error('html');
      html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+SOURCE+'">');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(fail);
})();
</script>
</body>
</html>
