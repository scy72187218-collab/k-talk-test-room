<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk 5인 테스트</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
body{margin:0;background:#090711;color:#fff;font-family:Arial}
.w{max-width:430px;margin:auto;padding:14px}
.test{display:inline-block;background:#ffcc00;color:#111;font-weight:900;padding:5px 10px;border-radius:9px;margin-bottom:7px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{color:#ffd76a;font-size:22px;font-weight:800}
.on{background:#ff2e6d;padding:7px 10px;border-radius:10px;font-weight:800}
.v{margin-top:12px;position:relative;background:#15151c;border-radius:16px;overflow:hidden;aspect-ratio:16/10}
.v video,.p video{width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa}
.c{display:flex;gap:8px;margin-top:12px}
.b{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;color:#fff}
.s{background:#8d46ff}
.e{background:#333}
.st{margin-top:10px;padding:10px;background:#1c1524;border-radius:10px;color:#ffd76a}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.p{height:74px;background:#211829;border:1px solid #4a3457;border-radius:11px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-size:12px}
.lab{position:absolute;left:4px;bottom:4px;background:#0008;padding:2px 5px;border-radius:6px;font-size:10px}
</style>
</head>

<body>
<div class="w">

<div class="test">TEST · 5명 화상채팅 테스트</div>

<div class="top">
  <div>
    <div class="brand">👑 K-Talk</div>
    <div style="font-size:12px;color:#aaa">시험 방송방 · 최대 13명</div>
  </div>
  <div class="on">ON AIR</div>
</div>

<div class="v">
  <div id="ph" class="ph">아래 ‘방송 시작’을 누르세요</div>
  <video id="lv" autoplay playsinline muted></video>
</div>

<div class="c">
  <button class="b s" onclick="startRoom()">📹 방송 시작</button>
  <button class="b e" onclick="stopRoom()">방송 종료</button>
</div>

<div id="st" class="st">대기 중</div>

<div class="g">
  <div class="p" id="s1">진행자</div>
  <div class="p" id="s2">참가자 2</div>
  <div class="p" id="s3">참가자 3</div>
  <div class="p" id="s4">참가자 4</div>
  <div class="p" id="s5">참가자 5</div>

  <div class="p">참가자 6</div>
  <div class="p">참가자 7</div>
  <div class="p">참가자 8</div>
  <div class="p">참가자 9</div>
  <div class="p">참가자 10</div>
  <div class="p">참가자 11</div>
  <div class="p">참가자 12</div>
  <div class="p">참가자 13</div>
</div>

</div>

<script>
let stream=null;
let peer=null;
let mySlot=0;
let calls={};

const BASE='ktalk5-20260815-slot-';

function setStatus(text){
  document.getElementById('st').textContent=text;
}

function getSlot(id){
  const m=String(id||'').match(/slot-(\d+)$/);
  return m ? Number(m[1]) : 0;
}

function showRemote(slot, remoteStream){
  const box=document.getElementById('s'+slot);
  if(!box) return;

  box.innerHTML='';

  const video=document.createElement('video');
  video.autoplay=true;
  video.playsInline=true;
  video.srcObject=remoteStream;

  const label=document.createElement('div');
  label.className='lab';
  label.textContent=slot===1 ? '진행자' : '참가자 '+slot;

  box.appendChild(video);
  box.appendChild(label);

  setStatus('✅ 상대방 연결됨');
}

function resetSlot(slot){
  const box=document.getElementById('s'+slot);
  if(box){
    box.innerHTML=slot===1 ? '진행자' : '참가자 '+slot;
  }
}

function claimSlot(slot){
  return new Promise(resolve=>{
    const p=new Peer(BASE+slot);
    let done=false;

    p.on('open',()=>{
      if(done) return;
      done=true;
      resolve(p);
    });

    p.on('error',()=>{
      if(done) return;
      done=true;
      try{p.destroy()}catch(e){}
      resolve(null);
    });

    setTimeout(()=>{
      if(!done){
        done=true;
        try{p.destroy()}catch(e){}
        resolve(null);
      }
    },1600);
  });
}

async function startRoom(){

  if(stream) return;

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

    document.getElementById('lv').srcObject=stream;
    document.getElementById('ph').style.display='none';

  }catch(e){
    alert('카메라와 마이크 권한을 허용해 주세요.');
    return;
  }

  setStatus('방 연결 중...');

  for(let i=1;i<=5;i++){
    const p=await claimSlot(i);
    if(p){
      peer=p;
      mySlot=i;
      break;
    }
  }

  if(!peer){
    setStatus('5명 방이 가득 찼습니다.');
    return;
  }

  peer.on('call',call=>{
    const slot=getSlot(call.peer);
    calls[slot]=call;

    call.answer(stream);

    call.on('stream',remoteStream=>{
      showRemote(slot,remoteStream);
    });

    call.on('close',()=>{
      delete calls[slot];
      resetSlot(slot);
    });
  });

  for(let i=1;i<mySlot;i++){
    const call=peer.call(BASE+i,stream);
    calls[i]=call;

    call.on('stream',remoteStream=>{
      showRemote(i,remoteStream);
    });

    call.on('close',()=>{
      delete calls[i];
      resetSlot(i);
    });
  }

  setStatus(
    mySlot===1
      ? '진행자 입장 완료'
      : '참가자 '+mySlot+' 입장 완료'
  );
}

function stopRoom(){

  Object.values(calls).forEach(call=>{
    try{call.close()}catch(e){}
  });

  calls={};

  try{
    if(peer) peer.destroy();
  }catch(e){}

  if(stream){
    stream.getTracks().forEach(track=>track.stop());
  }

  stream=null;
  peer=null;
  mySlot=0;

  document.getElementById('lv').srcObject=null;
  document.getElementById('ph').style.display='flex';

  for(let i=1;i<=5;i++){
    resetSlot(i);
  }

  setStatus('대기 중');
}
</script>

</body>
</html>
