<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050409;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

button,input{font-family:inherit}

.app{
  width:100vw;
  height:100dvh;
  padding:4px;
  display:grid;
  grid-template-rows:42px 30px 38px 1fr 185px 52px;
  gap:4px;
  background:#050409;
}

/* 상단 */
.header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  min-height:0;
}

.live{
  font-size:9px;
  font-weight:900;
}

.live b{
  background:#ef1f50;
  padding:5px 7px;
  border-radius:7px;
}

.logo{
  text-align:center;
  color:#ffd63b;
  font-size:18px;
  font-weight:900;
}

.logo small{
  display:block;
  color:#fff;
  font-size:7px;
}

.viewer{
  text-align:right;
  font-size:9px;
}

/* 큰 입장 버튼 */
.roomBar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}

.roomBtn{
  border:0;
  border-radius:8px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}

.publicBtn{
  background:linear-gradient(135deg,#ffc52d,#ff7b00);
  color:#181000;
}

.secretBtn{
  background:linear-gradient(135deg,#7a2cff,#d72cf6);
  color:#fff;
}

.roomBtn:active{
  transform:scale(.97);
}

/* 안내 */
.notice{
  border:1px solid #552162;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
}

/* 메인 */
.main{
  display:grid;
  grid-template-columns:47% 53%;
  gap:4px;
  min-height:0;
}

.host{
  position:relative;
  min-height:0;
  overflow:hidden;
  border:1px solid #6d2d7d;
  border-radius:8px;
  background:#0c0810;
}

.host video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hostLive{
  position:absolute;
  top:5px;
  left:5px;
  color:#ff315e;
  font-size:8px;
  font-weight:900;
}

.attendance{
  position:absolute;
  top:5px;
  right:5px;
  border:1px solid #ff39d3;
  border-radius:15px;
  background:rgba(55,0,65,.75);
  padding:2px 5px;
  font-size:7px;
  color:#ffd74a;
  box-shadow:0 0 7px rgba(255,46,210,.55);
}

.hostName{
  position:absolute;
  left:5px;
  bottom:5px;
  background:rgba(0,0,0,.72);
  padding:3px 6px;
  border-radius:6px;
  color:#ffd642;
  font-size:8px;
  font-weight:900;
}

/* 게스트 13명 */
.guestGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:3px;
  min-height:0;
}

.slot{
  position:relative;
  overflow:hidden;
  border:1px solid #37303e;
  border-radius:5px;
  background:#111015;
  min-height:0;
}

.slot video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slotNo{
  position:absolute;
  top:2px;
  left:2px;
  width:15px;
  height:15px;
  border-radius:4px;
  background:#737373;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7px;
  font-weight:900;
}

.slot:nth-child(1) .slotNo{
  background:#ffd326;
  color:#111;
}

.slot:nth-child(2) .slotNo{
  background:#f43c91;
}

.slot:nth-child(3) .slotNo{
  background:#e97418;
}

.slot:nth-child(4) .slotNo{
  background:#20abd2;
}

.slot:nth-child(5) .slotNo{
  background:#712ee5;
}

.slotName{
  position:absolute;
  left:2px;
  right:2px;
  bottom:1px;
  padding:6px 1px 1px;
  font-size:6px;
  font-weight:900;
  background:linear-gradient(transparent,rgba(0,0,0,.93));
}

.rose{
  position:absolute;
  right:2px;
  bottom:1px;
  font-size:8px;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#5c5660;
  font-size:6px;
}

/* 아래 */
.lower{
  display:grid;
  grid-template-columns:47% 53%;
  gap:4px;
  min-height:0;
}

.panel{
  border:1px solid #562466;
  border-radius:8px;
  background:#0d0912;
  overflow:hidden;
  min-height:0;
}

.title{
  height:26px;
  display:flex;
  align-items:center;
  padding:0 6px;
  border-bottom:1px solid #40204c;
  font-size:8px;
  font-weight:900;
}

.messages{
  height:calc(100% - 58px);
  overflow:hidden;
  padding:5px;
  font-size:7.5px;
  line-height:1.45;
}

.messages b{
  color:#42dfff;
}

.chatInput{
  height:32px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:3px;
  padding:3px;
}

.chatInput input{
  min-width:0;
  border:1px solid #3b3043;
  background:#17121c;
  color:#fff;
  border-radius:6px;
  padding:4px;
  font-size:7px;
}

.chatInput button{
  border:0;
  border-radius:6px;
  background:#8a2edb;
  color:#fff;
  font-size:7px;
  font-weight:900;
  padding:0 8px;
}

/* 선물 */
.rightPanel{
  display:grid;
  grid-template-rows:1fr 56px;
  gap:4px;
  min-height:0;
}

.giftWrap{
  padding:4px;
}

.giftRow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
}

.gift{
  border:1px solid #46234f;
  background:#151019;
  color:#fff;
  border-radius:5px;
  padding:2px 0;
  font-size:6px;
}

.gift span{
  display:block;
  font-size:15px;
}

.gift strong{
  display:block;
  color:#ffd63c;
  font-size:6px;
}

.giftBottom{
  margin-top:3px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:3px;
}

.roseArea{
  border:1px solid #6a2c55;
  border-radius:6px;
  padding:3px;
}

.roseArea b{
  display:block;
  font-size:6.5px;
  color:#ffd43c;
  margin-bottom:2px;
}

.roseBtns{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
}

.roseBtns button{
  border:0;
  border-radius:4px;
  background:#18101c;
  color:#fff;
  font-size:5.5px;
  padding:2px 0;
}

.roseBtns span{
  display:block;
  font-size:11px;
}

.giftBox{
  border:1px solid #9d3eff;
  border-radius:6px;
  background:linear-gradient(145deg,#401552,#14091c);
  color:#fff;
  font-size:6px;
  font-weight:900;
}

.giftBox span{
  display:block;
  font-size:21px;
}

/* 제비 */
.lottery{
  border:1px solid #9d3eff;
  border-radius:7px;
  background:linear-gradient(90deg,#260b31,#100812);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px;
}

.lottery b{
  font-size:7px;
  color:#ffb7ff;
}

.lottery small{
  display:block;
  font-size:5.5px;
  margin-top:2px;
}

.machine{
  font-size:24px;
}

/* 하단 */
.bottomNav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  background:#131019;
  border-top:1px solid #302536;
  border-radius:8px 8px 0 0;
}

.nav{
  text-align:center;
  font-size:7px;
}

.nav span{
  display:block;
  font-size:16px;
}

.charge{
  margin:3px 6px;
  padding:4px 1px;
  border-radius:22px;
  background:#f9005d;
  font-weight:900;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="live">
      <b>● ON AIR</b>
      <span id="clock">00:00:00</span>
    </div>

    <div class="logo">
      👑 K-Talk
      <small>화상 방송 · 최대 13명</small>
    </div>

    <div class="viewer">
      👤 <span id="viewerCount">0</span>
    </div>

  </div>

  <!-- 큰 버튼만 작동 -->
  <div class="roomBar">

    <button
      class="roomBtn publicBtn"
      id="publicBtn"
      onclick="enterRoom('public')">
      📺 1번 일반 방송방
    </button>

    <button
      class="roomBtn secretBtn"
      id="secretBtn"
      onclick="enterRoom('secret')">
      🔐 2번 비밀방
    </button>

  </div>

  <div class="notice">
    💗 출석체크 · 신청곡 5,000원 · 🌹 장미 1개 50원
  </div>

  <div class="main">

    <div class="host">

      <video
        id="hostVideo"
        autoplay
        playsinline>
      </video>

      <div class="hostLive">
        ● ON AIR
      </div>

      <div class="attendance">
        ʚ 💗 출석체크 💗 ɞ
      </div>

      <div
        class="hostName"
        id="hostName">
        👑 호스트
      </div>

    </div>

    <div
      class="guestGrid"
      id="guestGrid">
    </div>

  </div>

  <div class="lower">

    <div class="panel">

      <div class="title">
        💬 실시간 채팅
      </div>

      <div
        class="messages"
        id="messages">

        <div>
          <b>K-Talk</b>
          방송방에 오신 것을 환영합니다.
        </div>

        <div>
          <b>안내</b>
          즐겁게 이용해 주세요. ❤️
        </div>

        <div>
          <b>관리자</b>
          좋은 방송 감사합니다. 💜
        </div>

      </div>

      <div class="chatInput">

        <input
          id="chatText"
          placeholder="메시지 입력">

        <button onclick="sendChat()">
          전송
        </button>

      </div>

    </div>

    <div class="rightPanel">

      <div class="panel giftWrap">

        <div class="title">
          🎁 선물 / 후원
        </div>

        <div class="giftRow">

          <button
            class="gift"
            onclick="sendGift('장미',50)">
            <span>🌹</span>
            장미
            <strong>50</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('하트',100)">
            <span>💖</span>
            하트
            <strong>100</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('별',200)">
            <span>⭐</span>
            별
            <strong>200</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('자동차',500)">
            <span>🚗</span>
            자동차
            <strong>500</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('고래',1000)">
            <span>🐋</span>
            고래
            <strong>1000</strong>
          </button>

        </div>

        <div class="giftBottom">

          <div class="roseArea">

            <b>🌹 장미 선물</b>

            <div class="roseBtns">

              <button onclick="sendRose(1)">
                <span>🌹</span>1
              </button>

              <button onclick="sendRose(5)">
                <span>🌹</span>5
              </button>

              <button onclick="sendRose(10)">
                <span>🌹</span>10
              </button>

              <button onclick="sendRose(50)">
                <span>💐</span>50
              </button>

              <button onclick="sendRose(100)">
                <span>💐</span>100
              </button>

            </div>

          </div>

          <button
            class="giftBox"
            onclick="openGiftBox()">

            <span>🎁</span>
            선물상자

          </button>

        </div>

      </div>

      <div
        class="lottery"
        onclick="drawLottery()">

        <div>
          <b>🎯 제비뽑기 이벤트</b>
          <small>
            아침 · 점심 · 저녁 하루 3회
          </small>
        </div>

        <div class="machine">
          🎰
        </div>

      </div>

    </div>

  </div>

  <div class="bottomNav">

    <div class="nav">
      <span>🏠</span>
      홈
    </div>

    <div class="nav">
      <span>👤</span>
      마이페이지
    </div>

    <div class="nav charge">
      <span>🪙</span>
      충전
    </div>

    <div class="nav">
      <span>🔔</span>
      알림
    </div>

    <div class="nav">
      <span>⚙️</span>
      설정
    </div>

  </div>

</div>

<script type="module">

import {
  joinRoom,
  selfId
} from 'https://esm.run/trystero'

let room=null
let stream=null

let selectedRoom='public'
let myRole='guest'
let myName='참가자'

const peers={}
const peerStreams={}

const guestGrid=
document.getElementById('guestGrid')

/* 참가자 1~13 */
for(let i=1;i<=13;i++){

  const box=
  document.createElement('div')

  box.className='slot'

  box.innerHTML=`
    <video
      id="video${i}"
      autoplay
      playsinline>
    </video>

    <div
      class="empty"
      id="empty${i}">
      빈자리
    </div>

    <div class="slotNo">
      ${i}
    </div>

    <div
      class="slotName"
      id="name${i}">
      빈자리
    </div>

    <div class="rose">
      🌹
    </div>
  `

  guestGrid.appendChild(box)
}

/* 큰 버튼 누르면 바로 입장 */
window.enterRoom=
async function(type){

  if(room)return

  selectedRoom=type

  const roomName=
  type==='secret'
  ?'ktalk-secret-7777'
  :'ktalk-public-main'

  try{

    stream=
    await navigator.mediaDevices
    .getUserMedia({

      video:true,

      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }

    })

  }catch(error){

    alert(
      '카메라와 마이크 사용을 허용해 주세요.'
    )

    return
  }

  room=
  joinRoom(
    {
      appId:'ktalk-fit-screen-2026'
    },
    roomName
  )

  const profile=
  room.makeAction('profile')

  const chat=
  room.makeAction('chat')

  const gift=
  room.makeAction('gift')

  window.profileAction=profile
  window.chatAction=chat
  window.giftAction=gift

  /*
    처음에는 참가자로 입장.
    방에 호스트가 없으면
    첫 입장자가 자동 호스트가 됨.
  */
  myRole='guest'
  myName='참가자'

  peers[selfId]={
    name:myName,
    role:myRole
  }

  peerStreams[selfId]=stream

  profile.onMessage=
  (data,{peerId})=>{

    peers[peerId]=data

    render()
  }

  chat.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  gift.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  room.onPeerJoin=
  peerId=>{

    profile.send(
      {
        name:myName,
        role:myRole
      },
      {
        target:peerId
      }
    )

    room.addStream(
      stream,
      {
        target:peerId
      }
    )
  }

  room.onPeerLeave=
  peerId=>{

    delete peers[peerId]
    delete peerStreams[peerId]

    render()
  }

  room.onPeerStream=
  (incoming,peerId)=>{

    peerStreams[peerId]=incoming

    render()
  }

  room.addStream(stream)

  profile.send({
    name:myName,
    role:myRole
  })

  render()

  /*
    호스트가 없으면
    첫 번째 사람이 자동 호스트
  */
  setTimeout(()=>{

    const hostExists=
    Object.keys(peers)
    .some(
      id=>
      id!==selfId &&
      peers[id]?.role==='host'
    )

    if(!hostExists){

      myRole='host'
      myName='호스트'

      peers[selfId]={
        name:myName,
        role:'host'
      }

      profile.send({
        name:myName,
        role:'host'
      })

      render()
    }

  },1000)
}

/* 화면 */
function render(){

  const ids=
  Object.keys(peers)

  document
  .getElementById('viewerCount')
  .textContent=
  ids.length

  const hostId=
  ids.find(
    id=>
    peers[id]?.role==='host'
  )

  const hostVideo=
  document.getElementById(
    'hostVideo'
  )

  if(
    hostId &&
    peerStreams[hostId]
  ){

    hostVideo.srcObject=
    peerStreams[hostId]

    hostVideo.muted=
    hostId===selfId

    document
    .getElementById('hostName')
    .textContent=
    '👑 '+
    (
      peers[hostId]?.name
      ||
      '호스트'
    )

  }else{

    hostVideo.srcObject=null

    document
    .getElementById('hostName')
    .textContent=
    '👑 호스트 대기'
  }

  const guests=
  ids.filter(
    id=>id!==hostId
  )

  for(let i=1;i<=13;i++){

    const peerId=
    guests[i-1]

    const video=
    document.getElementById(
      'video'+i
    )

    const empty=
    document.getElementById(
      'empty'+i
    )

    const name=
    document.getElementById(
      'name'+i
    )

    if(peerId){

      empty.style.display='none'

      name.textContent=
      peers[peerId]?.name
      ||
      '참가자 '+i

      if(peerStreams[peerId]){

        video.srcObject=
        peerStreams[peerId]

        video.muted=
        peerId===selfId
      }

    }else{

      video.srcObject=null

      empty.style.display='flex'

      name.textContent='빈자리'
    }
  }
}

/* 글자 안전 처리 */
function safe(text){

  return String(text)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
}

/* 채팅 추가 */
function addMessage(
  name,
  text
){

  const line=
  document.createElement('div')

  line.innerHTML=
  '<b>'+
  safe(name)+
  '</b> '+
  safe(text)

  document
  .getElementById('messages')
  .appendChild(line)
}

/* 채팅 전송 */
window.sendChat=
function(){

  if(!window.chatAction)return

  const input=
  document.getElementById(
    'chatText'
  )

  const text=
  input.value.trim()

  if(!text)return

  addMessage(
    myName,
    text
  )

  window.chatAction.send({
    name:myName,
    text:text
  })

  input.value=''
}

/* 선물 */
window.sendGift=
function(name,price){

  if(!window.giftAction)return

  const text=
  `🎁 ${name} 선물 ${price}원`

  addMessage(
    myName,
    text
  )

  window.giftAction.send({
    name:myName,
    text:text
  })
}

/* 장미 */
window.sendRose=
function(count){

  if(!window.giftAction)return

  const text=
  `🌹 장미 ${count}개 선물`

  addMessage(
    myName,
    text
  )

  window.giftAction.send({
    name:myName,
    text:text
  })
}

/* 선물상자 */
window.openGiftBox=
function(){

  if(!window.giftAction)return

  const text=
  '🎁 선물상자가 열렸습니다.'

  addMessage(
    myName,
    text
  )

  window.giftAction.send({
    name:myName,
    text:text
  })
}

/* 제비 */
window.drawLottery=
function(){

  const prizes=[
    '꽝',
    '꽝',
    '장미 1개',
    '장미 2개',
    '장미 3개',
    '장미 4개',
    '장미 5개'
  ]

  const result=
  prizes[
    Math.floor(
      Math.random()*
      prizes.length
    )
  ]

  alert(
    '제비뽑기 결과 : '+
    result
  )
}

/* 엔터 채팅 */
document
.getElementById('chatText')
.addEventListener(
  'keydown',
  event=>{

    if(event.key==='Enter'){
      window.sendChat()
    }
  }
)

/* 시계 */
setInterval(()=>{

  const now=
  new Date()

  document
  .getElementById('clock')
  .textContent=

  String(
    now.getHours()
  ).padStart(2,'0')
  +
  ':'
  +
  String(
    now.getMinutes()
  ).padStart(2,'0')
  +
  ':'
  +
  String(
    now.getSeconds()
  ).padStart(2,'0')

},1000)

</script>

</body>
</html>
