<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#030305;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;
}
button,input{font-family:inherit}
button{cursor:pointer}

.app{
  width:100vw;height:100dvh;padding:5px;
  display:grid;
  grid-template-rows:46px 28px minmax(0,1fr) 52px;
  gap:4px;overflow:hidden;
}

/* 상단 */
.header{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
}
.live{font-size:9px;font-weight:900}
.liveBadge{
  display:inline-block;background:#ed1748;border-radius:6px;
  padding:5px 7px;margin-right:4px;
}
.logo{text-align:center;color:#ffd431;font-size:20px;font-weight:900}
.logo small{display:block;color:#fff;font-size:7px;margin-top:3px}
.viewer{text-align:right;font-size:9px}

/* 광고 */
.notice{
  display:flex;align-items:center;justify-content:center;
  border:1px solid #47224e;border-radius:6px;
  font-size:7px;font-weight:900;white-space:nowrap;
}
.yellow{color:#ffd531}
.pink{color:#ff47ad}

/* 전체 가운데 */
.stage{
  min-width:0;min-height:0;
  display:grid;
  grid-template-columns:46% 54%;
  grid-template-rows:58% 42%;
  gap:4px;overflow:hidden;
}

/* 호스트 */
.host{
  grid-column:1;grid-row:1;
  position:relative;min-width:0;min-height:0;
  overflow:hidden;border:1px solid #4b2752;
  border-radius:6px;background:#07070a;
}
.host video{
  width:100%;height:100%;object-fit:cover;
  object-position:center 30%;background:#09090b;
}
.hostLive{
  position:absolute;top:6px;left:6px;z-index:6;
  color:#ff3151;font-size:8px;font-weight:900;
}
.attendance{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  z-index:7;border:1px solid #ff28cb;border-radius:18px;
  background:rgba(63,0,69,.88);color:#ffd532;
  padding:4px 8px;font-size:7px;font-weight:900;white-space:nowrap;
}
.hostName{
  position:absolute;left:6px;bottom:6px;z-index:7;
  background:rgba(0,0,0,.82);color:#ffd42e;
  border-radius:5px;padding:4px 6px;font-size:7px;font-weight:900;
}
.mediaControls{
  position:absolute;right:6px;bottom:6px;z-index:10;
  display:flex;gap:4px;
}
.mediaBtn{
  width:31px;height:29px;border:1px solid #777;border-radius:7px;
  background:rgba(0,0,0,.8);color:#fff;font-size:15px;
}
.mediaBtn.off{background:#68131c;border-color:#ff4055}

/* 게스트 */
.guests{
  grid-column:2;grid-row:1;
  min-width:0;min-height:0;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(5,minmax(0,1fr));
  gap:3px;overflow:hidden;
}
.slot{
  position:relative;min-width:0;min-height:0;
  overflow:hidden;border:1px solid #312e37;
  border-radius:5px;background:#0b0b0e;
}
.slot video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center 30%;background:#0a0a0d;
}
.slotNo{
  position:absolute;left:3px;top:3px;z-index:6;
  width:17px;height:17px;display:flex;
  align-items:center;justify-content:center;border-radius:4px;
  background:#777;font-size:8px;font-weight:900;
}
.slot:nth-child(1) .slotNo{background:#f5c515;color:#111}
.slot:nth-child(2) .slotNo{background:#e91e67}
.slot:nth-child(3) .slotNo{background:#ef790c}
.slot:nth-child(4) .slotNo{background:#1ca8df}
.slot:nth-child(5) .slotNo{background:#6327e9}
.slot:nth-child(6) .slotNo{background:#1fc052}
.slotName{
  position:absolute;left:4px;bottom:3px;z-index:6;
  font-size:6px;font-weight:900;line-height:1.15;
  text-shadow:0 1px 3px #000;
}
.slotName small{display:block;color:#ff527b;font-size:5.5px}
.muteIcon{position:absolute;right:3px;top:3px;z-index:7;font-size:8px}
.guestRose{position:absolute;right:4px;bottom:3px;z-index:7;font-size:9px}
.empty{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:#393940;font-size:6px;
}
.slot:nth-child(13){grid-column:1;grid-row:5}

/* 채팅 */
.chat{
  grid-column:1;grid-row:2;
  min-width:0;min-height:0;overflow:hidden;
  display:grid;grid-template-rows:25px minmax(0,1fr) 34px;
  border:1px solid #47234e;border-radius:6px;background:#07070a;
}
.chatTabs{
  display:grid;grid-template-columns:1fr 1fr;
  border-bottom:1px solid #39203e;
}
.chatTabs div{
  display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:900;
}
.chatTabs div:first-child{color:#f1a9ff}
.messages{
  min-height:0;overflow-y:auto;padding:5px;
  font-size:6.5px;line-height:1.45;scrollbar-width:none;
}
.messages::-webkit-scrollbar{display:none}
.messages div{margin-bottom:2px}
.messages b{color:#3ddcff}
.messages .green{color:#32dc71}
.chatInput{
  display:grid;grid-template-columns:minmax(0,1fr) 40px 30px;
  gap:3px;padding:3px;
}
.chatInput input{
  min-width:0;border:1px solid #312536;border-radius:5px;
  background:#171419;color:#fff;padding:4px;font-size:6px;
}
.send{
  border:0;border-radius:5px;background:#8228d2;
  color:#fff;font-size:6px;font-weight:900;
}
.chatGift{
  border:1px solid #762731;border-radius:5px;
  background:#16090c;font-size:13px;
}

/* 오른쪽 아래 */
.rightBottom{
  grid-column:2;grid-row:2;
  min-width:0;min-height:0;
  display:grid;
  grid-template-rows:58% 42%;
  gap:4px;overflow:hidden;
}

/* 선물 */
.giftsPanel{
  min-width:0;min-height:0;overflow:hidden;
  border:1px solid #47234e;border-radius:6px;
  background:#08080b;padding:4px;
}
.giftTitle{
  height:12px;font-size:6.5px;line-height:10px;
}
.giftTop{
  height:50px;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:2px;
}
.giftBtn{
  min-width:0;border:0;background:transparent;color:#fff;
  text-align:center;padding:0;font-size:5.5px;white-space:nowrap;
}
.giftBtn .icon{
  display:block;font-size:18px;line-height:20px;
}
.giftBtn .giftName{display:block}
.giftBtn strong{
  display:block;color:#ffd331;font-size:5.3px;margin-top:1px;
}

/* 아래 장미와 상자 */
.giftBottom{
  height:68px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 29%;
  gap:3px;
}
.rosePanel{
  min-width:0;overflow:hidden;
  border:1px solid #57265b;border-radius:5px;padding:3px;
}
.roseTitle{
  color:#ffd331;font-size:6px;font-weight:900;
  height:11px;line-height:9px;
}
.roseRow{
  height:49px;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:1px;
}
.roseBtn{
  min-width:0;overflow:hidden;
  border:0;background:transparent;color:#fff;
  text-align:center;font-size:5.2px;white-space:nowrap;padding:0;
}
.rosePicture{
  display:block;font-size:17px;line-height:18px;height:19px;
}
.roseBtn strong{
  display:block;color:#ffd331;font-size:5.3px;margin-top:1px;
}
.giftBox{
  min-width:0;height:68px;
  border:1px solid #a13bef;border-radius:6px;
  background:radial-gradient(circle,#47165a,#16091b);
  color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:2px;
}
.giftBoxIcon{font-size:27px;line-height:28px}
.giftBoxTitle{font-size:6.5px;font-weight:900}
.giftBoxDesc{font-size:4.8px;line-height:1.15;margin-top:2px}

/* 제비뽑기 */
.lottery{
  min-width:0;min-height:0;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) 58px;
  gap:3px;border:1px solid #9332b6;border-radius:6px;
  background:linear-gradient(90deg,#240c2f,#100712);
  padding:3px;
}
.lotteryTitle{
  color:#f2abff;font-size:7px;font-weight:900;text-align:center;
}
.lotterySub{
  font-size:5px;text-align:center;margin:1px 0 2px;
}
.drawTimes{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;
}
.drawItem{
  min-width:0;border:1px solid #3b2643;border-radius:4px;
  background:#130d17;padding:2px 1px;text-align:center;
}
.drawItem b{display:block;color:#ffd454;font-size:5.5px}
.drawItem small{display:block;font-size:5px;margin:1px 0}
.drawItem button{
  width:100%;border:0;border-radius:3px;
  background:#742080;color:#fff;font-size:5px;padding:2px 0;
}
.lotteryMachine{
  display:flex;align-items:center;justify-content:center;font-size:34px;
}

/* 하단 */
.bottom{
  display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;border-top:1px solid #211c25;background:#07070a;
}
.nav{
  border:0;background:transparent;color:#fff;
  text-align:center;font-size:7px;
}
.nav span{display:block;font-size:17px;margin-bottom:1px}
.charge{
  margin:2px 6px;border-radius:24px;
  background:#ef0054;padding:4px 0;font-weight:900;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="live">
      <span class="liveBadge">● ON AIR</span>
      <span id="clock">00:00:00</span>
    </div>

    <div class="logo">
      👑 K-Talk
      <small>화상 방송 · 최대 13명</small>
    </div>

    <div class="viewer">
      👤 <span id="viewerCount">1</span>　🔔 ⋮
    </div>
  </div>

  <div class="notice">
    <span class="yellow">⭐ 출석체크 눌러주세요 ⭐</span>
    　신청곡 5,000원　
    <span class="pink">★ 광고 문의 환영합니다 ★</span>
  </div>

  <div class="stage">

    <div class="host">
      <video id="hostVideo" autoplay playsinline></video>
      <div class="hostLive">● ON AIR</div>

      <button class="attendance" onclick="attendanceCheck()">
        💗 출석체크
      </button>

      <div class="hostName" id="hostName">👑 호스트</div>

      <div class="mediaControls">
        <button id="cameraBtn" class="mediaBtn" onclick="toggleCamera()">📷</button>
        <button id="micBtn" class="mediaBtn" onclick="toggleMic()">🎤</button>
      </div>
    </div>

    <div id="guestGrid" class="guests"></div>

    <div class="chat">

      <div class="chatTabs">
        <div>채팅</div>
        <div>참가자 (13)</div>
      </div>

      <div id="messages" class="messages">
        <div><b>채팅방 관리자</b> 좋은 방송 감사합니다! 💜</div>
        <div class="green">민수 즐겁게 듣고 있어요! ❤️</div>
        <div><b>이태훈</b> 신곡 너무 좋아요 👍</div>
        <div><b>시청★</b> 신청곡 이벤트도 최고!</div>
        <div><b>감성남자님</b> 선물! 🎁</div>
        <div class="green">해피걸 노래 최고예요! 👏</div>
      </div>

      <div class="chatInput">
        <input id="chatText" placeholder="메시지를 입력하세요...">
        <button class="send" onclick="sendChat()">전송</button>
        <button class="chatGift" onclick="openGiftBox()">🎁</button>
      </div>

    </div>

    <div class="rightBottom">

      <!-- 선물 / 후원 -->
      <div class="giftsPanel">

        <div class="giftTitle">선물 / 후원</div>

        <!-- 5개 나란히 -->
        <div class="giftTop">

          <button class="giftBtn" onclick="sendGift('장미',100)">
            <span class="icon">🌹</span>
            <span class="giftName">장미</span>
            <strong>🪙 100</strong>
          </button>

          <button class="giftBtn" onclick="sendGift('하트',300)">
            <span class="icon">❤️</span>
            <span class="giftName">하트</span>
            <strong>🪙 300</strong>
          </button>

          <button class="giftBtn" onclick="sendGift('별',500)">
            <span class="icon">⭐</span>
            <span class="giftName">별</span>
            <strong>🪙 500</strong>
          </button>

          <button class="giftBtn" onclick="sendGift('풍선',1000)">
            <span class="icon">🎈</span>
            <span class="giftName">풍선</span>
            <strong>🪙 1,000</strong>
          </button>

          <button class="giftBtn" onclick="sendGift('슈퍼하트',10000)">
            <span class="icon">❤️‍🔥</span>
            <span class="giftName">슈퍼하트</span>
            <strong>🪙 10,000</strong>
          </button>

        </div>

        <!-- 장미 1 / 5 / 10 + 선물상자 -->
        <div class="giftBottom">

          <div class="rosePanel">

            <div class="roseTitle">🌹 장미 선물</div>

            <div class="roseRow">

              <button class="roseBtn" onclick="sendRose(1)">
                <span class="rosePicture">🌹</span>
                장미 1송이
                <strong>🪙 10</strong>
              </button>

              <button class="roseBtn" onclick="sendRose(5)">
                <span class="rosePicture">🌹</span>
                장미 5송이
                <strong>🪙 50</strong>
              </button>

              <button class="roseBtn" onclick="sendRose(10)">
                <span class="rosePicture">🌹</span>
                장미 10송이
                <strong>🪙 100</strong>
              </button>

            </div>

          </div>

          <button class="giftBox" onclick="openGiftBox()">
            <span class="giftBoxIcon">🎁</span>
            <span class="giftBoxTitle">선물 상자</span>
            <span class="giftBoxDesc">
              다른 선물을<br>선택할 수 있어요!
            </span>

        </div>

      </div>

      <!-- 제비뽑기 -->
      <div class="lottery">

        <div>

          <div class="lotteryTitle">제비뽑기 이벤트</div>
          <div class="lotterySub">하루 3번의 행운!</div>

          <div class="drawTimes">

            <div class="drawItem">
              <b>☀️ 아침</b>
              <small>09:00</small>
              <button onclick="drawLottery('아침')">뽑기</button>
            </div>

            <div class="drawItem">
              <b>☀️ 점심</b>
              <small>13:00</small>
              <button onclick="drawLottery('점심')">뽑기</button>
            </div>

            <div class="drawItem">
              <b>🌙 저녁</b>
              <small>20:00</small>
              <button onclick="drawLottery('저녁')">뽑기</button>
            </div>

          </div>

        </div>

        <div class="lotteryMachine">🎰</div>

      </div>

    </div>

  </div>

  <div class="bottom">
    <button class="nav"><span>🏠</span>홈</button>
    <button class="nav"><span>👤</span>마이페이지</button>
    <button class="nav charge"><span>🪙</span>충전하기</button>
    <button class="nav"><span>🔔</span>알림</button>
    <button class="nav"><span>⚙️</span>설정</button>
  </div>

</div>

<script type="module">
import {joinRoom,selfId} from 'https://esm.run/trystero'

let room=null
let localStream=null
let cameraOn=true
let micOn=true
let profileAction=null
let chatAction=null
let giftAction=null

const peers=new Set()
const names={}
const peerStreams={}

peers.add(selfId)
names[selfId]='나'

const guestGrid=document.getElementById('guestGrid')

for(let i=1;i<=13;i++){
  const slot=document.createElement('div')
  slot.className='slot'

  slot.innerHTML=`
    <video id="video${i}" autoplay playsinline></video>
    <div class="empty" id="empty${i}">빈자리</div>
    <div class="slotNo">${i}</div>
    <div class="muteIcon">🔇</div>
    <div class="slotName" id="name${i}">
      게스트${i}<small>♡ 0</small>
    </div>
    <div class="guestRose">🌹</div>
  `
  guestGrid.appendChild(slot)
}

function getIds(){
  return [...peers].sort()
}

function getHostId(){
  const ids=getIds()
  return ids[0]||selfId
}

function render(){
  const ids=getIds()
  const hostId=getHostId()

  document.getElementById('viewerCount').textContent=ids.length

  const hostVideo=document.getElementById('hostVideo')

  document.getElementById('hostName').textContent=
    '👑 '+(names[hostId]||'호스트')

  if(peerStreams[hostId]){
    hostVideo.srcObject=peerStreams[hostId]
    hostVideo.muted=hostId===selfId
  }

  const guestIds=ids.filter(id=>id!==hostId)

  for(let i=1;i<=13;i++){
    const peerId=guestIds[i-1]
    const video=document.getElementById('video'+i)
    const empty=document.getElementById('empty'+i)
    const name=document.getElementById('name'+i)

    if(peerId){
      empty.style.display='none'
      name.innerHTML=(names[peerId]||'게스트'+i)+'<small>♡ 0</small>'

      if(peerStreams[peerId]){
        video.srcObject=peerStreams[peerId]
        video.muted=peerId===selfId
      }
    }else{
      empty.style.display='flex'
      video.srcObject=null
      name.innerHTML='게스트'+i+'<small>♡ 0</small>'
    }
  }
}

async function startRoom(){
  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user'},
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    })
  }catch(e){
    alert('카메라와 마이크 사용을 허용해 주세요.')
    return
  }

  peerStreams[selfId]=localStream

  room=joinRoom(
    {appId:'ktalk-final-photo-11119'},
    'ktalk-public-main'
  )

  profileAction=room.makeAction('profile')
  chatAction=room.makeAction('chat')
  giftAction=room.makeAction('gift')

  room.addStream(localStream)

  room.onPeerJoin=peerId=>{
    peers.add(peerId)

    room.addStream(localStream,{target:peerId})

    profileAction.send(
      {name:names[selfId]},
      {target:peerId}
    )

    render()
  }

  room.onPeerLeave=peerId=>{
    peers.delete(peerId)
    delete names[peerId]
    delete peerStreams[peerId]
    render()
  }

  room.onPeerStream=(stream,peerId)=>{
    peers.add(peerId)
    peerStreams[peerId]=stream
    render()
  }

  profileAction.onMessage=(data,{peerId})=>{
    peers.add(peerId)
    names[peerId]=data?.name||'참가자'
    render()
  }

  chatAction.onMessage=(data,{peerId})=>{
    addMessage(
      data?.name||names[peerId]||'참가자',
      data?.text||''
    )
  }

  giftAction.onMessage=(data,{peerId})=>{
    addMessage(
      data?.name||names[peerId]||'참가자',
      data?.text||''
    )
  }

  profileAction.send({name:names[selfId]})
  render()
}

window.toggleCamera=function(){
  if(!localStream)return
  const track=localStream.getVideoTracks()[0]
  if(!track)return

  cameraOn=!cameraOn
  track.enabled=cameraOn

  const btn=document.getElementById('cameraBtn')
  btn.textContent=cameraOn?'📷':'🔒'
  btn.classList.toggle('off',!cameraOn)
}

window.toggleMic=function(){
  if(!localStream)return
  const track=localStream.getAudioTracks()[0]
  if(!track)return

  micOn=!micOn
  track.enabled=micOn

  const btn=document.getElementById('micBtn')
  btn.textContent=micOn?'🎤':'🔇'
  btn.classList.toggle('off',!micOn)
}

window.attendanceCheck=function(){
  alert('출석체크 완료! ❤️')
}

function safe(text){
  return String(text)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
}

function addMessage(name,text){
  const line=document.createElement('div')
  line.innerHTML='<b>'+safe(name)+'</b> '+safe(text)

  const messages=document.getElementById('messages')
  messages.appendChild(line)
  messages.scrollTop=messages.scrollHeight
}

window.sendChat=function(){
  if(!chatAction)return

  const input=document.getElementById('chatText')
  const text=input.value.trim()

  if(!text)return

  addMessage(names[selfId],text)

  chatAction.send({
    name:names[selfId],
    text
  })

  input.value=''
}

window.sendGift=function(name,price){
  const text='🎁 '+name+' 🪙 '+price

  addMessage(names[selfId],text)

  if(giftAction){
    giftAction.send({

      text
    })
  }
}

window.drawLottery=function(time){
  const prizes=[

    '장미 2개',
    '장미 3개',
    '장미 4개',
