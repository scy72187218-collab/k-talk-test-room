<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk 13명 최종방</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090711;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:14px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.brand{
  font-size:24px;
  font-weight:900;
  color:#ffd76a;
}

.sub{
  font-size:12px;
  color:#aaa;
  margin-top:4px;
}

.on{
  background:#ff2e6d;
  padding:7px 10px;
  border-radius:10px;
  font-weight:800;
}

/* 호스트 화면 */
.main{
  margin-top:12px;
  position:relative;
  background:#15151c;
  border-radius:16px;
  overflow:hidden;
  height:280px;
  max-height:280px;
}

.main video,
.slot video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.main video{
  display:block;
  max-height:280px;
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  text-align:center;
  padding:20px;
}

/* =========================
   수정 1 : 호스트 파장
   처음부터 끝까지 길게 표시
   ========================= */
.wave-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  height:48px;
  z-index:10;
  pointer-events:none;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.65),
    rgba(0,0,0,.18),
    transparent
  );
}

#waveCanvas{
  display:block;
  width:100%;
  height:48px;
}

.host-label{
  position:absolute;
  left:8px;
  bottom:49px;
  z-index:11;
  background:rgba(0,0,0,.62);
  color:#ffd76a;
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.controls{
  display:flex;
  gap:8px;
  margin-top:12px;
}

button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:900;
  color:#fff;
  font-size:15px;
}

.start{background:#8d46ff}
.stop{background:#333}

.status{
  margin-top:10px;
  padding:10px;
  background:#1c1524;
  border-radius:10px;
  color:#ffd76a;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:10px;
}

.slot{
  height:80px;
  background:#211829;
  border:1px solid #4a3457;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  font-size:11px;
  text-align:center;
}

.slot.me{
  border:2px solid #ffd700;
}

.label{
  position:absolute;
  left:4px;
  bottom:4px;
  background:#000a;
  padding:2px 5px;
  border-radius:6px;
  font-size:10px;
}

.badge{
  display:inline-block;
  background:#ffd700;
  color:#111;
  font-weight:900;
  padding:5px 9px;
  border-radius:8px;
  margin-bottom:7px;
}

/* =========================
   수정 2 : 장미 조금 아래
   ========================= */
.rose-gifts{
  margin-top:18px;
  padding-top:5px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.rose-title{
  width:100%;
  font-size:13px;
  font-weight:900;
  color:#ffb6cf;
  margin-bottom:3px;
}

.rose-btn{
  flex:1 1 58px;
  min-width:58px;
  background:#241832;
  border:1px solid #563d69;
  padding:9px 6px;
  border-radius:10px;
  font-size:12px;
  color:#fff;
  text-align:center;
}

.rose-btn span{
  display:block;
  font-size:20px;
  line-height:22px;
  margin-bottom:2px;
}

@media(max-width:420px){
  .wrap{padding:10px}
  .main{height:260px}
  .grid{gap:5px}
  .slot{height:72px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="badge">최종 · 최대 13명</div>

  <div class="top">
    <div>
      <div class="brand">👑 K-Talk</div>
      <div class="sub">13명 화상채팅 · 접속 순서 무관</div>
    </div>
    <div class="on">ON AIR</div>
  </div>

  <div class="main">

    <div id="ph" class="placeholder">
      아래 ‘방송 시작’을 누르세요
    </div>

    <video
      id="localVideo"
      autoplay
      playsinline
      muted>
    </video>

    <div class="host-label">👑 호스트</div>

    <!-- 호스트 전체 폭 파장 -->
    <div class="wave-wrap">
      <canvas id="waveCanvas"></canvas>
    </div>

  </div>

  <div class="controls">
    <button
      class="start"
      onclick="startRoom()">
      📹 방송 시작
    </button>

    <button
      class="stop"
      onclick="stopRoom()">
      방송 종료
    </button>
  </div>

  <div id="status" class="status">
    대기 중
  </div>

  <div id="grid" class="grid"></div>

  <!-- 장미만 조금 아래로 내림 -->
  <div class="rose-gifts">
    <div class="rose-title">🌹 장미 선물</div>

    <button class="rose-btn">
      <span>🌹</span>
      1
    </button>

    <button class="rose-btn">
      <span>🌹</span>
      10
    </button>

    <button class="rose-btn">
      <span>💐</span>
      20
    </button>

    <button class="rose-btn">
      <span>💐</span>
      30
    </button>

    <button class="rose-btn">
      <span>🌹</span>
      50
    </button>
  </div>

</div>


<script>
const MAX_USERS = 13;

const BASE =
  'ktalk-final13-v20260816-slot-';

let localStream = null;
let peer = null;
let mySlot = 0;
let syncTimer = null;

const calls = new Map();
const pending = new Map();
const lastSeen = new Map();
const retryAfter = new Map();

function $(id){
  return document.getElementById(id);
}

function setStatus(t){
  $('status').textContent = t;
}

function slotName(slot){
  return slot === 1
    ? '진행자'
    : '참가자 ' + slot;
}


/* =========================
   참가자 칸 만들기
   ========================= */
function buildGrid(){

  const grid = $('grid');

  grid.innerHTML = '';

  for(let i=1;i<=MAX_USERS;i++){

    const d =
      document.createElement('div');

    d.className = 'slot';
    d.id = 'slot-' + i;
    d.textContent = slotName(i);

    grid.appendChild(d);
  }
}

buildGrid();


function getSlotFromPeerId(id){

  const m =
    String(id || '')
    .match(/slot-(\d+)$/);

  return m
    ? Number(m[1])
    : 0;
}


function resetSlot(slot){

  const box =
    $('slot-' + slot);

  if(!box) return;

  box.className =
    'slot' +
    (slot === mySlot ? ' me' : '');

  box.innerHTML =
    slot === mySlot
    ? slotName(slot) + '<br>· 나 ·'
    : slotName(slot);
}


function renderRemote(slot, stream){

  if(!slot || slot === mySlot)
    return;

  const box =
    $('slot-' + slot);

  if(!box) return;

  box.innerHTML = '';

  const v =
    document.createElement('video');

  v.autoplay = true;
  v.playsInline = true;
  v.srcObject = stream;

  const lab =
    document.createElement('div');

  lab.className = 'label';
  lab.textContent =
    slotName(slot);

  box.appendChild(v);
  box.appendChild(lab);

  lastSeen.set(
    slot,
    Date.now()
  );
}


function closeSlot(
  slot,
  reset = true
){

  const call =
    calls.get(slot);

  if(call){
    try{
      call.close();
    }catch(e){}
  }

  calls.delete(slot);
  pending.delete(slot);
  lastSeen.delete(slot);

  if(reset)
    resetSlot(slot);
}


function attachCall(slot, call){

  if(
    !slot ||
    slot === mySlot ||
    !call
  ) return;

  const old =
    calls.get(slot);

  if(old && old !== call){

    try{
      old.close();
    }catch(e){}
  }

  calls.set(slot, call);

  pending.delete(slot);

  lastSeen.set(
    slot,
    Date.now()
  );


  call.on(
    'stream',
    remoteStream => {

      calls.set(slot, call);

      pending.delete(slot);

      lastSeen.set(
        slot,
        Date.now()
      );

      renderRemote(
        slot,
        remoteStream
      );

      setStatus(
        '✅ 연결됨 · 내 번호 ' +
        mySlot +
        ' · 최대 13명'
      );
    }
  );


  call.on(
    'close',
    () => {

      if(
        calls.get(slot) === call
      ){

        calls.delete(slot);

        pending.delete(slot);

        lastSeen.delete(slot);

        resetSlot(slot);

        retryAfter.set(
          slot,
          Date.now() + 1200
        );
      }
    }
  );


  call.on(
    'error',
    () => {

      if(
        calls.get(slot) === call
      ){

        calls.delete(slot);

        pending.delete(slot);

        lastSeen.delete(slot);

        resetSlot(slot);

        retryAfter.set(
          slot,
          Date.now() + 1200
        );
      }
    }
  );
}


/* =========================
   자리 잡기
   ========================= */
function claimSlot(slot){

  return new Promise(
    resolve => {

      const p =
        new Peer(
          BASE + slot,
          {
            debug:0,

            config:{
              iceServers:[
                {
                  urls:
                  'stun:stun.l.google.com:19302'
                },
                {
                  urls:
                  'stun:stun1.l.google.com:19302'
                }
              ]
            }
          }
        );

      let finished = false;

      const done =
        value => {

          if(finished)
            return;

          finished = true;

          resolve(value);
        };


      p.on(
        'open',
        () => done(p)
      );


      p.on(
        'error',
        () => {

          try{
            p.destroy();
          }catch(e){}

          done(null);
        }
      );


      setTimeout(
        () => {

          if(!finished){

            try{
              p.destroy();
            }catch(e){}

            done(null);
          }

        },
        2200
      );
    }
  );
}


function shouldDial(slot){

  if(
    !peer ||
    !localStream ||
    !mySlot
  )
    return false;

  if(
    slot <= 0 ||
    slot >= mySlot
  )
    return false;

  if(
    calls.has(slot) ||
    pending.has(slot)
  )
    return false;

  if(
    (retryAfter.get(slot) || 0)
    > Date.now()
  )
    return false;

  return true;
}


function dial(slot){

  if(!shouldDial(slot))
    return;

  pending.set(
    slot,
    Date.now()
  );

  let call = null;

  try{

    call =
      peer.call(
        BASE + slot,
        localStream,
        {
          metadata:{
            slot:mySlot
          }
        }
      );

  }catch(e){

    pending.delete(slot);

    retryAfter.set(
      slot,
      Date.now() + 1500
    );

    return;
  }


  if(!call){

    pending.delete(slot);

    retryAfter.set(
      slot,
      Date.now() + 1500
    );

    return;
  }


  let gotStream = false;


  call.on(
    'stream',
    remoteStream => {

      gotStream = true;

      attachCall(
        slot,
        call
      );

      renderRemote(
        slot,
        remoteStream
      );
    }
  );


  call.on(
    'close',
    () => {

      if(
        calls.get(slot) === call
      )
        calls.delete(slot);

      pending.delete(slot);

      lastSeen.delete(slot);

      resetSlot(slot);

      retryAfter.set(
        slot,
        Date.now() + 1200
      );
    }
  );


  call.on(
    'error',
    () => {

      if(
        calls.get(slot) === call
      )
        calls.delete(slot);

      pending.delete(slot);

      lastSeen.delete(slot);

      resetSlot(slot);

      retryAfter.set(
        slot,
        Date.now() + 1200
      );
    }
  );


  setTimeout(
    () => {

      if(!gotStream){

        try{
          call.close();
        }catch(e){}

        if(
          calls.get(slot) === call
        )
          calls.delete(slot);

        pending.delete(slot);

        retryAfter.set(
          slot,
          Date.now() + 1500
        );

        resetSlot(slot);
      }

    },
    7000
  );
}


/* =========================
   자동 연결 복구
   ========================= */
function syncPeers(){

  if(
    !peer ||
    !localStream ||
    !mySlot
  )
    return;


  for(
    let slot=1;
    slot<mySlot;
    slot++
  ){

    if(
      shouldDial(slot)
    )
      dial(slot);
  }


  for(
    const [slot,call]
    of calls.entries()
  ){

    const pc =
      call &&
      call.peerConnection;

    const state =
      pc
      ? pc.connectionState
      : '';


    if(
      state === 'connected'
    ){

      lastSeen.set(
        slot,
        Date.now()
      );

      continue;
    }


    if(
      state === 'failed' ||
      state === 'closed'
    ){

      closeSlot(slot);

      retryAfter.set(
        slot,
        Date.now() + 1200
      );

      continue;
    }


    if(
      state === 'disconnected'
    ){

      const since =
        lastSeen.get(slot)
        || Date.now();

      if(
        Date.now() - since
        > 4500
      ){

        closeSlot(slot);

        retryAfter.set(
          slot,
          Date.now() + 1200
        );
      }
    }
  }


  for(
    const [slot,started]
    of pending.entries()
  ){

    if(
      Date.now() - started
      > 9000
    ){

      pending.delete(slot);

      retryAfter.set(
        slot,
        Date.now() + 1200
      );
    }
  }
}


/* =====================================================
   호스트 음성 파장
   방송 시작부터 끝까지 보이고
   인사 / 대화 / 노래 모두 마이크 음성에 반응
   ===================================================== */

let audioContext = null;
let analyser = null;
let audioSource = null;
let waveAnimation = null;


function setupWave(stream){

  stopWave();

  const canvas =
    $('waveCanvas');

  const ctx =
    canvas.getContext('2d');


  function resizeCanvas(){

    const rect =
      canvas.getBoundingClientRect();

    canvas.width =
      Math.max(
        1,
        Math.floor(
          rect.width *
          window.devicePixelRatio
        )
      );

    canvas.height =
      Math.max(
        1,
        Math.floor(
          rect.height *
          window.devicePixelRatio
        )
      );
  }

  resizeCanvas();


  try{

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = 256;

    analyser.smoothingTimeConstant =
      0.75;

    audioSource =
      audioContext
      .createMediaStreamSource(
        stream
      );

    audioSource.connect(
      analyser
    );

    if(
      audioContext.state ===
      'suspended'
    ){
      audioContext.resume();
    }

  }catch(e){

    console.log(
      '파장 오디오 연결 오류',
      e
    );
  }


  const bars = 64;

  const data =
    new Uint8Array(
      analyser
      ? analyser.frequencyBinCount
      : bars
    );


  function draw(){

    const w =
      canvas.width;

    const h =
      canvas.height;

    ctx.clearRect(
      0,
      0,
      w,
      h
    );


    if(analyser){

      analyser
      .getByteFrequencyData(data);

    }else{

      data.fill(8);
    }


    const gap =
      2 *
      window.devicePixelRatio;

    const barWidth =
      Math.max(
        2 *
        window.devicePixelRatio,
        (w / bars) - gap
      );


    for(
      let i=0;
      i<bars;
      i++
    ){

      const index =
        Math.floor(
          i *
          data.length /
          bars
        );

      const value =
        data[index] || 0;

      /* 말 안 할 때도 아주 작은 파장 유지 */
      const minimum =
        4 *
        window.devicePixelRatio;

      const barHeight =
        Math.max(
          minimum,
          (value / 255) *
          h *
          0.92
        );


      const x =
        i *
        (w / bars);

      const y =
        h - barHeight;


      const gradient =
        ctx.createLinearGradient(
          0,
          h,
          0,
          0
        );

      gradient.addColorStop(
        0,
        '#00d9ff'
      );

      gradient.addColorStop(
        .32,
        '#37ff8b'
      );

      gradient.addColorStop(
        .60,
        '#ffe34f'
      );

      gradient.addColorStop(
        .80,
        '#ff9b3d'
      );

      gradient.addColorStop(
        1,
        '#ff387d'
      );


      ctx.fillStyle =
        gradient;

      ctx.fillRect(
        x,
        y,
        barWidth,
        barHeight
      );
    }


    waveAnimation =
      requestAnimationFrame(
        draw
      );
  }


  draw();
}


function drawIdleWave(){

  const canvas =
    $('waveCanvas');

  if(!canvas) return;

  const ctx =
    canvas.getContext('2d');

  const rect =
    canvas.getBoundingClientRect();

  canvas.width =
    Math.max(
      1,
      Math.floor(
        rect.width *
        window.devicePixelRatio
      )
    );

  canvas.height =
    Math.max(
      1,
      Math.floor(
        rect.height *
        window.devicePixelRatio
      )
    );


  const w =
    canvas.width;

  const h =
    canvas.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  const bars = 64;

  const gap =
    2 *
    window.devicePixelRatio;

  const barWidth =
    Math.max(
      2 *
      window.devicePixelRatio,
      (w / bars) - gap
    );


  for(
    let i=0;
    i<bars;
    i++
  ){

    const barHeight =
      (4 +
      Math.sin(i * .7) * 2 +
      2) *
      window.devicePixelRatio;

    const x =
      i *
      (w / bars);

    const y =
      h - barHeight;


    const gradient =
      ctx.createLinearGradient(
        0,
        h,
        0,
        0
      );

    gradient.addColorStop(
      0,
      '#00d9ff'
    );

    gradient.addColorStop(
      .35,
      '#45ff8f'
    );

    gradient.addColorStop(
      .68,
      '#ffe64d'
    );

    gradient.addColorStop(
      1,
      '#ff397c'
    );

    ctx.fillStyle =
      gradient;

    ctx.fillRect(
      x,
      y,
      barWidth,
      barHeight
    );
  }
}


function stopWave(){

  if(waveAnimation){

    cancelAnimationFrame(
      waveAnimation
    );

    waveAnimation = null;
  }


  if(audioSource){

    try{
      audioSource.disconnect();
    }catch(e){}

    audioSource = null;
  }


  analyser = null;


  if(audioContext){

    try{
      audioContext.close();
    }catch(e){}

    audioContext = null;
  }


  drawIdleWave();
}


/* =========================
   방송 시작
   ========================= */
async function startRoom(){

  if(
    localStream ||
    peer
  )
    return;


  try{

    localStream =
      await navigator
      .mediaDevices
      .getUserMedia({

        video:{
          facingMode:'user',
          width:{
            ideal:640
          },
          height:{
            ideal:360
          },
          frameRate:{
            ideal:15,
            max:20
          }
        },

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });


    $('localVideo').srcObject =
      localStream;

    $('ph').style.display =
      'none';


    /* 마이크 들어오면 파장 바로 시작 */
    setupWave(
      localStream
    );


  }catch(e){

    localStream = null;

    alert(
      '카메라와 마이크를 허용해 주세요.'
    );

    return;
  }


  setStatus(
    '13명 방 연결 중...'
  );


  for(
    let i=1;
    i<=MAX_USERS;
    i++
  ){

    const p =
      await claimSlot(i);

    if(p){

      peer = p;

      mySlot = i;

      break;
    }
  }


  if(!peer){

    localStream
    .getTracks()
    .forEach(
      t => t.stop()
    );

    localStream = null;

    $('localVideo').srcObject =
      null;

    $('ph').style.display =
      'flex';

    stopWave();

    setStatus(
      '⛔ 이 방은 최대 13명입니다.'
    );

    alert(
      '현재 13명이 접속 중입니다.'
    );

    return;
  }


  for(
    let i=1;
    i<=MAX_USERS;
    i++
  )
    resetSlot(i);


  peer.on(
    'call',
    call => {

      const slot =
        getSlotFromPeerId(
          call.peer
        );

      if(
        !slot ||
        slot === mySlot
      ){

        try{
          call.close();
        }catch(e){}

        return;
      }


      try{

        call.answer(
          localStream
        );

      }catch(e){}


      attachCall(
        slot,
        call
      );
    }
  );


  peer.on(
    'disconnected',
    () => {

      setStatus(
        '연결 복구 중...'
      );

      try{
        peer.reconnect();
      }catch(e){}
    }
  );


  peer.on(
    'error',
    err => {

      if(
        err &&
        (
          err.type ===
          'peer-unavailable'
          ||
          err.type ===
          'network'
        )
      )
        return;

      console.log(err);
    }
  );


  syncPeers();

  syncTimer =
    setInterval(
      syncPeers,
      2000
    );


  setStatus(

    mySlot === 1

    ? '✅ 진행자 입장 완료 · 최대 13명'

    : '✅ 참가자 ' +
      mySlot +
      ' 입장 완료 · 최대 13명'
  );
}


/* =========================
   방송 종료
   ========================= */
function stopRoom(){

  if(syncTimer){

    clearInterval(
      syncTimer
    );

    syncTimer = null;
  }


  for(
    const slot
    of Array.from(
      calls.keys()
    )
  ){

    closeSlot(
      slot,
      false
    );
  }


  calls.clear();

  pending.clear();

  lastSeen.clear();

  retryAfter.clear();


  try{

    if(peer)
      peer.destroy();

  }catch(e){}


  if(localStream){

    localStream
    .getTracks()
    .forEach(
      t => t.stop()
    );
  }


  localStream = null;

  peer = null;

  mySlot = 0;


  $('localVideo').srcObject =
    null;

  $('ph').style.display =
    'flex';


  stopWave();


  for(
    let i=1;
    i<=MAX_USERS;
    i++
  )
    resetSlot(i);


  setStatus(
    '대기 중'
  );
}


/* 처음부터 파장 줄은 보이게 */
window.addEventListener(
  'load',
  drawIdleWave
);


window.addEventListener(
  'resize',
  () => {

    if(!localStream)
      drawIdleWave();
  }
);


window.addEventListener(
  'beforeunload',
  stopRoom
);
</script>
