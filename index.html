order:1px solid #ffffff25;text-align:center;font-size:13px}.empty{height:calc(100dvh - 76px);display:grid;place-items:center;text-align:center;color:#bbb}.empty b{display:block;color:#ffe070;font-size:23px}.empty span{display:block;margin-top:8px}

<body>
<div id="feed" class="feed"></div>
<nav class="bottom">

  <button onclick="alert('친구 기능은 기존 K-Talk 기능과 연결합니다.')"><b>👥</b>친구</button>

<div id="remote" class="remote">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="rshade"></div>
  <button class="rback" onclick="leaveLive()">‹</button>
  <div class="rhead"><b id="remoteTitle">K-Talk LIVE</b><span id="remoteRoom">방송 연결 중...</span></div>
  <div id="remoteStatus" class="rstatus">방송 연결 중...</div>
</div>
<script>
(function(){
  'use strict';
  var SB='https://zupwbfmacwzexyvznlzq.supabase.co';
  var KEY='sb_publishable_AnyCMi4rAgSR2uWg_u1pvw_hHyqWlm3';
  var SEED=[
    'https://zupwbfmacwzexyvznlzq.supabase.co/storage/v1/object/public/ktalk-videos/guest/1788516701116-emysxm.mp4',
    'https://zupwbfmacwzexyvznlzq.supabase.co/storage/v1/object/public/ktalk-videos/guest/1788516656323-4elqcf.mp4',
    'https://zupwbfmacwzexyvznlzq.supabase.co/storage/v1/object/public/ktalk-videos/guest/1788516653502-crprae.mp4'
  ];
  var firstSeedIndex=0,observer=null,viewerPeer=null,viewerSessionId='',pollTimer=null;
  var rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
  function h(extra){var x={apikey:KEY,Authorization:'Bearer '+KEY};if(extra)Object.keys(extra).forEach(function(k){x[k]=extra[k]});return x}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function viewerId(){var id='';try{id=localStorage.getItem('ktalk_viewer_id')||''}catch(e){}if(!id){id='viewer_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);try{localStorage.setItem('ktalk_viewer_id',id)}catch(e){}}return id}
  function tabs(on){return '<div class="tabs"><span'+(on==='live'?' class="on"':'')+'>LIVE</span><span>커뮤니티</span><span>팔로잉</span><span'+(on!=='live'?' class="on"':'')+'>추천</span><span class="search">⌕</span></div>'}
  function videoCard(x,i){var u=esc(x.video_url||SEED[i%SEED.length]),name=esc(x.author_name||'K-Talk'),title=esc(x.title||'추천 동영상');var src=i===0?' src="'+u+'"':' data-src="'+u+'"';return '<section class="card" data-kind="video"><video class="pub" '+(i===0?'autoplay ':'')+'muted loop playsinline webkit-playsinline preload="'+(i===0?'auto':'none')+'"'+src+'></video><div class="loading"><div><b>♛ K-Talk</b><span>동영상 불러오는 중...</span></div></div><div class="shade"></div>'+tabs('video')+'<div class="title"><b>♛ '+name+'</b><span>'+title+'</span></div><div class="actions"><button>♡<small>좋아요</small></button><button>💬<small>댓글</small></button><button>🎁<small>선물</small></button><button>↗<small>공유</small></button></div></section>'}
  function liveCard(x){var host=esc(x.host_id||'guest'),name=esc(x.host_name||'K-Talk'),title=esc(x.title||x.room_name||'K-Talk LIVE'),room=esc(x.room_name||'라이브 방송'),type=esc(x.room_type||'');var bg=x.host_photo?'<img class="cover" src="'+esc(x.host_photo)+'" alt="">':'';return '<section class="card livecard" data-host="'+host+'" data-title="'+title+'" data-room="'+room+'" data-type="'+type+'">'+bg+'<div class="livecenter"><div><div class="livebadge">● LIVE</div><div class="antenna">📡</div><b>'+name+'</b><span>'+title+'</span><small>'+room+' · 방송 중</small><em>눌러서 방송 들어가기</em></div></div>'+tabs('live')+'<div class="title"><b>🔴 '+name+'</b><span>'+title+'</span></div></section>'}
  function compose(videos,lives){videos=Array.isArray(videos)&&videos.length?videos:SEED.map(function(u,i){return {id:'seed'+i,author_name:'K-Talk',title:'추천 동영상',video_url:u}});lives=Array.isArray(lives)?lives:[];var out=[],vi=0,li=0;if(videos[0]){out.push(videoCard(videos[0],0));vi=1}while(vi<videos.length||li<lives.length){if(li<lives.length)out.push(liveCard(lives[li++]));if(vi<videos.length)out.push(videoCard(videos[vi],vi++))}return out.join('')}
  function wire(){var f=document.getElementById('feed'),vs=[].slice.call(f.querySelectorAll('video.pub'));if(observer)try{observer.disconnect()}catch(e){};vs.forEach(function(v,idx){v.muted=true;v.defaultMuted=true;v.setAttribute('muted','');v.setAttribute('playsinline','');v.removeAttribute('poster');var load=v.closest('.card').querySelector('.loading');function ready(){if(load)load.style.display='none';try{var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}v.addEventListener('loadeddata',ready,{once:true});v.addEventListener('canplay',ready,{once:true});v.addEventListener('error',function(){if(idx===0&&firstSeedIndex<SEED.length-1){firstSeedIndex++;v.src=SEED[firstSeedIndex];try{v.load();v.play().catch(function(){})}catch(e){}}});v.onclick=function(){if(v.paused){v.play().catch(function(){})}else v.pause()}});if('IntersectionObserver'in window){observer=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting&&e.intersectionRatio>.45){var lazy=v.getAttribute('data-src');if(lazy&&!v.src){v.src=lazy;v.removeAttribute('data-src');try{v.load()}catch(_){}}v.play().catch(function(){})}else{try{v.pause()}catch(_){}}})},{root:f,threshold:[.45]});vs.forEach(function(v){observer.observe(v)})}[].slice.call(f.querySelectorAll('.livecard')).forEach(function(c){c.onclick=function(){joinLive(c.dataset.host,c.dataset.title,c.dataset.room,c.dataset.type)}});if(vs[0]){setTimeout(function(){if(vs[0].readyState<2&&firstSeedIndex<SEED.length-1){firstSeedIndex++;vs[0].src=SEED[firstSeedIndex];try{vs[0].load();vs[0].play().catch(function(){})}catch(e){}}},5500);try{vs[0].play().catch(function(){})}catch(e){}}}
  function render(videos,lives){var f=document.getElementById('feed');f.innerHTML=compose(videos,lives);f.scrollTop=0;wire()}
  async function loadData(){try{var since=new Date(Date.now()-20000).toISOString();var vu=SB+'/rest/v1/ktalk_videos?select=id,author_name,title,video_url,created_at,likes&order=created_at.desc&limit=16';var lu=SB+'/rest/v1/ktalk_live_rooms?select=id,host_id,host_name,title,room_type,room_name,host_photo,updated_at&active=eq.true&updated_at=gte.'+encodeURIComponent(since)+'&order=updated_at.desc&limit=10';var rs=await Promise.all([fetch(vu,{headers:h(),cache:'no-store'}),fetch(lu,{headers:h(),cache:'no-store'})]);var videos=rs[0].ok?await rs[0].json():[],lives=rs[1].ok?await rs[1].json():[];if(videos&&videos.length)render(videos,lives);else render([],lives)}catch(e){render([],[])}}
  window.refreshFeed=function(){firstSeedIndex=0;render([],[]);setTimeout(loadData,80)};
  function waitIce(pc,ms){return new Promise(function(resolve){if(!pc||pc.iceGatheringState==='complete')return resolve();var done=false;function finish(){if(done)return;done=true;try{pc.removeEventListener('icegatheringstatechange',chg)}catch(e){}resolve()}function chg(){if(pc.iceGatheringState==='complete')finish()}pc.addEventListener('icegatheringstatechange',chg);setTimeout(finish,ms||3500)})}
  function setStatus(t){document.getElementById('remoteStatus').textContent=t}
  async function stopViewer(mark){clearInterval(pollTimer);pollTimer=null;if(mark&&viewerSessionId){try{await fetch(SB+'/rest/v1/ktalk_webrtc_sessions?id=eq.'+encodeURIComponent(viewerSessionId),{method:'PATCH',headers:h({'Content-Type':'application/json','Prefer':'return=minimal'}),body:JSON.stringify({active:false,updated_at:new Date().toISOString()})})}catch(e){}}viewerSessionId='';if(viewerPeer){try{viewerPeer.close()}catch(e){}viewerPeer=null}var v=document.getElementById('remoteVideo');try{v.pause();v.srcObject=null}catch(e){}}
  async function pollAnswer(id,pc){try{var r=await fetch(SB+'/rest/v1/ktalk_webrtc_sessions?select=answer_sdp,active&id=eq.'+encodeURIComponent(id)+'&limit=1',{headers:h(),cache:'no-store'});if(!r.ok)return;var a=await r.json(),row=a&&a[0];if(!row)return;if(row.active===false){setStatus('방송이 종료되었습니다.');clearInterval(pollTimer);pollTimer=null;return}if(row.answer_sdp&&!pc.currentRemoteDescription){await pc.setRemoteDescription(JSON.parse(row.answer_sdp));setStatus('방송 연결 중...')}}catch(e){}}
  window.joinLive=async function(hostId,title,room,type){if(type==='password'){alert('비밀방은 비밀번호 확인 후 입장해야 합니다.');return}await stopViewer(true);var remote=document.getElementById('remote'),video=document.getElementById('remoteVideo');remote.classList.add('show');document.getElementById('remoteTitle').textContent=title||'K-Talk LIVE';document.getElementById('remoteRoom').textContent=room||'라이브 방송';setStatus('방송 연결 중...');var pc=new RTCPeerConnection(rtcConfig);viewerPeer=pc;pc.ontrack=function(ev){var s=ev.streams&&ev.streams[0];if(s){video.srcObject=s;video.muted=false;video.defaultMuted=false;video.volume=1;var p=video.play();if(p&&p.catch)p.catch(function(){video.muted=true;video.play().catch(function(){})});setStatus('LIVE 방송 중')}};pc.onconnectionstatechange=function(){if(pc.connectionState==='failed'||pc.connectionState==='disconnected')setStatus('방송을 다시 연결하고 있습니다...')};try{var offer=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:true});await pc.setLocalDescription(offer);await waitIce(pc,3500);var now=new Date().toISOString();var r=await fetch(SB+'/rest/v1/ktalk_webrtc_sessions',{method:'POST',headers:h({'Content-Type':'application/json','Prefer':'return=representation'}),body:JSON.stringify({host_id:String(hostId||'guest'),viewer_id:viewerId(),offer_sdp:JSON.stringify(pc.localDescription),answer_sdp:null,active:true,created_at:now,updated_at:now})});if(!r.ok)throw new Error('signal');var rows=await r.json();viewerSessionId=rows&&rows[0]&&rows[0].id||'';if(!viewerSessionId)throw new Error('session');await pollAnswer(viewerSessionId,pc);pollTimer=setInterval(function(){pollAnswer(viewerSessionId,pc)},650);setTimeout(function(){if(remote.classList.contains('show')&&video.readyState<2)setStatus('방송 연결 중... 잠시만 기다려 주세요.')},7000)}catch(e){setStatus('방송 연결에 실패했습니다. 뒤로 갔다가 다시 눌러 주세요.')}};
  window.leaveLive=async function(){await stopViewer(true);document.getElementById('remote').classList.remove('show')};
  render([],[]);setTimeout(loadData,80);setInterval(function(){if(!document.getElementById('remote').classList.contains('show'))loadData()},6000);
})();
</script>
