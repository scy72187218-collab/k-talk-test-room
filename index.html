
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk LIVE</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07050b;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:8px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:27px;font-weight:900;color:#ffd64a}
.on{background:#e61d50;padding:7px 12px;border-radius:8px;font-weight:900}
.notice{text-align:center;border:1px solid #55245e;border-radius:8px;padding:7px;margin:7px 0;color:#ffd43c;font-weight:800}

.stage{display:grid;grid-template-columns:46% 54%;gap:6px}
.main{position:relative;background:#111018;border:1px solid #502a5a;border-radius:10px;overflow:hidden;min-height:430px}
.main video,.slot video{width:100%;height:100%;object-fit:cover}
.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa}
.check{position:absolute;z-index:5;top:10px;left:50%;transform:translateX(-50%);background:#32102fdd;border:2px solid #ff3fa5;color:#ffe348;border-radius:25px;padding:7px 14px;font-weight:900}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.slot{min-height:100px;background:#15121a;border:1px solid #45284e;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;font-size:11px;color:#aaa}
.slot.me{border:2px solid #ffd700}
.label{position:absolute;left:4px;bottom:4px;background:#000b;padding:2px 5px;border-radius:5px;font-size:10px}

.controls{display:flex;gap:6px;margin-top:7px}
button{border:0;border-radius:9px;padding:10px;color:#fff;font-weight:900}
.start{background:#8d3bea;flex:1}.stop{background:#333;flex:1}
.status{text-align:center;color:#ffd76a;padding:6px;font-size:12px}

.bottom{display:grid;grid-template-columns:46% 54%;gap:6px}
.panel{border:1px solid #4c2456;background:#0d0911;border-radius:9px;padding:8px}
.chat{height:230px;overflow:auto;font-size:12px;line-height:1.7}
.chatInput{display:flex;gap:5px}
.chatInput input{flex:1;background:#17131c;border:1px solid #3c2943;color:#fff;border-radius:7px;padding:9px}
.chatInput button{background:#7130a9}

.gifts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.gift{text-align:center;background:#160d1c;border:1px solid #45234e;border-radius:8px;padding:6px 2px}
.gift .icon{font-size:25px}
.coin{color:#ffd43d;font-size:11px}

.roses{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px;border:1px solid #b88612;border-radius:9px;padding:5px}
.rose{text-align:center;padding:6px 1px;background:#170e1c;border-radius:7px;cursor:pointer}
.rose span{font-size:23px}
.rose b{display:block;font-size:11px}

.box{width:100%;margin-top:7px;background:linear-gradient(90deg,#53115f,#8c239d);border:1px solid #ce5cff}

.lottery{margin-top:7px;border:1px solid #d43cc9;border-radius:9px;padding:7px}
.lottery h3{text-align:center;margin:0 0 6px;color:#ff8aee}
.draws{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.draw{text-align:center;background:#190e20;border-radius:7px;padding:6px;font-size:11px}

.modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;align-items:center;justify-content:center;padding:20px}
.modalIn{max-width:420px;width:100%;background:#160d1d;border:2px solid #a33dff;border-radius:14px;padding:12px}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.big button{background:#291333;border:1px solid #6c347a;font-size:17px}
.close{width:100%;margin-top:8px;background:#444}

@media(max-width:600px){
 .main{min-height:360px}
 .slot{min-height:83px}
 .chat{height:205px}
 .brand{font-size:22px}
 .gift .icon{font-size:20px}
 .rose span{font-size:19px}
}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
 <div class="brand">♛ K-Talk</div>
 <div>화상 방송방 · 최대 13명</div>
 <div class="on">● ON AIR</div>
</div>

<div class="notice">★ 출석체크 눌러주세요 ★　　광고 문의 환영합니다</div>

<div class="stage">
 <div class="main">
  <button class="check" onclick="attendance()">♡ 출석체크 ♡</button>
  <div id="ph" class="placeholder">방송 시작을 눌러주세요</div>
  <video id="localVideo" autoplay playsinline muted></video>
 </div>
 <div id="grid" class="grid"></div>
</div>

<div class="controls">
 <button class="start" onclick="startRoom()">📹 방송 시작</button>
 <button class="stop" onclick="stopRoom()">방송 종료</button>
</div>
<div id="status" class="status">대기 중</div>

<div class="bottom">

 <div class="panel">
  <b>채팅　 참가자</b>
  <div id="chat" class="chat">
   <div>💬 K-Talk 방송에 오신 것을 환영합니다.</div>
  </div>
  <div class="chatInput">
   <input id="msg" placeholder="메시지를 입력하세요">
   <button onclick="sendChat()">전송</button>
  </div>
 </div>

 <div>
  <div class="panel">
   <b>선물 / 후원</b>

   <div class="gifts">
    <div class="gift"><div class="icon">🌹</div>장미<div class="coin">🪙50</div></div>
    <div class="gift"><div class="icon">❤️</div>하트</div>
    <div class="gift"><div class="icon">⭐</div>별</div>
    <div class="gift"><div class="icon">🎈</div>풍선</div>
    <div class="gift"><div class="icon">💖</div>슈퍼하트</div>
   </div>

   <div class="roses">
    <div class="rose" onclick="roseGift(1)"><span>🌹</span><b>1개</b><div class="coin">🪙50</div></div>
    <div class="rose" onclick="roseGift(5)"><span>🌹</span><b>5개</b><div class="coin">🪙250</div></div>
    <div class="rose" onclick="roseGift(10)"><span>💐</span><b>10개</b><div class="coin">🪙500</div></div>
    <div class="rose" onclick="roseGift(50)"><span>💐</span><b>50개</b><div class="coin">🪙2,500</div></div>
    <div class="rose" onclick="roseGift(100)"><span>💐</span><b>100개</b><div class="coin">🪙5,000</div></div>
   </div>

   <button class="box" onclick="openBox()">🎁 선물 상자 · 큰 선물 보기</button>
  </div>

  <div class="lottery">
   <h3>🎲 제비뽑기 이벤트</h3>
   <div class="draws">
    <div class="draw">☀️ 아침<br>뽑기</div>
    <div class="draw">☀️ 점심<br>뽑기</div>
    <div class="draw">🌙 저녁<br>뽑기</div>
   </div>
  </div>
 </div>

</div>
</div>

<div id="giftModal" class="modal">
 <div class="modalIn">
  <h2>🎁 큰 선물</h2>
  <div class="big">
   <button onclick="bigGift('🐋 고래')">🐋 고래</button>
   <button onclick="bigGift('🚗 자동차')">🚗 자동차</button>
   <button onclick="bigGift('🚀 우주선')">🚀 우주선</button>
   <button onclick="bigGift('👑 왕관')">👑 왕관</button>
   <button onclick="bigGift('💎 다이아몬드')">💎 다이아몬드</button>
   <button onclick="bigGift('🎆 축하폭죽')">🎆 축하폭죽</button>
  </div>
  <button class="close" onclick="closeBox()">닫기</button>
 </div>
</div>

<script>
const MAX_USERS = 13;
const BASE = 'ktalk-final13-v20260816-slot-';

let localStream = null;
let peer = null;
let mySlot = 0;
let syncTimer = null;

const calls = new Map();
const pending = new Map();
const lastSeen = new Map();
const retryAfter = new Map();

function $(id){return document.getElementById(id)}
function setStatus(t){$('status').textContent=t}
function slotName(slot){return slot===1?'진행자':'참가자 '+slot}

function buildGrid(){
 const grid=$('grid');
 grid.innerHTML='';
 for(let i=1;i<=MAX_USERS;i++){
  const d=document.createElement('div');
  d.className='slot';
  d.id='slot-'+i;
  d.textContent=slotName(i);
  grid.appendChild(d);
 }
}
buildGrid();

function getSlotFromPeerId(id){
 const m=String(id||'').match(/slot-(\d+)$/);
 return m?Number(m[1]):0;
}

function resetSlot(slot){
 const box=$('slot-'+slot);
 if(!box)return;
 box.className='slot'+(slot===mySlot?' me':'');
 box.innerHTML=slot===mySlot?slotName(slot)+'<br>· 나 ·':slotName(slot);
}

function renderRemote(slot,stream){
 if(!slot||slot===mySlot)return;
 const box=$('slot-'+slot);
 if(!box)return;
 box.innerHTML='';

 const v=document.createElement('video');
 v.autoplay=true;
 v.playsInline=true;
 v.srcObject=stream;

 const lab=document.createElement('div');
 lab.className='label';
 lab.textContent=slotName(slot);

 box.appendChild(v);
 box.appendChild(lab);
 lastSeen.set(slot,Date.now());
}

function closeSlot(slot,reset=true){
 const call=calls.get(slot);
 if(call){try{call.close()}catch(e){}}
 calls.delete(slot);
 pending.delete(slot);
 lastSeen.delete(slot);
 if(reset)resetSlot(slot);
}

function attachCall(slot,call){
 if(!slot||slot===mySlot||!call)return;

 const old=calls.get(slot);
 if(old&&old!==call){
  try{old.close()}catch(e){}
 }

 calls.set(slot,call);
 pending.delete(slot);
 lastSeen.set(slot,Date.now());

 call.on('stream',remoteStream=>{
  calls.set(slot,call);
  pending.delete(slot);
  lastSeen.set(slot,Date.now());
  renderRemote(slot,remoteStream);
  setStatus('✅ 연결됨 · 내 번호 '+mySlot+' · 최대 13명');
 });

 call.on('close',()=>{
  if(calls.get(slot)===call){
   calls.delete(slot);
   pending.delete(slot);
   lastSeen.delete(slot);
   resetSlot(slot);
   retryAfter.set(slot,Date.now()+1200);
  }
 });

 call.on('error',()=>{
  if(calls.get(slot)===call){
   calls.delete(slot);
   pending.delete(slot);
   lastSeen.delete(slot);
   resetSlot(slot);
   retryAfter.set(slot,Date.now()+1200);
  }
 });
}

function claimSlot(slot){
 return new Promise(resolve=>{
  const p=new Peer(BASE+slot,{
   debug:0,
   config:{
    iceServers:[
     {urls:'stun:stun.l.google.com:19302'},
     {urls:'stun:stun1.l.google.com:19302'}
    ]
   }
  });

  let finished=false;

  const done=value=>{
   if(finished)return;
   finished=true;
   resolve(value);
  };

  p.on('open',()=>done(p));

  p.on('error',()=>{
   try{p.destroy()}catch(e){}
   done(null);
  });

  setTimeout(()=>{
   if(!finished){
    try{p.destroy()}catch(e){}
    done(null);
   }
  },2200);
 });
}

function shouldDial(slot){
 if(!peer||!localStream||!mySlot)return false;
 if(slot<=0||slot>=mySlot)return false;
 if(calls.has(slot)||pending.has(slot))return false;
 if((retryAfter.get(slot)||0)>Date.now())return false;
 return true;
}

function dial(slot){
 if(!shouldDial(slot))return;

 pending.set(slot,Date.now());

 let call=null;

 try{
  call=peer.call(BASE+slot,localStream,{metadata:{slot:mySlot}});
 }catch(e){
  pending.delete(slot);
  retryAfter.set(slot,Date.now()+1500);
  return;
 }

 if(!call){
  pending.delete(slot);
  retryAfter.set(slot,Date.now()+1500);
  return;
 }

 let gotStream=false;

 call.on('stream',remoteStream=>{
  gotStream=true;
  attachCall(slot,call);
  renderRemote(slot,remoteStream);
 });

 call.on('close',()=>{
  if(calls.get(slot)===call)calls.delete(slot);
  pending.delete(slot);
  lastSeen.delete(slot);
  resetSlot(slot);
  retryAfter.set(slot,Date.now()+1200);
 });

 call.on('error',()=>{
  if(calls.get(slot)===call)calls.delete(slot);
  pending.delete(slot);
  lastSeen.delete(slot);
  resetSlot(slot);
  retryAfter.set(slot,Date.now()+1200);
 });

 setTimeout(()=>{
  if(!gotStream){
   try{call.close()}catch(e){}
   if(calls.get(slot)===call)calls.delete(slot);
   pending.delete(slot);
   retryAfter.set(slot,Date.now()+1500);
   resetSlot(slot);
  }
 },7000);
}

function syncPeers(){
 if(!peer||!localStream||!mySlot)return;

 for(let slot=1;slot<mySlot;slot++){
  if(shouldDial(slot))dial(slot);
 }

 for(const [slot,call] of calls.entries()){
  const pc=call&&call.peerConnection;
  const state=pc?pc.connectionState:'';

  if(state==='connected'){
   lastSeen.set(slot,Date.now());
   continue;
  }

  if(state==='failed'||state==='closed'){
   closeSlot(slot);
   retryAfter.set(slot,Date.now()+1200);
   continue;
  }

  if(state==='disconnected'){
   const since=lastSeen.get(slot)||Date.now();
   if(Date.now()-since>4500){
    closeSlot(slot);
    retryAfter.set(slot,Date.now()+1200);
   }
  }
 }

 for(const [slot,started] of pending.entries()){
  if(Date.now()-started>9000){
   pending.delete(slot);
   retryAfter.set(slot,Date.now()+1200);
  }
 }
}

async function startRoom(){
 if(localStream||peer)return;

 try{
  localStream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:'user',
    width:{ideal:640},
    height:{ideal:360},
    frameRate:{ideal:15,max:20}
   },
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   }
  });

  $('localVideo').srcObject=localStream;
  $('ph').style.display='none';

 }catch(e){
  localStream=null;
  alert('카메라와 마이크를 허용해 주세요.');
  return;
 }

 setStatus('13명 방 연결 중...');

 for(let i=1;i<=MAX_USERS;i++){
  const p=await claimSlot(i);
  if(p){
   peer=p;
   mySlot=i;
   break;
  }
 }

 if(!peer){
  localStream.getTracks().forEach(t=>t.stop());
  localStream=null;
  $('localVideo').srcObject=null;
  $('ph').style.display='flex';
  setStatus('⛔ 이 방은 최대 13명입니다.');
  alert('현재 13명이 접속 중입니다.');
  return;
 }

 for(let i=1;i<=MAX_USERS;i++)resetSlot(i);

 peer.on('call',call=>{
  const slot=getSlotFromPeerId(call.peer);

  if(!slot||slot===mySlot){
   try{call.close()}catch(e){}
   return;
  }

  try{call.answer(localStream)}catch(e){}
  attachCall(slot,call);
 });

 peer.on('disconnected',()=>{
  setStatus('연결 복구 중...');
  try{peer.reconnect()}catch(e){}
 });

 peer.on('error',err=>{
  if(err&&(err.type==='peer-unavailable'||err.type==='network'))return;
  console.log(err);
 });

 syncPeers();
 syncTimer=setInterval(syncPeers,2000);

 setStatus(
  mySlot===1
   ?'✅ 진행자 입장 완료 · 최대 13명'
   :'✅ 참가자 '+mySlot+' 입장 완료 · 최대 13명'
 );
}

function stopRoom(){
 if(syncTimer){
  clearInterval(syncTimer);
  syncTimer=null;
 }

 for(const slot of Array.from(calls.keys())){
  closeSlot(slot,false);
 }

 calls.clear();
 pending.clear();
 lastSeen.clear();
 retryAfter.clear();

 try{
  if(peer)peer.destroy();
 }catch(e){}

 if(localStream){
  localStream.getTracks().forEach(t=>t.stop());
 }

 localStream=null;
 peer=null;
 mySlot=0;

 $('localVideo').srcObject=null;
 $('ph').style.display='flex';

 for(let i=1;i<=MAX_USERS;i++)resetSlot(i);

 setStatus('대기 중');
}

function roseGift(n){
 alert('🌹 장미 '+n+'개 · 테스트 선물');
}

function attendance(){
 alert('⭐ 출석체크 · 테스트');
}

function openBox(){
 $('giftModal').style.display='flex';
}

function closeBox(){
 $('giftModal').style.display='none';
}

function bigGift(name){
 alert(name+' · 테스트 선물');
 closeBox();
}

function sendChat(){
 const input=$('msg');
 const text=input.value.trim();
 if(!text)return;

 const d=document.createElement('div');
 d.textContent='나 : '+text;
 $('chat').appendChild(d);

 input.value='';
 $('chat').scrollTop=$('chat').scrollHeight;
}

window.addEventListener('beforeunload',stopRoom);
</script>
</body>
</html>
