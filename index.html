<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>K-Talk</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#050308;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}

:root{
  --gold:#f5cb61;
  --pink:#ff43c8;
  --purple:#8c34d8;
  --panel:#0b0810;
  --line:#51315d;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin:auto;
  padding:4px 5px 58px;
  background:linear-gradient(#050308,#08050b);
}

/* 상단 */
.header{
  height:38px;
  display:grid;
  grid-template-columns:95px 1fr 90px;
  align-items:center;
  border-bottom:1px solid #654f22;
}
.logo{
  text-align:center;
  color:var(--gold);
  font-size:24px;
  font-weight:900;
}
.logo small{
  display:block;
  font-size:8px;
  color:#bbb;
}
.onair{
  font-size:9px;
  font-weight:900;
  color:#fff;
}
.onair b{
  background:#e12645;
  border-radius:5px;
  padding:4px 7px;
}
.people{
  text-align:right;
  font-size:9px;
  color:#ddd;
}

.topmenu{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  margin:4px 0;
}
.topmenu button{
  border:1px solid #5a3763;
  background:#120b18;
  color:#fff;
  border-radius:6px;
  height:29px;
  padding:1px;
  font-size:8px;
  font-weight:900;
}

.notice{
  height:27px;
  overflow:hidden;
  display:flex;
  align-items:center;
  border:1px solid #5d3e66;
  border-radius:7px;
  background:#0b0710;
  margin-bottom:4px;
}
.noticeTrack{
  white-space:nowrap;
  display:inline-flex;
  gap:40px;
  min-width:max-content;
  animation:scroll 17s linear infinite;
  font-size:8px;
  font-weight:900;
  color:#ffd35b;
}
.noticeTrack .pink{color:#ff69df}
@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* 방송 본체 */
.broadcast{
  display:grid;
  grid-template-columns:48% 52%;
  gap:4px;
  height:323px;
}

.host{
  position:relative;
  overflow:hidden;
  border:1px solid #5b4c68;
  border-radius:8px;
  background:#130c18;
}
.host video,
.guest video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hostPlaceholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  background:
    radial-gradient(circle at 50% 30%,#55234c,#120a17 65%);
}

.hostTag{
  position:absolute;
  left:6px;
  top:6px;
  z-index:4;
  font-size:8px;
  color:#ff4860;
  font-weight:900;
}
.check{
  position:absolute;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  border:1px solid #ff42d0;
  background:#7d165d;
  color:#ffd96b;
  border-radius:18px;
  padding:4px 8px;
  font-size:8px;
  font-weight:900;
}

.wave{
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  height:42px;
  z-index:4;
  background:#0005;
  border-radius:5px;
}
#waveCanvas{
  width:100%;
  height:100%;
}

.guests{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:3px;
}
.guest{
  position:relative;
  overflow:hidden;
  min-width:0;
  border:1px solid #45394d;
  border-radius:6px;
  background:#120e15;
}
.guestPlaceholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:radial-gradient(circle at 50% 32%,#594356,#151018 65%);
}
.gno{
  position:absolute;
  top:2px;
  left:2px;
  z-index:3;
  min-width:17px;
  height:17px;
  padding:0 3px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#b98413;
  border-radius:4px;
  font-size:8px;
  font-weight:900;
}
.gmic{
  position:absolute;
  right:3px;
  top:2px;
  z-index:3;
  font-size:9px;
}
.gname{
  position:absolute;
  left:3px;
  bottom:2px;
  z-index:3;
  background:#0008;
  padding:2px 3px;
  border-radius:3px;
  font-size:6px;
}

/* 채팅 선물 */
.lower{
  display:grid;
  grid-template-columns:48% 52%;
  gap:4px;
  margin-top:4px;
  height:245px;
}

.chat,.giftPanel{
  border:1px solid #4a3153;
  border-radius:8px;
  background:#09070c;
  overflow:hidden;
}

.chat{
  display:flex;
  flex-direction:column;
}
.chatHead{
  flex:0 0 27px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7px;
  border-bottom:1px solid #3c2444;
  font-size:8px;
}
.chatHead b{color:#e978ff}
.messages{
  flex:1;
  overflow-y:auto;
  padding:5px 6px;
  font-size:8px;
  line-height:1.35;
}
.messages b{color:#53d9ff}
.chatInput{
  flex:0 0 31px;
  display:grid;
  grid-template-columns:1fr 44px;
  gap:3px;
  padding:3px;
}
.chatInput input{
  width:100%;
  min-width:0;
  border:1px solid #423745;
  border-radius:5px;
  background:#141119;
  color:#fff;
  padding:0 6px;
  font-size:8px;
}
.chatInput button{
  border:0;
  border-radius:5px;
  background:#8f26bd;
  color:#fff;
  font-size:8px;
  font-weight:900;
}

.giftPanel{
  padding:4px;
  display:grid;
  grid-template-rows:18px 55px 52px 1fr;
  gap:3px;
}
.giftTitle{
  font-size:8px;
  font-weight:900;
}
.roses{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
}
.roses button{
  border:1px solid #4d2856;
  background:#100914;
  color:#fff;
  border-radius:6px;
  padding:2px 1px;
  font-size:7px;
  font-weight:900;
}
.roses .r{
  display:block;
  font-size:18px;
  line-height:20px;
}
.roses small{
  display:block;
  color:#ffd15b;
  font-size:6px;
}

.events{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}
.events button{
  border:1px solid #5b2a66;
  background:#160b1d;
  border-radius:7px;
  color:#fff;
  font-size:7px;
  font-weight:900;
}
.events span{
  display:block;
  font-size:20px;
  margin-bottom:1px;
}

.bigEvent{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:3px;
}
.bigEvent button{
  border:1px solid #60306d;
  border-radius:7px;
  background:linear-gradient(135deg,#2c0a38,#1a0b22);
  color:#fff;
  font-size:8px;
  font-weight:900;
}

/* 얼굴 보정 */
.beauty{
  border:1px solid #49304f;
  border-radius:8px;
  margin-top:4px;
  padding:5px;
  background:#0a080d;
}
.beautyTop{
  display:grid;
  grid-template-columns:55px 1fr 38px;
  gap:5px;
  align-items:center;
  font-size:8px;
}
.beauty input[type=range]{
  width:100%;
}
.filters{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px;
  margin-top:4px;
}
.filters button{
  border:1px solid #51305d;
  background:#160b1b;
  color:#fff;
  border-radius:6px;
  padding:5px 1px;
  font-size:7px;
}
.filters button.active{
  border-color:#ff4ee6;
  box-shadow:0 0 8px #ff4ee677;
  color:#ffd765;
}

/* 팝업 */
.modalBack{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:14px;
}
.modal{
  width:100%;
  max-width:420px;
  max-height:85dvh;
  overflow:auto;
  border:1px solid #7c458d;
  border-radius:13px;
  background:#100b15;
  padding:13px;
}
.modal h3{
  margin:0 0 10px;
  color:#ffd05d;
}
.modal button{
  border:0;
  border-radius:8px;
  background:#8b29b3;
  color:#fff;
  padding:9px;
  margin-top:6px;
  font-weight:900;
}
.modal .close{
  background:#333;
}
.movieList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}
.movie{
  border:1px solid #4b3554;
  border-radius:8px;
  padding:10px;
  background:#18101c;
  text-align:center;
}

/* 하단 메뉴 */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  width:100%;
  max-width:760px;
  height:52px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:#0b0810f5;
  border-top:1px solid #4a3050;
}
.bottom button{
  border:0;
  background:transparent;
  color:#ccc;
  font-size:7px;
}
.bottom button span{
  display:block;
  font-size:19px;
}

.toast{
  display:none;
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:65px;
  z-index:999;
  background:#160d1eee;
  border:1px solid #8b41a8;
  border-radius:8px;
  padding:8px 12px;
  font-size:9px;
}

/* 모바일 한 화면 조정 */
@media(max-width:430px){
  .app{padding-left:3px;padding-right:3px}
  .header{height:34px;grid-template-columns:72px 1fr 70px}
  .logo{font-size:20px}
  .topmenu button{font-size:7px;height:27px}
  .notice{height:23px}
  .broadcast{height:292px;gap:3px}
  .guests{gap:2px}
  .lower{height:218px;gap:3px}
  .messages{font-size:7px}
  .gifts{font-size:7px}
  .filters button{font-size:6px}
}

</style>
</head>

<script>

/* =============================
   기본 설정
============================= */

const MAX_USERS = 13;

const BASE =
  "ktalk-live-final-v20260820-slot-";

let localStream = null;
let peer = null;
let mySlot = 0;
let syncTimer = null;

const calls = new Map();
const pending = new Map();
const retryAfter = new Map();
const lastSeen = new Map();

const guestEmojis = [
  "👩🏻","👨🏻","👩🏻","👨🏻",
  "👩🏻","👨🏻","👩🏻","👨🏻",
  "👩🏻","👨🏻","👩🏻","👨🏻"
];

const guestNames = [
  "지수","민수","보라","태훈",
  "수현","준호","해피걸","루이",
  "별빛","도레미","사랑","최강자"
];


/* =============================
   참가자 화면 만들기
============================= */

function buildGuestGrid(){

  const grid =
    document.getElementById("guestGrid");

  grid.innerHTML = "";

  for(let i=2;i<=13;i++){

    const index = i - 2;

    const d =
      document.createElement("div");

    d.className = "guest";
    d.id = "slot-" + i;

    d.innerHTML = `
      <div
        class="guestPlaceholder">
        ${guestEmojis[index]}
      </div>

      <div class="gno">
        ${i}
      </div>

      <div class="gmic">
        🎙
      </div>

      <div class="gname">
        ${guestNames[index]}
      </div>
    `;

    grid.appendChild(d);
  }
}

buildGuestGrid();


/* =============================
   얼굴 보정
============================= */

let beautyStrength = 35;
let currentFilter = "normal";

function setBeauty(v){

  beautyStrength = Number(v);

  document.getElementById(
    "beautyValue"
  ).textContent = v;

  applyVideoFilter();
}

function setFaceFilter(type,btn){

  currentFilter = type;

  document
    .querySelectorAll(".filters button")
    .forEach(b =>
      b.classList.remove("active")
    );

  btn.classList.add("active");

  applyVideoFilter();
}

function applyVideoFilter(){

  const video =
    document.getElementById("localVideo");

  const s =
    beautyStrength / 100;

  let filter = "";

  if(currentFilter === "normal"){

    filter =
      `brightness(${1+s*.10})
       contrast(${1+s*.03})
       saturate(${1+s*.08})`;

  }

  if(currentFilter === "beauty"){

    filter =
      `brightness(${1.04+s*.18})
       contrast(${.98+s*.02})
       saturate(${1.04+s*.12})`;

  }

  if(currentFilter === "handsome"){

    filter =
      `contrast(${1.05+s*.12})
       saturate(${.95+s*.10})
       brightness(${1+s*.08})`;

  }

  if(currentFilter === "young"){

    filter =
      `brightness(${1.06+s*.18})
       saturate(${1.02+s*.10})
       contrast(${.97+s*.02})`;

  }

  if(currentFilter === "cute"){

    filter =
      `brightness(${1.07+s*.15})
       saturate(${1.15+s*.20})
       contrast(${.97})`;

  }

  if(currentFilter === "funny"){

    filter =
      `hue-rotate(${s*60}deg)
       saturate(${1.3+s})
       contrast(${1.1})`;

  }

  video.style.filter = filter;
}


/* =============================
   Peer ID
============================= */

function peerId(slot){

  return BASE + slot;
}

function slotFromPeerId(id){

  const m =
    String(id || "")
      .match(/slot-(\d+)$/);

  return m ? Number(m[1]) : 0;
}


/* =============================
   슬롯 초기화
============================= */

function resetRemote(slot){

  if(slot < 2 || slot > 13)
    return;

  const box =
    document.getElementById(
      "slot-" + slot
    );

  if(!box)
    return;

  const index = slot - 2;

  box.innerHTML = `
    <div
      class="guestPlaceholder">
      ${guestEmojis[index]}
    </div>

    <div class="gno">
      ${slot}
    </div>

    <div class="gmic">
      🎙
    </div>

    <div class="gname">
      ${guestNames[index]}
    </div>
  `;
}


/* =============================
   원격 영상 표시
============================= */

function renderRemote(slot,stream){

  if(
    slot < 2 ||
    slot > 13
  ){
    return;
  }

  const box =
    document.getElementById(
      "slot-" + slot
    );

  if(!box)
    return;

  box.innerHTML = "";

  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = stream;

  const no =
    document.createElement("div");

  no.className = "gno";
  no.textContent = slot;

  const mic =
    document.createElement("div");

  mic.className = "gmic";
  mic.textContent = "🎙";

  const name =
    document.createElement("div");

  name.className = "gname";

  name.textContent =
    guestNames[slot-2] ||
    "참가자 " + slot;

  box.appendChild(video);
  box.appendChild(no);
  box.appendChild(mic);
  box.appendChild(name);

  lastSeen.set(
    slot,
    Date.now()
  );

  updatePeopleCount();
}


/* =============================
   연결 닫기
============================= */

function closeSlot(slot){

  const call =
    calls.get(slot);

  if(call){

    try{
      call.close();
    }catch(e){}
  }

  calls.delete(slot);
  pending.delete(slot);
  lastSeen.delete(slot);

  resetRemote(slot);

  retryAfter.set(
    slot,
    Date.now() + 1200
  );

  updatePeopleCount();
}


/* =============================
   연결 등록
============================= */

function attachCall(slot,call){

  if(
    !slot ||
    slot === mySlot ||
    !call
  ){
    return;
  }

  const old =
    calls.get(slot);

  if(
    old &&
    old !== call
  ){

    try{
      old.close();
    }catch(e){}
  }

  calls.set(
    slot,
    call
  );

  pending.delete(slot);

  lastSeen.set(
    slot,
    Date.now()
  );

  call.on(
    "stream",
    remoteStream => {

      calls.set(
        slot,
        call
      );

      pending.delete(slot);

      lastSeen.set(
        slot,
        Date.now()
      );

      renderRemote(
        slot,
        remoteStream
      );
    }
  );

  call.on(
    "close",
    () => {

      if(
        calls.get(slot)
        === call
      ){
        closeSlot(slot);
      }
    }
  );

  call.on(
    "error",
    () => {

      if(
        calls.get(slot)
        === call
      ){
        closeSlot(slot);
      }
    }
  );
}


/* =============================
   자리 찾기
============================= */

function claimSlot(slot){

  return new Promise(
    resolve => {

      const p =
        new Peer(
          peerId(slot),
          {
            debug:0,
            config:{
              iceServers:[
                {
                  urls:
                  "stun:stun.l.google.com:19302"
                },
                {
                  urls:
                  "stun:stun1.l.google.com:19302"
                }
              ]
            }
          }
        );

      let done = false;

      const finish =
        value => {

          if(done)
            return;

          done = true;

          resolve(value);
        };

      p.on(
        "open",
        () => finish(p)
      );

      p.on(
        "error",
        () => {

          try{
            p.destroy();
          }catch(e){}

          finish(null);
        }
      );

      setTimeout(
        () => {

          if(!done){

            try{
              p.destroy();
            }catch(e){}

            finish(null);
          }

        },
        2200
      );
    }
  );
}


/* =============================
   연결 대상 확인
============================= */

function shouldDial(slot){

  if(
    !peer ||
    !localStream ||
    !mySlot
  ){
    return false;
  }

  if(
    slot <= 0 ||
    slot >= mySlot
  ){
    return false;
  }

  if(
    calls.has(slot) ||
    pending.has(slot)
  ){
    return false;
  }

  if(
    (retryAfter.get(slot) || 0)
    > Date.now()
  ){
    return false;
  }

  return true;
}


/* =============================
   다른 참가자 연결
============================= */

function dial(slot){

  if(!shouldDial(slot))
    return;

  pending.set(
    slot,
    Date.now()
  );

  let call;

  try{

    call =
      peer.call(
        peerId(slot),
        localStream,
        {
          metadata:{
            slot:mySlot
          }
        }
      );

  }catch(e){

    pending.delete(slot);

    retryAfter.set(
      slot,
      Date.now() + 1500
    );

    return;
  }

  if(!call){

    pending.delete(slot);

    return;
  }

  attachCall(
    slot,
    call
  );

  setTimeout(
    () => {

      if(
        pending.has(slot)
      ){

        try{
          call.close();
        }catch(e){}

        pending.delete(slot);

        retryAfter.set(
          slot,
          Date.now() + 1500
        );
      }

    },
    7000
  );
}


/* =============================
   연결상태 계속 확인
============================= */

function syncPeers(){

  if(
    !peer ||
    !localStream ||
    !mySlot
  ){
    return;
  }

  for(
    let slot=1;
    slot<mySlot;
    slot++
  ){

    if(
      shouldDial(slot)
    ){
      dial(slot);
    }
  }

  for(
    const [slot,call]
    of calls.entries()
  ){

    const pc =
      call &&
      call.peerConnection;

    const state =
      pc
        ? pc.connectionState
        : "";

    if(
      state ===
      "connected"
    ){

      lastSeen.set(
        slot,
        Date.now()
      );

      continue;
    }

    if(
      state === "failed" ||
      state === "closed"
    ){

      closeSlot(slot);

      continue;
    }

    if(
      state ===
      "disconnected"
    ){

      const since =
        lastSeen.get(slot) ||
        Date.now();

      if(
        Date.now() - since
        > 4000
      ){
        closeSlot(slot);
      }
    }
  }
}


/* =============================
   방송 시작
============================= */

async function startRoom(){

  if(
    localStream ||
    peer
  ){

    toast(
      "이미 방송 연결 중입니다."
    );

    return;
  }

  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({
          video:{
            facingMode:"user",
            width:{ideal:640},
            height:{ideal:480},
            frameRate:{
              ideal:18,
              max:24
            }
          },

          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }
        });

  }catch(e){

    alert(
      "카메라와 마이크를 허용해 주세요."
    );

    return;
  }

  const localVideo =
    document.getElementById(
      "localVideo"
    );

  localVideo.srcObject =
    localStream;

  document.getElementById(
    "hostPlaceholder"
  ).style.display =
    "none";

  applyVideoFilter();

  toast(
    "방송 연결 중..."
  );

  for(
    let i=1;
    i<=MAX_USERS;
    i++
  ){

    const p =
      await claimSlot(i);

    if(p){

      peer = p;
      mySlot = i;

      break;
    }
  }

  if(!peer){

    localStream
      .getTracks()
      .forEach(
        t => t.stop()
      );

    localStream = null;

    alert(
      "현재 방이 가득 찼습니다."
    );

    return;
  }

  peer.on(
    "call",
    call => {

      const slot =
        slotFromPeerId(
          call.peer
        );

      if(
        !slot ||
        slot === mySlot
      ){

        try{
          call.close();
        }catch(e){}

        return;
      }

      try{

        call.answer(
          localStream
        );

      }catch(e){}

      attachCall(
        slot,
        call
      );
    }
  );

  peer.on(
    "disconnected",
    () => {

      toast(
        "연결 복구 중..."
      );

      setTimeout(
        () => {

          try{
            peer.reconnect();
          }catch(e){}

        },
        1000
      );
    }
  );

  peer.on(
    "error",
    err => {

      console.log(
        "Peer error",
        err
      );
    }
  );

  syncPeers();

  syncTimer =
    setInterval(
      syncPeers,
      2000
    );

  updatePeopleCount();

  toast(
    mySlot === 1
      ? "진행자로 입장했습니다."
      : "참가자 " +
        mySlot +
        "번으로 입장했습니다."
  );
}


/* =============================
   나가기
============================= */

function leaveRoom(){

  if(syncTimer){

    clearInterval(
      syncTimer
    );

    syncTimer = null;
  }

  for(
    const slot
    of [...calls.keys()]
  ){
    closeSlot(slot);
  }

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;
  }

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        t => t.stop()
      );

    localStream = null;
  }

  document.getElementById(
    "localVideo"
  ).srcObject = null;

  document.getElementById(
    "hostPlaceholder"
  ).style.display =
    "flex";

  mySlot = 0;

  updatePeopleCount();

  toast(
    "방송에서 나왔습니다."
  );
}

============================= */

function sendChat(){

  const input =
    document.getElementById(
      "chatText"
    );

  const text =
    input.value.trim();

  if(!text)
    return;

  const messages =
    document.getElementById(
      "messages"
    );

  messages.insertAdjacentHTML(
    "beforeend",
    `<br><b>나</b> ${escapeHtml(text)}`
  );

  input.value = "";

  messages.scrollTop =
    messages.scrollHeight;
}

function escapeHtml(str){

  return str.replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[c]
  );
}

/* =============================
   항상 보이는 파장
============================= */

const canvas =
  document.getElementById(
    "waveCanvas"
  );

const ctx =
  canvas.getContext("2d");

function resizeWave(){

  canvas.width =
    canvas.clientWidth
    * devicePixelRatio;

  canvas.height =
    canvas.clientHeight
    * devicePixelRatio;
}

resizeWave();

window.addEventListener(
  "resize",
  resizeWave
);

let waveTime = 0;

function drawWave(){

  const w =
    canvas.width;

  const h =
    canvas.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  const bars = 46;

  const gap =
    2 * devicePixelRatio;

  const barWidth =
    (
      w -
      gap*(bars-1)
    ) / bars;

  for(
    let i=0;
    i<bars;
    i++
  ){

    const value =
      (
        Math.sin(
          waveTime +
          i*.45
        )
        + 1
      ) / 2;

    const height =
      Math.max(
        3*devicePixelRatio,
        h * (.18 + value*.75)
      );

    ctx.fillStyle =
      `hsl(${(i*9+waveTime*70)%360} 100% 60%)`;

    ctx.fillRect(
      i*(barWidth+gap),
      (h-height)/2,
      barWidth,
      height
    );
  }

  waveTime += .055;

  requestAnimationFrame(
    drawWave
  );
}

drawWave();
