<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk 실시간 방송</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#05070b;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
button,input{
  font:inherit;
}
.top{
  height:58px;
  padding:9px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:1px solid #252a33;
  background:#0d1017;
}
.logo{
  font-size:20px;
  font-weight:800;
}
.live{
  background:#e52239;
  border-radius:15px;
  padding:4px 9px;
  font-size:12px;
}
.status{
  margin-left:auto;
  font-size:12px;
  color:#9ca7b8;
}
.startBtn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  color:white;
  background:#e52239;
  font-weight:700;
}

.main{
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);
  gap:8px;
  padding:8px;
}

.stage{
  position:relative;
  background:#11151d;
  border:1px solid #242b38;
  border-radius:12px;
  overflow:hidden;
  min-height:420px;
}
.stage video{
  width:100%;
  height:100%;
  min-height:420px;
  object-fit:cover;
  background:#10131a;
}
.stageInfo{
  position:absolute;
  left:12px;
  bottom:12px;
  background:rgba(0,0,0,.62);
  border-radius:8px;
  padding:8px 11px;
}
.stageTitle{
  font-weight:800;
  font-size:15px;
}
.stageSub{
  font-size:12px;
  color:#ddd;
  margin-top:3px;
}

.side{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}
.slot{
  position:relative;
  background:#151a23;
  border:1px solid #293140;
  border-radius:8px;
  min-height:105px;
  overflow:hidden;
}
.slot video{
  width:100%;
  height:105px;
  object-fit:cover;
  display:block;
  background:#11151c;
}
.slotEmpty{
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#687385;
  font-size:13px;
}
.slotName{
  position:absolute;
  left:4px;
  bottom:4px;
  background:rgba(0,0,0,.65);
  border-radius:5px;
  padding:3px 5px;
  font-size:10px;
}
.slotNum{
  position:absolute;
  right:4px;
  top:4px;
  border-radius:50%;
  width:23px;
  height:23px;
  background:rgba(0,0,0,.67);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}
.action{
  border:0;
  border-radius:8px;
  padding:9px 3px;
  background:#202735;
  color:#fff;
  font-size:12px;
}
.action:active{transform:scale(.97)}

.chat{
  border:1px solid #272e3a;
  border-radius:10px;
  overflow:hidden;
  background:#0e1219;
}
.chatTitle{
  padding:8px 10px;
  font-weight:800;
  border-bottom:1px solid #252b35;
}
.messages{
  height:160px;
  overflow-y:auto;
  padding:8px;
  font-size:13px;
}
.msg{
  margin-bottom:7px;
  line-height:1.4;
}
.system{
  color:#ffd864;
}
.chatInput{
  display:flex;
  border-top:1px solid #252b35;
}
.chatInput input{
  flex:1;
  min-width:0;
  padding:11px;
  background:#151a23;
  color:#fff;
  border:0;
  outline:0;
}
.send{
  border:0;
  width:65px;
  background:#3268e8;
  color:#fff;
  font-weight:700;
}

.bottom{
  position:sticky;
  bottom:0;
  background:#0d1017;
  border-top:1px solid #262c35;
  padding:7px;
  display:flex;
  justify-content:center;
  gap:6px;
}
.ctrl{
  border:0;
  color:white;
  background:#202735;
  border-radius:20px;
  padding:9px 14px;
}
.end{
  background:#d9283c;
}
.promoteHint{
  font-size:11px;
  color:#8e99aa;
  text-align:center;
  margin-top:3px;
}

.giftBox{
  position:fixed;
  right:15px;
  top:75px;
  width:100px;
  padding:10px 5px;
  border:2px solid #ffd746;
  background:#c62444;
  border-radius:12px;
  text-align:center;
  display:none;
  z-index:50;
  box-shadow:0 5px 30px #000;
}
.giftBox .big{font-size:28px}
.giftBox button{
  margin-top:5px;
  border:0;
  border-radius:7px;
  background:#ffd746;
  padding:6px 10px;
  font-weight:800;
}
.reward{
  color:#ffe16c;
  font-size:12px;
}

@media(max-width:760px){
  .main{
    display:block;
    padding:5px;
  }
  .stage{
    min-height:260px;
    margin-bottom:6px;
  }
  .stage video{
    min-height:260px;
    height:260px;
  }
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
  .slot,.slot video,.slotEmpty{
    height:82px;
    min-height:82px;
  }
  .messages{
    height:130px;
  }
  .actions{
    margin-top:6px;
  }
}
</style>
</head>

<body>

<div class="top">
  <div class="logo">K-Talk</div>
  <div class="live">● LIVE</div>
  <div id="status" class="status">입장 준비</div>
  <button id="startBtn" class="startBtn">방송 시작</button>
</div>

<div class="main">

  <section class="stage">
    <video id="stageVideo" autoplay playsinline></video>
    <div class="stageInfo">
      <div id="stageTitle" class="stageTitle">큰 방송 화면</div>
      <div id="stageSub" class="stageSub">진행자 또는 노래하는 사람이 크게 표시됩니다.</div>
    </div>
  </section>

  <section class="side">

    <div id="grid" class="grid"></div>

    <div class="promoteHint">
      호스트는 참가자 화면을 누르면 큰 화면으로 올릴 수 있습니다.
    </div>

    <div class="actions">
      <button class="action" onclick="sendRose()">🌹 장미</button>
      <button class="action" onclick="sendGift()">🎁 선물</button>
      <button class="action" onclick="openGiftBox()">📦 선물상자</button>
      <button class="action" onclick="lottery()">🎯 제비뽑기</button>
    </div>

    <div class="chat">
      <div class="chatTitle">💬 실시간 채팅</div>
      <div id="messages" class="messages">
        <div class="msg system">K-Talk 방송방에 오신 것을 환영합니다.</div>
      </div>
      <div class="chatInput">
        <input id="chatText" maxlength="150"
               placeholder="메시지를 입력하세요">
        <button class="send" onclick="sendChat()">전송</button>
      </div>
    </div>

  </section>
</div>

<div class="bottom">
  <button id="micBtn" class="ctrl" onclick="toggleMic()">🎤 마이크</button>
  <button id="camBtn" class="ctrl" onclick="toggleCam()">📷 카메라</button>
  <button class="ctrl" onclick="copyInvite()">🔗 초대</button>
  <button class="ctrl end" onclick="leaveRoom()">☎ 나가기</button>
</div>

<div id="giftBox" class="giftBox">
  <div class="big">🎁</div>
  <div><b>선물상자</b></div>
  <div id="giftCount" class="reward">10초</div>
  <button id="giftReceive" onclick="receiveGift()" disabled>받기</button>
</div>


<script>
/****************************************************
 K-TALK 13명 실시간 방송
 - PeerJS 기반
 - 별도 가입 없이 URL 공유
 - 13자리 자동 배정
 - 1번 자리 = 기본 호스트
 - 참가자 화면 클릭 → 큰 화면
 - 채팅 / 장미 / 선물 / 선물상자 / 제비뽑기
****************************************************/

const MAX_USERS = 13;

const params = new URLSearchParams(location.search);
const ROOM = (params.get("room") || "main")
  .replace(/[^a-zA-Z0-9_-]/g,"")
  .slice(0,30);

const BASE = "ktalk-" + ROOM + "-";

let peer = null;
let stream = null;
let mySlot = null;

let dataPeers = {};
let calls = {};
let streams = {};

let promotedSlot = 1;
let micOn = true;
let camOn = true;

let giftTimer = null;
let giftSeconds = 0;
let giftReceived = false;

const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stageVideo = document.getElementById("stageVideo");
const stageTitle = document.getElementById("stageTitle");
const stageSub = document.getElementById("stageSub");
const messages = document.getElementById("messages");

function peerId(slot){
  return BASE + slot;
}

function slotFromPeer(id){
  if(!id || !id.startsWith(BASE)) return null;
  const n = Number(id.substring(BASE.length));
  return Number.isInteger(n) && n>=1 && n<=MAX_USERS ? n : null;
}


/* --------------------------
   13자리 화면 먼저 생성
-------------------------- */

function buildSlots(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for(let i=1;i<=MAX_USERS;i++){
    const box = document.createElement("div");
    box.className = "slot";
    box.id = "slot-" + i;

    box.innerHTML = `
      <div id="empty-${i}" class="slotEmpty">대기중</div>
      <video id="video-${i}" autoplay playsinline></video>
      <div id="name-${i}" class="slotName">참가자 ${i}</div>
      <div class="slotNum">${i}</div>
    `;

    const video = box.querySelector("video");
    video.style.display = "none";

    box.onclick = ()=>{
      if(mySlot === 1){
        promote(i,true);
      }
    };

    grid.appendChild(box);
  }
}
buildSlots();


/* --------------------------
   카메라 시작
-------------------------- */

startBtn.onclick = startRoom;

async function startRoom(){
  if(stream) return;

  try{
    startBtn.disabled = true;
    statusEl.textContent = "카메라 연결 중...";

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

    await claimSlot(1);

  }catch(err){
    console.error(err);
    startBtn.disabled = false;
    statusEl.textContent = "카메라/마이크 허용이 필요합니다.";
    alert("카메라와 마이크를 허용해 주세요.");
  }
}


/* --------------------------
   빈 자리 자동 찾기
-------------------------- */

function claimSlot(slot){

  return new Promise((resolve,reject)=>{

    if(slot > MAX_USERS){
      alert("현재 방송방이 가득 찼습니다.");
      reject();
      return;
    }

    statusEl.textContent = slot + "번 자리 확인 중...";

    const testPeer = new Peer(peerId(slot),{
      debug:0
    });

    let finished = false;

    testPeer.on("open",()=>{

      if(finished) return;
      finished = true;

      peer = testPeer;
      mySlot = slot;

      streams[mySlot] = stream;
      setVideo(mySlot,stream,true);

      statusEl.textContent =
        "접속 완료 · " + mySlot + "번 자리";

      startBtn.style.display = "none";

      setupPeerEvents();

      if(mySlot === 1){
        promotedSlot = 1;
      }

      promote(promotedSlot,false);

      addSystem(
        "참가자 " + mySlot + "님이 입장했습니다."
      );

      setTimeout(syncPeers,800);
      resolve();
    });

    testPeer.on("error",(err)=>{

      if(finished) return;

      if(err.type === "unavailable-id"){
        finished = true;
        try{testPeer.destroy()}catch(e){}
        setTimeout(()=>{
          claimSlot(slot+1).then(resolve).catch(reject);
        },100);
        return;
      }

      console.error(err);

      if(
        err.type === "peer-unavailable" ||
        err.type === "network" ||
        err.type === "server-error"
      ){
        return;
      }

      statusEl.textContent = "연결 오류";
    });
  });
}


/* --------------------------
   Peer 연결
-------------------------- */

function setupPeerEvents(){

  peer.on("call",(call)=>{

    const slot = slotFromPeer(call.peer);
    if(!slot) return;

    call.answer(stream);
    saveCall(slot,call);
  });


  peer.on("connection",(conn)=>{
    setupDataConnection(conn);
  });


  peer.on("disconnected",()=>{
    statusEl.textContent = "재연결 중...";
    try{
      peer.reconnect();
    }catch(e){}
  });


  peer.on("close",()=>{
    statusEl.textContent = "연결 종료";
  });


  peer.on("error",(err)=>{
    if(err.type !== "peer-unavailable"){
      console.log("Peer error:",err);
    }
  });
}


/* --------------------------
   다른 참가자 자동 연결
-------------------------- */

function syncPeers(){

  if(!peer || !stream || !mySlot) return;

  for(let slot=1;slot<=MAX_USERS;slot++){

    if(slot === mySlot) continue;

    /* 번호가 작은 사람이 연결을 시작
       중복 연결 방지 */
    if(mySlot < slot){

      if(!dataPeers[slot] ||
         !dataPeers[slot].open){

        try{
          const conn = peer.connect(peerId(slot),{
            reliable:true
          });
          setupDataConnection(conn);
        }catch(e){}
      }

      if(!calls[slot]){

        try{
          const call = peer.call(
            peerId(slot),
            stream
          );

          if(call){
            saveCall(slot,call);
          }
        }catch(e){}
      }
    }
  }
}


/* --------------------------
   영상 통화 저장
-------------------------- */

function saveCall(slot,call){

  if(calls[slot] && calls[slot] !== call){
    try{calls[slot].close()}catch(e){}
  }

  calls[slot] = call;

  call.on("stream",(remoteStream)=>{
    streams[slot] = remoteStream;
    setVideo(slot,remoteStream,false);

    if(slot === promotedSlot){
      showOnStage(slot);
    }
  });

  call.on("close",()=>{
    cleanupSlot(slot);
  });

  call.on("error",()=>{
    cleanupSlot(slot);
  });
}


/* --------------------------
   데이터 연결
-------------------------- */

function setupDataConnection(conn){

  const slot = slotFromPeer(conn.peer);
  if(!slot) return;

  dataPeers[slot] = conn;

  conn.on("open",()=>{

    sendOne(conn,{
      type:"hello",
      slot:mySlot,
      promotedSlot
    });

    broadcastPresence();
  });

  conn.on("data",(data)=>{
    handleData(data,slot);
  });

  conn.on("close",()=>{
    if(dataPeers[slot] === conn){
      delete dataPeers[slot];
    }
  });

  conn.on("error",()=>{});
}


/* --------------------------
   데이터 처리
-------------------------- */

function handleData(data,fromSlot){

  if(!data || typeof data !== "object") return;

  if(data.type === "chat"){
    addChat(data.slot,data.text);
  }

  if(data.type === "system"){
    addSystem(data.text);
  }

  if(data.type === "promote"){
    promotedSlot = data.slot;
    showOnStage(promotedSlot);
  }

  if(data.type === "hello"){
    if(data.promotedSlot){
      promotedSlot = data.promotedSlot;
      showOnStage(promotedSlot);
    }
  }

  if(data.type === "giftbox"){
    startGiftBox(data.seconds || 10);
  }

  if(data.type === "rose"){
    addSystem(
      "🌹 참가자 " + data.slot +
      "님이 장미를 보냈습니다."
    );
  }

  if(data.type === "gift"){
    addSystem(
      "🎁 참가자 " + data.slot +
      "님이 선물을 보냈습니다."
    );
  }

  if(data.type === "lottery"){
    addSystem(data.text);
  }
}


/* --------------------------
   영상 표시
-------------------------- */

function setVideo(slot,s,muted){

  const video =
    document.getElementById("video-"+slot);

  const empty =
    document.getElementById("empty-"+slot);

  if(!video) return;

  video.srcObject = s;
  video.muted = muted;
  video.style.display = "block";

  if(empty){
    empty.style.display = "none";
  }

  if(slot === mySlot){
    document.getElementById("name-"+slot)
      .textContent =
      slot === 1 ? "👑 호스트" : "나";
  }
}


function cleanupSlot(slot){

  delete calls[slot];
  delete streams[slot];

  const video =
    document.getElementById("video-"+slot);

  const empty =
    document.getElementById("empty-"+slot);

  if(video){
    video.srcObject = null;
    video.style.display = "none";
  }

  if(empty){
    empty.style.display = "flex";
  }

  if(promotedSlot === slot){
    promotedSlot = 1;
    showOnStage(1);
  }
}


/* --------------------------
   큰 화면 올리기 / 내리기
-------------------------- */

function promote(slot,shouldBroadcast){

  if(slot < 1 || slot > MAX_USERS) return;

  promotedSlot = slot;

  showOnStage(slot);

  if(shouldBroadcast){
    broadcast({
      type:"promote",
      slot
    });

    addSystem(
      "참가자 " + slot +
      "님이 큰 화면으로 이동했습니다."
    );
  }
}


function showOnStage(slot){

  const s = streams[slot];

  if(!s){
    stageVideo.srcObject = null;
    stageTitle.textContent =
      "참가자 " + slot + "번";
    stageSub.textContent =
      "참가자를 기다리는 중입니다.";
    return;
  }

  stageVideo.srcObject = s;

  /* 내 영상이 큰 화면일 때 소리 울림 방지 */
  stageVideo.muted = slot === mySlot;

  if(slot === 1){
    stageTitle.textContent = "👑 호스트";
  }else{
    stageTitle.textContent =
      "🎤 참가자 " + slot;
  }

  stageSub.textContent =
    "현재 큰 방송 화면";
}


/* --------------------------
   채팅
-------------------------- */

function sendChat(){

  const input =
    document.getElementById("chatText");

  const text =
    input.value.trim();

  if(!text || !mySlot) return;

  addChat(mySlot,text);

  broadcast({
    type:"chat",
    slot:mySlot,
    text
  });

  input.value="";
}


document.getElementById("chatText")
.addEventListener("keydown",(e)=>{
  if(e.key === "Enter"){
    sendChat();
  }
});


function addChat(slot,text){

  const div =
    document.createElement("div");

  div.className="msg";

  const safe =
    String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

  div.innerHTML =
    "<b>참가자 "+slot+"</b> : "+safe;

  messages.appendChild(div);
  messages.scrollTop =
    messages.scrollHeight;
}


function addSystem(text){

  const div =
    document.createElement("div");

  div.className="msg system";
  div.textContent=text;

  messages.appendChild(div);
  messages.scrollTop =
    messages.scrollHeight;
}


/* --------------------------
   데이터 전송
-------------------------- */

function sendOne(conn,data){
  try{
    if(conn && conn.open){
      conn.send(data);
    }
  }catch(e){}
}


function broadcast(data){

  Object.values(dataPeers)
  .forEach(conn=>{
    sendOne(conn,data);
  });
}


function broadcastPresence(){
  broadcast({
    type:"hello",
    slot:mySlot,
    promotedSlot
  });
}


/* --------------------------
   장미 / 선물
-------------------------- */

function sendRose(){

  if(!mySlot) return;

  addSystem(
    "🌹 참가자 " + mySlot +
    "님이 장미를 보냈습니다."
  );

  broadcast({
    type:"rose",
    slot:mySlot
  });
}


function sendGift(){

  if(!mySlot) return;

  addSystem(
    "🎁 참가자 " + mySlot +
    "님이 선물을 보냈습니다."
  );

  broadcast({
    type:"gift",
    slot:mySlot
  });
}


/* --------------------------
   선물상자
-------------------------- */

function openGiftBox(){

  if(!mySlot) return;

  startGiftBox(10);

  broadcast({
    type:"giftbox",
    seconds:10
  });

  addSystem(
    "📦 선물상자가 열렸습니다!"
  );
}


function startGiftBox(seconds){

  clearInterval(giftTimer);

  giftSeconds=seconds;
  giftReceived=false;

  const box =
    document.getElementById("giftBox");

  const count =
    document.getElementById("giftCount");

  const btn =
    document.getElementById("giftReceive");

  box.style.display="block";
  btn.disabled=true;

  count.textContent=
    giftSeconds+"초";

  giftTimer=setInterval(()=>{

    giftSeconds--;

    if(giftSeconds>0){
      count.textContent=
        giftSeconds+"초";
    }else{

      clearInterval(giftTimer);

      count.textContent=
        "지금 누르세요!";

      btn.disabled=false;

      setTimeout(()=>{
        if(!giftReceived){
          box.style.display="none";
        }
      },7000);
    }

  },1000);
}


function receiveGift(){

  if(giftReceived) return;

  giftReceived=true;

  const reward=
    Math.floor(Math.random()*5)+1;

  document.getElementById("giftCount")
    .textContent=
    "🌹 장미 "+reward+"개 당첨";

  document.getElementById("giftReceive")
    .disabled=true;

  addSystem(
    "🎉 참가자 "+mySlot+
    "님이 선물상자에서 장미 "+
    reward+"개를 받았습니다."
  );

  setTimeout(()=>{
    document.getElementById("giftBox")
      .style.display="none";
  },3000);
}

function lottery(){

  if(!mySlot) return;

  const prizes=[
    0,0,1,2,3,4,5
  ];

  const result=
    prizes[
      Math.floor(
        Math.random()*prizes.length
      )

  if(result===0){

      "🎯 참가자 "+mySlot+

      "🎯 참가자 "+mySlot+
      "님 제비뽑기 결과: 🌹 장미 "+
      result+"개";
  }

  addSystem(text);

  broadcast({
    type:"lottery",

  });
}

async function copyInvite(){

  const url=
    location.origin+
    location.pathname+

  try{
    await navigator.clipboard.writeText(url);

/* --------------------------
   나가기
-------------------------- */

function leaveRoom(){

  Object.values(calls)
    .forEach(c=>{
      try{c.close()}catch(e){}
    });

  Object.values(dataPeers)
    .forEach(c=>{
      try{c.close()}catch(e){}
    });

  if(stream){
    stream.getTracks()
      .forEach(t=>t.stop());
  }

  if(peer){
    try{peer.destroy()}catch(e){}
  }

  location.reload();
}


/* --------------------------
   끊긴 참가자 자동 복구
-------------------------- */

const lostSince={};

setInterval(()=>{

  if(!peer || !stream || !mySlot) return;

  Object.keys(calls)
    .forEach(key=>{

      const slot=Number(key);
      const call=calls[slot];

      if(!call) return;

      const pc=call.peerConnection;

      const state=
        pc ? pc.connectionState : "";

      if(state==="connected"){
        delete lostSince[slot];
        return;
      }

      if(
        state==="disconnected" ||
        state==="failed" ||
        state==="closed"
      ){

        if(!lostSince[slot]){
          lostSince[slot]=Date.now();
        }

        if(
          Date.now()-
          lostSince[slot] > 4000
        ){

          try{
            call.close();
          }catch(e){}

          delete calls[slot];
          delete lostSince[slot];

          cleanupSlot(slot);

          setTimeout(syncPeers,500);
        }
      }
    });

  syncPeers();

},2500);


/* 화면 꺼짐 등에서 돌아왔을 때 재연결 */
document.addEventListener(
  "visibilitychange",
  ()=>{
    if(!document.hidden){
      setTimeout(syncPeers,500);
    }
  }
);

window.addEventListener(
  "beforeunload",
  ()=>{
    try{
      if(peer) peer.destroy();
    }catch(e){}
  }
);
</script>
