<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 하단바 및 노치 영역 대응을 위한 viewport 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>K-Talk Live</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 1. 전체 화면 컨테이너 (100dvh 적용 + 하단 여백 확보) */
    .app-container {
      width: 100%;
      /* 모바일 브라우저 주소창 가변 높이 대응 */
      min-height: 100vh;
      min-height: 100dvh;
      
      display: flex;
      flex-direction: column;

      /* 최하단 메뉴/바에 콘텐츠가 가려지지 않도록 패딩 추가 */
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 2. 하단 고정 네비게이션/아이콘 바 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 60px;
      background-color: rgba(18, 18, 24, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      border-top: 1px solid rgba(255, 255, 255, 0.1);

      /* 모바일 하단 제스처 바(홈 바) 영역만큼 여백 추가 */
      padding-bottom: env(safe-area-inset-bottom);
      height: calc(60px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>

  <!-- 메인 화면 래퍼 -->
  <div class="app-container">
    <!-- 기존 화면 요소들(방송 화면, 참여자 목록, 채팅창, 선물 박스 등)이 들어갑니다 -->
  </div>

  <!-- 하단 아이콘 메뉴 바 -->
  <div class="bottom-nav">
    <!-- 하단 버튼 아이콘들이 들어갑니다 -->
  </div>

</body>
</html>
