<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#050308;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}:root{--gold:#f5cb61;--pink:#ff43c8;--purple:#8c34d8;--panel:#0b0810;--line:#51315d}.app{width:100%;max-width:760px;min-height:100dvh;margin:auto;padding:4px 5px 58px;background:linear-gradient(#050308,#08050b)}.header{height:38px;display:grid;grid-template-columns:95px 1fr 90px;align-items:center;border-bottom:1px solid #654f22}.logo{text-align:center;color:var(--gold);font-size:24px;font-weight:900}.logo small{display:block;font-size:8px;color:#bbb}.onair{font-size:9px;font-weight:900}.onair b{background:#e12645;border-radius:5px;padding:4px 7px}.people{text-align:right;font-size:9px;color:#ddd}.topmenu{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:4px 0}.topmenu button{border:1px solid #5a3763;background:#120b18;color:#fff;border-radius:6px;height:29px;padding:1px;font-size:8px;font-weight:900}.notice{height:27px;overflow:hidden;display:flex;align-items:center;border:1px solid #5d3e66;border-radius:7px;background:#0b0710;margin-bottom:4px}.noticeTrack{white-space:nowrap;display:inline-flex;gap:40px;min-width:max-content;animation:scroll 17s linear infinite;font-size:8px;font-weight:900;color:#ffd35b}.noticeTrack .pink{color:#ff69df}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}.broadcast{display:grid;grid-template-columns:48% 52%;gap:4px;height:323px}.host{position:relative;overflow:hidden;border:1px solid #5b4c68;border-radius:8px;background:#130c18}.host video,.guest video{width:100%;height:100%;object-fit:cover}.hostPlaceholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:65px;background:radial-gradient(circle at 50% 30%,#55234c,#120a17 65%)}.hostTag{position:absolute;left:6px;top:6px;z-index:4;font-size:8px;color:#ff4860;font-weight:900}.check{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;border:1px solid #ff42d0;background:#7d165d;color:#ffd96b;border-radius:18px;padding:4px 8px;font-size:8px;font-weight:900}.wave{position:absolute;left:5px;right:5px;bottom:5px;height:42px;z-index:4;background:#0005;border-radius:5px}#waveCanvas{width:100%;height:100%}.guests{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3px}.guest{position:relative;overflow:hidden;min-width:0;border:1px solid #45394d;border-radius:6px;background:#120e15}.guestPlaceholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 50% 32%,#594356,#151018 65%)}.gno{position:absolute;top:2px;left:2px;z-index:3;min-width:17px;height:17px;padding:0 3px;display:flex;align-items:center;justify-content:center;background:#b98413;border-radius:4px;font-size:8px;font-weight:900}.gmic{position:absolute;right:3px;top:2px;z-index:3;font-size:9px}.gname{position:absolute;left:3px;bottom:2px;z-index:3;background:#0008;padding:2px 3px;border-radius:3px;font-size:6px}.lower{display:grid;grid-template-columns:48% 52%;gap:4px;margin-top:4px;height:245px}.chat,.giftPanel{border:1px solid #4a3153;border-radius:8px;background:#09070c;overflow:hidden}.chat{display:flex;flex-direction:column}.chatHead{flex:0 0 27px;display:flex;align-items:center;justify-content:space-between;padding:0 7px;border-bottom:1px solid #3c2444;font-size:8px}.chatHead b{color:#e978ff}.messages{flex:1;overflow-y:auto;padding:5px 6px;font-size:8px;line-height:1.35}.messages b{color:#53d9ff}.chatInput{flex:0 0 31px;display:grid;grid-template-columns:1fr 44px;gap:3px;padding:3px}.chatInput input{width:100%;min-width:0;border:1px solid #423745;border-radius:5px;background:#141119;color:#fff;padding:0 6px;font-size:8px}.chatInput button{border:0;border-radius:5px;background:#8f26bd;color:#fff;font-size:8px;font-weight:900}.giftPanel{padding:4px;display:grid;grid-template-rows:18px 55px 52px 1fr;gap:3px}.giftTitle{font-size:8px;font-weight:900}.roses{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.roses button{border:1px solid #4d2856;background:#100914;color:#fff;border-radius:6px;padding:2px 1px;font-size:7px;font-weight:900}.roses .r{display:block;font-size:18px;line-height:20px}.roses small{display:block;color:#ffd15b;font-size:6px}.events{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.events button{border:1px solid #5b2a66;background:#160b1d;border-radius:7px;color:#fff;font-size:7px;font-weight:900}.events span{display:block;font-size:20px}.bigEvent{display:grid;grid-template-columns:repeat(2,1fr);gap:3px}.bigEvent button{border:1px solid #60306d;border-radius:7px;background:linear-gradient(135deg,#2c0a38,#1a0b22);color:#fff;font-size:8px;font-weight:900}.beauty{border:1px solid #49304f;border-radius:8px;margin-top:4px;padding:5px;background:#0a080d}.beautyTop{display:grid;grid-template-columns:55px 1fr 38px;gap:5px;align-items:center;font-size:8px}.beauty input[type=range]{width:100%}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}.filters button{border:1px solid #51305d;background:#160b1b;color:#fff;border-radius:6px;padding:5px 1px;font-size:7px}.filters button.active{border-color:#ff4ee6;box-shadow:0 0 8px #ff4ee677;color:#ffd765}.modalBack{display:none;position:fixed;inset:0;z-index:100;background:#000b;align-items:center;justify-content:center;padding:14px}.modal{width:100%;max-width:420px;max-height:85dvh;overflow:auto;border:1px solid #7c458d;border-radius:13px;background:#100b15;padding:13px}.modal h3{margin:0 0 10px;color:#ffd05d}.modal button{border:0;border-radius:8px;background:#8b29b3;color:#fff;padding:9px;margin-top:6px;font-weight:900}.modal .close{background:#333}.movieList{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.movie{border:1px solid #4b3554;border-radius:8px;padding:10px;background:#18101c;text-align:center}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:50;width:100%;max-width:760px;height:52px;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0810f5;border-top:1px solid #4a3050}.bottom button{border:0;background:transparent;color:#ccc;font-size:7px}.bottom button span{display:block;font-size:19px}.toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:65px;z-index:999;background:#160d1eee;border:1px solid #8b41a8;border-radius:8px;padding:8px 12px;font-size:9px}@media(max-width:430px){.app{padding-left:3px;padding-right:3px}.header{height:34px;grid-template-columns:72px 1fr 70px}.logo{font-size:20px}.topmenu button{font-size:7px;height:27px}.notice{height:23px}.broadcast{height:292px;gap:3px}.guests{gap:2px}.lower{height:218px;gap:3px}.messages{font-size:7px}.filters button{font-size:6px}}
</style>

<body>
<div class="app">
<div class="header"><div class="onair"><b>● ON AIR</b></div><div class="logo">♛ K-Talk<small>실시간 화상 방송</small></div><div class="people" id="peopleCount">👤 1 / 13</div></div>
<div class="topmenu"><button onclick="startRoom()">📹 방송하기</button><button onclick="openSecret()">🔒 비밀방</button><button onclick="toast('마이페이지')">👤 마이페이지</button><button onclick="toast('충전하기')">💰 충전하기</button><button onclick="leaveRoom()">↩ 나가기</button></div>
<div class="notice"><div class="noticeTrack"><span>★ 출석체크 · 아침 · 점심 · 저녁 ★</span><span class="pink">🎁 보물상자가 올라왔습니다 · 눌러서 받기</span><span>★ 광고 문의 · 운영 공지 ★</span><span>★ 출석체크 · 아침 · 점심 · 저녁 ★</span><span class="pink">🎁 보물상자가 올라왔습니다 · 눌러서 받기</span></div></div>
<div class="broadcast"><div class="host"><div class="hostPlaceholder" id="hostPlaceholder">🎤</div><video id="localVideo" autoplay playsinline muted></video><div class="hostTag">● HOST ON AIR</div><button class="check" onclick="attendance()">💗 출석체크</button><div class="wave"><canvas id="waveCanvas"></canvas></div></div><div class="guests" id="guestGrid"></div></div>
<div class="lower"><div class="chat"><div class="chatHead"><b>실시간 채팅</b><span>🔊 자동읽기</span></div><div class="messages" id="messages"><b>K-Talk AI</b> 반갑습니다. 즐거운 방송 되세요!<br><b>민수</b> 노래 좋아요 👍<br><b>해피걸</b> 오늘 분위기 최고예요 ❤️<br><b>별빛</b> 장미 선물합니다 🌹</div><div class="chatInput"><input id="chatText" placeholder="메시지를 입력하세요..."><button onclick="sendChat()">전송</button></div></div>
<div class="giftPanel"><div class="giftTitle">🎁 선물 / 후원</div><div class="roses"><button onclick="sendRose(1)"><span class="r">🌹</span>1개<small>🪙 50</small></button><button onclick="sendRose(5)"><span class="r">🌹</span>5개<small>🪙 250</small></button><button onclick="sendRose(10)"><span class="r">🌹</span>10개<small>🪙 500</small></button><button onclick="sendRose(50)"><span class="r">🌹</span>50개<small>🪙 2,500</small></button><button onclick="sendRose(100)"><span class="r">🌹</span>100개<small>🪙 5,000</small></button></div><div class="events"><button onclick="attendance()"><span>💗</span>출석체크</button><button onclick="lottery()"><span>🎰</span>제비뽑기</button><button onclick="treasure()"><span>🧰</span>보물상자</button></div><div class="bigEvent"><button onclick="openBigGift()">🐋 🚘 🚀<br>대형 선물</button><button onclick="openMovie()">🎬 영화 보기<br>장미 10개 · 6시간</button></div></div></div>
<div class="beauty"><div class="beautyTop"><b>✨ 얼굴보정</b><input id="beautyRange" type="range" min="1" max="100" value="35" oninput="setBeauty(this.value)"><b id="beautyValue">35</b></div><div class="filters"><button class="active" onclick="setFaceFilter('normal',this)">원본</button><button onclick="setFaceFilter('beauty',this)">예쁨</button><button onclick="setFaceFilter('handsome',this)">잘생김</button><button onclick="setFaceFilter('young',this)">동안</button><button onclick="setFaceFilter('cute',this)">귀여움</button><button onclick="setFaceFilter('funny',this)">웃긴얼굴</button></div></div>
</div>
<div class="bottom"><button onclick="toast('홈')"><span>🏠</span>홈</button><button onclick="openMovie()"><span>🎬</span>영화방</button><button onclick="toast('쇼츠')"><span>▶️</span>쇼츠</button><button onclick="toast('라디오')"><span>📻</span>라디오</button><button onclick="toast('설정')"><span>⚙️</span>설정</button></div>
<div class="modalBack" id="modalBack"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const MAX_USERS=13,BASE="ktalk-live-final-v20260820-slot-";let localStream=null,peer=null,mySlot=0,syncTimer=null,beautyStrength=35,currentFilter="normal";const calls=new Map(),pending=new Map(),retryAfter=new Map(),lastSeen=new Map(),guestEmojis=["👩🏻","👨🏻","👩🏻","👨🏻","👩🏻","👨🏻","👩🏻","👨🏻","👩🏻","👨🏻","👩🏻","👨🏻"],guestNames=["지수","민수","보라","태훈","수현","준호","해피걸","루이","별빛","도레미","사랑","최강자"];
function buildGuestGrid(){let g=document.getElementById("guestGrid");g.innerHTML="";for(let i=2;i<=13;i++){let x=i-2,d=document.createElement("div");d.className="guest";d.id="slot-"+i;d.innerHTML=`<div class="guestPlaceholder">${guestEmojis[x]}</div><div class="gno">${i}</div><div class="gmic">🎙</div><div class="gname">${guestNames[x]}</div>`;g.appendChild(d)}}buildGuestGrid();
function setBeauty(v){beautyStrength=+v;document.getElementById("beautyValue").textContent=v;applyVideoFilter()}function setFaceFilter(t,b){currentFilter=t;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");applyVideoFilter()}function applyVideoFilter(){let v=document.getElementById("localVideo"),s=beautyStrength/100,f="";if(currentFilter==="normal")f=`brightness(${1+s*.1}) contrast(${1+s*.03}) saturate(${1+s*.08})`;if(currentFilter==="beauty")f=`brightness(${1.04+s*.18}) contrast(${.98+s*.02}) saturate(${1.04+s*.12})`;if(currentFilter==="handsome")f=`contrast(${1.05+s*.12}) saturate(${.95+s*.1}) brightness(${1+s*.08})`;if(currentFilter==="young")f=`brightness(${1.06+s*.18}) saturate(${1.02+s*.1}) contrast(${.97+s*.02})`;if(currentFilter==="cute")f=`brightness(${1.07+s*.15}) saturate(${1.15+s*.2}) contrast(.97)`;if(currentFilter==="funny")f=`hue-rotate(${s*60}deg) saturate(${1.3+s}) contrast(1.1)`;v.style.filter=f}
function peerId(s){return BASE+s}function slotFromPeerId(id){let m=String(id||"").match(/slot-(\d+)$/);return m?+m[1]:0}
function resetRemote(s){if(s<2||s>13)return;let b=document.getElementById("slot-"+s),i=s-2;if(!b)return;b.innerHTML=`<div class="guestPlaceholder">${guestEmojis[i]}</div><div class="gno">${s}</div><div class="gmic">🎙</div><div class="gname">${guestNames[i]}</div>`}
function renderRemote(s,st){if(s<2||s>13)return;let b=document.getElementById("slot-"+s);if(!b)return;b.innerHTML="";let v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.srcObject=st;let n=document.createElement("div");n.className="gno";n.textContent=s;let m=document.createElement("div");m.className="gmic";m.textContent="🎙";let g=document.createElement("div");g.className="gname";g.textContent=guestNames[s-2]||"참가자 "+s;b.append(v,n,m,g);lastSeen.set(s,Date.now());updatePeopleCount()}
function closeSlot(s){let c=calls.get(s);if(c)try{c.close()}catch(e){}calls.delete(s);pending.delete(s);lastSeen.delete(s);resetRemote(s);retryAfter.set(s,Date.now()+1200);updatePeopleCount()}
function attachCall(s,c){if(!s||s===mySlot||!c)return;let o=calls.get(s);if(o&&o!==c)try{o.close()}catch(e){}calls.set(s,c);pending.delete(s);lastSeen.set(s,Date.now());c.on("stream",st=>{calls.set(s,c);pending.delete(s);lastSeen.set(s,Date.now());renderRemote(s,st)});c.on("close",()=>{if(calls.get(s)===c)closeSlot(s)});c.on("error",()=>{if(calls.get(s)===c)closeSlot(s)})}
function claimSlot(s){return new Promise(r=>{let p=new Peer(peerId(s),{debug:0,config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}}),d=false,f=v=>{if(d)return;d=true;r(v)};p.on("open",()=>f(p));p.on("error",()=>{try{p.destroy()}catch(e){}f(null)});setTimeout(()=>{if(!d){try{p.destroy()}catch(e){}f(null)}},2200)})}
function shouldDial(s){return !!(peer&&localStream&&mySlot&&s>0&&s<mySlot&&!calls.has(s)&&!pending.has(s)&&(retryAfter.get(s)||0)<=Date.now())}
function dial(s){if(!shouldDial(s))return;pending.set(s,Date.now());let c;try{c=peer.call(peerId(s),localStream,{metadata:{slot:mySlot}})}catch(e){pending.delete(s);retryAfter.set(s,Date.now()+1500);return}if(!c){pending.delete(s);return}attachCall(s,c);setTimeout(()=>{if(pending.has(s)){try{c.close()}catch(e){}pending.delete(s);retryAfter.set(s,Date.now()+1500)}},7000)}
function syncPeers(){if(!peer||!localStream||!mySlot)return;for(let s=1;s<mySlot;s++)if(shouldDial(s))dial(s);for(const[s,c]of calls.entries()){let pc=c&&c.peerConnection,state=pc?pc.connectionState:"";if(state==="connected"){lastSeen.set(s,Date.now());continue}if(state==="failed"||state==="closed"){closeSlot(s);continue}if(state==="disconnected"&&Date.now()-(lastSeen.get(s)||Date.now())>4000)closeSlot(s)}}
async function startRoom(){if(localStream||peer){toast("이미 방송 연결 중입니다.");return}try{localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480},frameRate:{ideal:18,max:24}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}catch(e){alert("카메라와 마이크를 허용해 주세요.");return}document.getElementById("localVideo").srcObject=localStream;document.getElementById("hostPlaceholder").style.display="none";applyVideoFilter();toast("방송 연결 중...");for(let i=1;i<=MAX_USERS;i++){let p=await claimSlot(i);if(p){peer=p;mySlot=i;break}}if(!peer){localStream.getTracks().forEach(t=>t.stop());localStream=null;alert("현재 방이 가득 찼습니다.");return}peer.on("call",c=>{let s=slotFromPeerId(c.peer);if(!s||s===mySlot){try{c.close()}catch(e){}return}try{c.answer(localStream)}catch(e){}attachCall(s,c)});peer.on("disconnected",()=>{toast("연결 복구 중...");setTimeout(()=>{try{peer.reconnect()}catch(e){}},1000)});peer.on("error",e=>console.log("Peer error",e));syncPeers();syncTimer=setInterval(syncPeers,2000);updatePeopleCount();toast(mySlot===1?"진행자로 입장했습니다.":"참가자 "+mySlot+"번으로 입장했습니다.")}
function leaveRoom(){if(syncTimer){clearInterval(syncTimer);syncTimer=null}for(const s of [...calls.keys()])closeSlot(s);if(peer){try{peer.destroy()}catch(e){}peer=null}if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}document.getElementById("localVideo").srcObject=null;document.getElementById("hostPlaceholder").style.display="flex";mySlot=0;updatePeopleCount();toast("방송에서 나왔습니다.")}
function updatePeopleCount(){document.getElementById("peopleCount").textContent="👤 "+(localStream?1+calls.size:1)+" / 13"}
function sendChat(){let i=document.getElementById("chatText"),t=i.value.trim();if(!t)return;let m=document.getElementById("messages");m.insertAdjacentHTML("beforeend",`<br><b>나</b> ${escapeHtml(t)}`);i.value="";m.scrollTop=m.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function sendRose(n){toast("🌹 장미 "+n+"개를 선물했습니다.")}function attendance(){toast("💗 출석체크 완료!")}function lottery(){let p=["🌹 장미 1개","🌹 장미 2개","🌹 장미 3개","🌹 장미 4개","🌹 장미 5개","꽝","꽝"];toast("🎰 제비뽑기: "+p[Math.floor(Math.random()*p.length)])}
function treasure(){openModal(`<h3>🧰 보물상자</h3><p>누구나 보물상자를 올릴 수 있습니다.</p><p>⏱ 2~3분 카운트다운 후 열립니다.</p><button onclick="toast('보물상자를 올렸습니다.');closeModal()">보물상자 올리기</button><button class="close" onclick="closeModal()">닫기</button>`)}
function openBigGift(){openModal(`<h3>🎁 대형 선물</h3><div class="movieList"><div class="movie">🐋<br>고래</div><div class="movie">🚘<br>슈퍼카</div><div class="movie">🚀<br>우주선</div><div class="movie">🏰<br>황금성</div></div><button class="close" onclick="closeModal()">닫기</button>`)}
function openMovie(){openModal(`<h3>🎬 K-Talk 영화방</h3><p>입장료: 🌹 장미 10개</p><p>이용시간: 6시간</p><div class="movieList"><div class="movie">🎞 최신 영화</div><div class="movie">😂 코미디</div><div class="movie">💕 로맨스</div><div class="movie">💥 액션</div></div><button onclick="enterMovieRoom()">🌹 10개로 입장하기</button><button class="close" onclick="closeModal()">취소</button>`)}
function enterMovieRoom(){closeModal();toast("🎬 영화방에 입장했습니다. 이용시간 6시간")}
function openSecret(){openModal(`<h3>🔒 비밀방</h3><p>최대 6명까지 입장할 수 있습니다.</p><input id="secretPassword" type="password" placeholder="비밀번호 입력" style="width:100%;height:42px;border:1px solid #5b3b62;background:#17101b;color:#fff;border-radius:8px;padding:0 10px"><button onclick="enterSecret()">비밀방 입장</button><button class="close" onclick="closeModal()">취소</button>`)}
function enterSecret(){let p=document.getElementById("secretPassword").value.trim();if(!p){toast("비밀번호를 입력하세요.");return}closeModal();toast("🔒 비밀방 입장 완료 · 최대 6명")}
function openModal(h){document.getElementById("modal").innerHTML=h;document.getElementById("modalBack").style.display="flex"}function closeModal(){document.getElementById("modalBack").style.display="none"}document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()})
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>x.style.display="none",1800)}
const canvas=document.getElementById("waveCanvas"),ctx=canvas.getContext("2d");function resizeWave(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio}resizeWave();addEventListener("resize",resizeWave);let waveTime=0;function drawWave(){let w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);let bars=46,gap=2*devicePixelRatio,bw=(w-gap*(bars-1))/bars;for(let i=0;i<bars;i++){let v=(Math.sin(waveTime+i*.45)+1)/2,hh=Math.max(3*devicePixelRatio,h*(.18+v*.75));ctx.fillStyle=`hsl(${(i*9+waveTime*70)%360} 100% 60%)`;ctx.fillRect(i*(bw+gap),(h-hh)/2,bw,hh)}waveTime+=.055;requestAnimationFrame(drawWave)}drawWave();addEventListener("beforeunload",()=>{try{leaveRoom()}catch(e){}})
</script>
</body>
