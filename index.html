<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk 시험 방송방</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
body{
  margin:0;
  background:#090711;
  color:white;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:430px;
  margin:auto;
  padding:14px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.brand{
  color:#ffd76a;
  font-size:22px;
  font-weight:bold;
}
.onair{
  background:#ff2e6d;
  padding:8px 12px;
  border-radius:10px;
  font-weight:bold;
}
.mainvideo{
  margin-top:12px;
  height:260px;
  background:#15151c;
  border-radius:16px;
  overflow:hidden;
  position:relative;
}
.mainvideo video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.message{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
}
.buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}
button{
  flex:1;
  padding:13px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  color:white;
}
.start{background:#9148ff;}
.stop{background:#333;}
.status{
  margin-top:10px;
  background:#1c1524;
  color:#ffd76a;
  padding:10px;
  border-radius:10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:10px;
}
.person{
  height:78px;
  background:#211829;
  border:1px solid #4a3457;
  border-radius:11px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
  font-size:12px;
}
.person video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.label{
  position:absolute;
  bottom:3px;
  left:3px;
  background:#0009;
  padding:2px 5px;
  border-radius:5px;
  font-size:10px;
}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
  <div>
    <div class="brand">👑 K-Talk</div>
    <div style="font-size:12px;color:#aaa">시험 방송방 · 최대 13명</div>
  </div>
  <div class="onair">ON AIR</div>
</div>

<div class="mainvideo">
  <div id="msg" class="message">방송 시작을 누르세요</div>
  <video id="myVideo" autoplay playsinline muted></video>
</div>

<div class="buttons">
  <button class="start" onclick="startRoom()">📹 방송 시작</button>
  <button class="stop" onclick="stopRoom()">방송 종료</button>
</div>

<div id="status" class="status">대기 중</div>

<div class="grid">
  <div class="person">진행자</div>
  <div class="person" id="guest">참가자 2</div>
  <div class="person">참가자 3</div>
  <div class="person">참가자 4</div>

  <div class="person">참가자 5</div>
  <div class="person">참가자 6</div>
  <div class="person">참가자 7</div>
  <div class="person">참가자 8</div>

  <div class="person">참가자 9</div>
  <div class="person">참가자 10</div>
  <div class="person">참가자 11</div>
  <div class="person">참가자 12</div>

  <div class="person">참가자 13</div>
</div>

</div>

<script>
let stream;
let peer;
let call;

const ROOM_ID = "ktalk-test-room-main-20260815";

function statusText(text){
  document.getElementById("status").innerText = text;
}

function showGuest(remoteStream){
  const box = document.getElementById("guest");
  box.innerHTML = "";

  const video = document.createElement("video");
  video.autoplay = true;
  video.playsInline = true;
  video.srcObject = remoteStream;

  const label = document.createElement("div");
  label.className = "label";
  label.innerText = "참가자 2";

  box.appendChild(video);
  box.appendChild(label);

  statusText("✅ 상대방 연결됨");
}

async function startRoom(){

  if(stream) return;

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true
      }
    });

    document.getElementById("myVideo").srcObject = stream;
    document.getElementById("msg").style.display = "none";

  }catch(e){
    alert("카메라와 마이크 권한을 허용해 주세요.");
    return;
  }

  statusText("방 연결 중...");
  startHost();
}

function startHost(){

  peer = new Peer(ROOM_ID);

  let hostOpened = false;

  peer.on("open", function(){
    hostOpened = true;
    statusText("진행자 대기 중 · 상대방도 방송 시작을 눌러주세요");
  });

  peer.on("call", function(incomingCall){

    call = incomingCall;
    call.answer(stream);

    call.on("stream", function(remoteStream){
      showGuest(remoteStream);
    });
  });

  peer.on("error", function(err){

    if(!hostOpened && err.type === "unavailable-id"){
      try{ peer.destroy(); }catch(e){}
      startGuest();
    }else{
      statusText("연결 오류 · 다시 시도해 주세요");
    }
  });

  setTimeout(function(){
    if(!hostOpened && peer && !peer.destroyed){
      try{ peer.destroy(); }catch(e){}
      startGuest();
    }
  },2500);
}

function startGuest(){

  statusText("참가자로 연결 중...");

  peer = new Peer();

  peer.on("open", function(){

    call = peer.call(ROOM_ID, stream);

    call.on("stream", function(remoteStream){
      showGuest(remoteStream);
    });

    call.on("close", function(){
      statusText("상대방 연결 종료");
    });
  });

  peer.on("error", function(){
    statusText("연결 오류 · 다시 시도해 주세요");
  });
}

function stopRoom(){

  try{
    if(call) call.close();
  }catch(e){}

  try{
    if(peer) peer.destroy();
  }catch(e){}

  if(stream){
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  peer = null;
  call = null;

  document.getElementById("myVideo").srcObject = null;
  document.getElementById("msg").style.display = "flex";
  document.getElementById("guest").innerHTML = "참가자 2";

  statusText("대기 중");
}
</script>

</body>
</html>
