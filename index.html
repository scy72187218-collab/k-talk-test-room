<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050409;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

button,input{
  font-family:inherit;
}

.app{
  width:100vw;
  height:100dvh;
  padding:4px;
  display:grid;
  grid-template-rows:
    40px
    32px
    27px
    31dvh
    minmax(0,1fr)
    48px;
  gap:4px;
  overflow:hidden;
}

/* 상단 */
.header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  min-height:0;
}

.live{
  font-size:8px;
  font-weight:900;
}

.live b{
  background:#f01850;
  padding:5px 6px;
  border-radius:6px;
}

.logo{
  text-align:center;
  color:#ffd43c;
  font-size:18px;
  font-weight:900;
}

.logo small{
  display:block;
  color:#fff;
  font-size:7px;
  margin-top:1px;
}

.viewer{
  text-align:right;
  font-size:9px;
}

/* 큰 입장 버튼 */
.roomBar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
}

.roomBtn{
  border:0;
  border-radius:8px;
  font-size:10px;
  font-weight:900;
}

.publicBtn{
  background:linear-gradient(135deg,#ffc928,#ff7900);
  color:#1b1100;
}

.secretBtn{
  background:linear-gradient(135deg,#7132ff,#db2cff);
  color:#fff;
}

.roomBtn.active{
  outline:2px solid #fff;
}

/* 안내 */
.notice{
  border:1px solid #5f266d;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7px;
  font-weight:900;
  white-space:nowrap;
}

/* 방송 영역 */
.main{
  min-height:0;
  display:grid;
  grid-template-columns:46% 54%;
  gap:4px;
}

/* 호스트 - 그대로 */
.host{
  position:relative;
  min-height:0;
  height:100%;
  overflow:hidden;
  border:1px solid #6a2a7c;
  border-radius:8px;
  background:#0b0810;
}

.host video{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 25%;
}

.hostLive{
  position:absolute;
  top:5px;
  left:5px;
  color:#ff365e;
  font-size:8px;
  font-weight:900;
}

.attendance{
  position:absolute;
  top:5px;
  right:5px;
  background:rgba(55,0,67,.78);
  border:1px solid #ff42d6;
  border-radius:20px;
  padding:2px 5px;
  color:#ffe24b;
  font-size:7px;
  font-weight:900;
  box-shadow:0 0 7px rgba(255,42,210,.55);
}

.hostName{
  position:absolute;
  bottom:5px;
  left:5px;
  background:rgba(0,0,0,.72);
  border-radius:6px;
  padding:3px 6px;
  color:#ffd43c;
  font-size:8px;
  font-weight:900;
}

/* =========================
   게스트 12명
   여기만 크게 수정
========================= */

.guestGrid{
  min-height:0;
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(4,minmax(0,1fr));

  /* 기존보다 간격 최대한 줄임 */
  gap:1px;
}

.slot{
  position:relative;
  min-width:0;
  min-height:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111015;
  border:1px solid #39313f;

  /* 테두리 공간도 조금 줄임 */
  border-radius:4px;
}

.slot video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.slotNo{
  position:absolute;
  top:2px;
  left:2px;
  z-index:4;
  width:18px;
  height:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  background:#777;
  font-size:8px;
  font-weight:900;
}

.slot:nth-child(1) .slotNo{
  background:#ffd32d;
  color:#111;
}

.slot:nth-child(2) .slotNo{
  background:#f43e93;
}

.slot:nth-child(3) .slotNo{
  background:#e87818;
}

.slot:nth-child(4) .slotNo{
  background:#1ea9d0;
}

.slot:nth-child(5) .slotNo{
  background:#7431e7;
}

.slot:nth-child(6) .slotNo{
  background:#26a964;
}

.slotName{
  position:absolute;
  left:2px;
  right:2px;
  bottom:1px;
  z-index:4;
  padding:9px 2px 2px;
  font-size:7px;
  font-weight:900;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.96)
  );
}

.slotRose{
  position:absolute;
  right:2px;
  bottom:2px;
  z-index:5;
  font-size:10px;
}

.empty{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#69626e;
  font-size:7px;
}

/* 채팅 + 선물 - 그대로 */
.lower{
  min-height:0;
  display:grid;
  grid-template-columns:46% 54%;
  gap:4px;
}

.panel{
  min-height:0;
  overflow:hidden;
  border:1px solid #59266a;
  border-radius:8px;
  background:#0d0912;
}

.title{
  height:24px;
  display:flex;
  align-items:center;
  padding:0 6px;
  border-bottom:1px solid #43204e;
  font-size:8px;
  font-weight:900;
}

.messages{
  height:calc(100% - 55px);
  padding:5px;
  overflow:hidden;
  font-size:8px;
  line-height:1.55;
}

.messages b{
  color:#45ddff;
}

.chatInput{
  height:31px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:3px;
  padding:3px;
}

.chatInput input{
  min-width:0;
  border:1px solid #3b3043;
  border-radius:6px;
  background:#18121d;
  color:#fff;
  padding:4px;
  font-size:7px;
}

.chatInput button{
  border:0;
  border-radius:6px;
  background:#8c30df;
  color:#fff;
  font-size:7px;
  font-weight:900;
  padding:0 8px;
}

/* 선물 */
.rightPanel{
  min-height:0;
  display:grid;
  grid-template-rows:minmax(0,1fr) 48px;
  gap:4px;
}

.giftWrap{
  padding:3px;
}

.giftRow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
}

.gift{
  border:1px solid #482750;
  border-radius:5px;
  background:#17101b;
  color:#fff;
  padding:2px 0;
  font-size:6px;
}

.gift span{
  display:block;
  font-size:17px;
}

.gift strong{
  display:block;
  color:#ffd63c;
  font-size:6px;
  margin-top:1px;
}

.giftBottom{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:3px;
  margin-top:3px;
}

.roseArea{
  border:1px solid #6e2c57;
  border-radius:6px;
  padding:3px;
}

.roseArea b{
  display:block;
  color:#ffd53d;
  font-size:6.5px;
  margin-bottom:2px;
}

.roseBtns{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
}

.roseBtns button{
  border:0;
  border-radius:4px;
  background:#19111d;
  color:#fff;
  font-size:5.5px;
  padding:2px 0;
}

.roseBtns span{
  display:block;
  font-size:12px;
}

.giftBox{
  border:1px solid #a13cff;
  border-radius:6px;
  background:linear-gradient(
    145deg,
    #411653,
    #15091d
  );
  color:#fff;
  font-size:6px;
  font-weight:900;
}

.giftBox span{
  display:block;
  font-size:22px;
}

/* 제비뽑기 - 그대로 유지 */
.lottery{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid #9e3bff;
  border-radius:7px;
  background:linear-gradient(
    90deg,
    #270b33,
    #110812
  );
  padding:4px;
}

.lottery b{
  color:#ffb8ff;
  font-size:7px;
}

.lottery small{
  display:block;
  font-size:5.5px;
  margin-top:2px;
}

.machine{
  font-size:22px;
}

/* 하단 메뉴 */
.bottomNav{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  background:#131019;
  border-top:1px solid #302537;
  border-radius:8px 8px 0 0;
}

.nav{
  text-align:center;
  font-size:7px;
}

.nav span{
  display:block;
  font-size:16px;
}

.charge{
  margin:3px 6px;
  padding:4px 1px;
  border-radius:22px;
  background:#f9005d;
  font-weight:900;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="live">
      <b>● ON AIR</b>
      <span id="clock">00:00:00</span>
    </div>

    <div class="logo">
      👑 K-Talk
      <small>화상 방송 · 최대 12명</small>
    </div>

    <div class="viewer">
      👤 <span id="viewerCount">0</span>
    </div>

  </div>

  <div class="roomBar">

    <button
      id="publicBtn"
      class="roomBtn publicBtn active"
      onclick="enterRoom('public')">
      📺 1번 일반 방송방
    </button>

    <button
      id="secretBtn"

      onclick="enterRoom('secret')">
      🔐 2번 비밀방
    </button>

  </div>

  <div class="notice">
    ʚ 💗 출석체크 💗 ɞ · 신청곡 5,000원 · 🌹 장미 1개 50원
  </div>

  <div class="main">

    <div class="host">

      <video
        id="hostVideo"
        autoplay
        playsinline>
      </video>

      <div class="hostLive">
        ● ON AIR
      </div>

      <div class="attendance">
        ʚ 💗 출석체크 💗 ɞ
      </div>

      <div
        class="hostName"
        id="hostName">
        👑 호스트 대기
      </div>

    </div>

    <div
      class="guestGrid"
      id="guestGrid">
    </div>

  </div>

  <div class="lower">

    <div class="panel">

      <div class="title">
        💬 실시간 채팅
      </div>

      <div
        class="messages"
        id="messages">

        <div>
          <b>K-Talk</b>
          방송방에 오신 것을 환영합니다.
        </div>

        <div>
          <b>안내</b>
          즐겁게 이용해 주세요. ❤️
        </div>

        <div>
          <b>관리자</b>
          좋은 방송 감사합니다. 💜
        </div>

      <div class="chatInput">

        <input

        <button onclick="sendChat()">

        </button>

      </div>

    <div class="rightPanel">

      <div class="panel giftWrap">

          <button
            class="gift"

          <button
            class="gift"
            onclick="sendGift('하트',100)">
            <span>💖</span>
            하트
            <strong>100</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('별',200)">
            <span>⭐</span>
            별
            <strong>200</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('자동차',500)">
            <span>🚗</span>
            자동차
            <strong>500</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('고래',1000)">
            <span>🐋</span>
            고래
            <strong>1000</strong>
          </button>

        </div>

        <div class="giftBottom">

          <div class="roseArea">

            <b>🌹 장미 선물</b>

            <div class="roseBtns">

              <button onclick="sendRose(1)">
                <span>🌹</span>1
              </button>

              <button onclick="sendRose(5)">
                <span>🌹</span>5
              </button>

              <button onclick="sendRose(10)">
                <span>🌹</span>10
              </button>

              <button onclick="sendRose(50)">
                <span>💐</span>50
              </button>

              <button onclick="sendRose(100)">
                <span>💐</span>100
              </button>

            </div>

          </div>

          <button
            class="giftBox"

            <span>🎁</span>

          </button>

      </div>

      <div
        class="lottery"
        onclick="drawLottery()">

        <div>
          <b>🎯 제비뽑기 이벤트</b>

            아침 · 점심 · 저녁 하루 3회

  </div>

  <div class="bottomNav">

    <div class="nav">

      홈

    </div>

    <div class="nav charge">
      <span>🪙</span>
      충전
    </div>

    <div class="nav">
      <span>🔔</span>
      알림
    </div>

    <div class="nav">
      <span>⚙️</span>
      설정
    </div>

  </div>

</div>

<script type="module">

import {
  joinRoom,
  selfId
} from 'https://esm.run/trystero'

let room=null
let stream=null
let roomType='public'

let myRole='guest'
let myName='참가자'

const peers={}
const peerStreams={}

const guestGrid=
document.getElementById('guestGrid')

/* 게스트 12자리 */
for(let i=1;i<=12;i++){

  const slot=
  document.createElement('div')

  slot.className='slot'

  slot.innerHTML=`
    <video
      id="video${i}"
      autoplay
      playsinline>
    </video>

    <div
      class="empty"
      id="empty${i}">
      빈자리
    </div>

    <div class="slotNo">
      ${i}
    </div>

    <div
      class="slotName"
      id="name${i}">
      빈자리
    </div>

    <div class="slotRose">
      🌹
    </div>
  `

  guestGrid.appendChild(slot)
}

/* 큰 버튼으로 입장 */
window.enterRoom=
async function(type){

  if(room)return

  roomType=type

  document
  .getElementById('publicBtn')
  .classList.toggle(
    'active',
    type==='public'
  )

  document
  .getElementById('secretBtn')
  .classList.toggle(
    'active',
    type==='secret'
  )

  const roomName=
  type==='secret'
  ?'ktalk-secret-7777'
  :'ktalk-public-main'

  try{

    stream=
    await navigator.mediaDevices
    .getUserMedia({

      video:true,

      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }

    })

  }catch(error){

    alert(
      '카메라와 마이크 사용을 허용해 주세요.'
    )

    return
  }

  room=
  joinRoom(
    {
      appId:'ktalk-final-12-2026'
    },
    roomName
  )

  const profile=
  room.makeAction('profile')

  const chat=
  room.makeAction('chat')

  const gift=
  room.makeAction('gift')

  window.chatAction=chat
  window.giftAction=gift

  myRole='guest'
  myName='참가자'

  peers[selfId]={
    name:myName,
    role:myRole
  }

  peerStreams[selfId]=stream

  profile.onMessage=
  (data,{peerId})=>{

    peers[peerId]=data
    render()
  }

  chat.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  gift.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  room.onPeerJoin=
  peerId=>{

    profile.send(
      {
        name:myName,
        role:myRole
      },
      {
        target:peerId
      }
    )

    room.addStream(
      stream,
      {
        target:peerId
      }
    )
  }

  room.onPeerLeave=
  peerId=>{

    delete peers[peerId]
    delete peerStreams[peerId]

    render()
  }

  room.onPeerStream=
  (incoming,peerId)=>{

    peerStreams[peerId]=incoming
    render()
  }

  room.addStream(stream)

  profile.send({
    name:myName,
    role:myRole
  })

  render()

  /* 첫 입장자는 자동 호스트 */
  setTimeout(()=>{

    const otherHost=
    Object.keys(peers)
    .some(
      id=>
      id!==selfId &&
      peers[id]?.role==='host'
    )

    if(!otherHost){

      myRole='host'
      myName='호스트'

      peers[selfId]={
        name:'호스트',
        role:'host'
      }

      profile.send({
        name:'호스트',
        role:'host'
      })

      render()
    }

  },1000)
}

/* 화면 표시 */
function render(){

  const ids=
  Object.keys(peers)

  document
  .getElementById('viewerCount')
  .textContent=
  ids.length

  const hostId=
  ids.find(
    id=>
    peers[id]?.role==='host'
  )

  const hostVideo=
  document.getElementById(
    'hostVideo'
  )

  if(
    hostId &&
    peerStreams[hostId]
  ){

    hostVideo.srcObject=
    peerStreams[hostId]

    hostVideo.muted=
    hostId===selfId

    document
    .getElementById('hostName')
    .textContent=
    '👑 '+
    (
      peers[hostId]?.name
      ||
      '호스트'
    )

  }else{

    hostVideo.srcObject=null

    document
    .getElementById('hostName')
    .textContent=
    '👑 호스트 대기'
  }

  const guests=
  ids.filter(
    id=>id!==hostId
  )

  for(let i=1;i<=12;i++){

    const peerId=
    guests[i-1]

    const video=
    document.getElementById(
      'video'+i
    )

    const empty=
    document.getElementById(
      'empty'+i
    )

    const name=
    document.getElementById(
      'name'+i
    )

    if(peerId){

      empty.style.display='none'

      name.textContent=
      peers[peerId]?.name
      ||
      '참가자 '+i

      if(peerStreams[peerId]){

        video.srcObject=
        peerStreams[peerId]

        video.muted=
        peerId===selfId
      }

    }else{

      video.srcObject=null
      empty.style.display='flex'
      name.textContent='빈자리'
    }
  }
}

/* 안전 문자 */
function safe(text){

  return String(text)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
}

/* 채팅 */
function addMessage(
  name,
  text
){

  const line=
  document.createElement('div')

  line.innerHTML=
  '<b>'+
  safe(name)+
  '</b> '+
  safe(text)

  document
  .getElementById('messages')
  .appendChild(line)
}

window.sendChat=
function(){

  if(!window.chatAction)return

  const input=
  document.getElementById(
    'chatText'
  )

  const text=
  input.value.trim()

  if(!text)return

  addMessage(
    myName,
    text
  )

  window.chatAction.send({
    name:myName,
    text:text
  })

  input.value=''
}

/* 선물 */
window.sendGift=
function(name,price){

  if(!window.giftAction)return

  const text=
  `🎁 ${name} 선물 ${price}원`

  addMessage(
    myName,
    text
  )

  window.giftAction.send({
    name:myName,
    text:text
  })
}

/* 장미 */
window.sendRose=
function(count){

  if(!window.giftAction)return

  const text=
  `🌹 장미 ${count}개 선물`

  addMessage(
    myName,
    text
  )

  window.giftAction.send({
    name:myName,
    text:text
  })
}

/* 선물상자 */
window.openGiftBox=
function(){

  if(!window.giftAction)return

  const text=
  '🎁 선물상자가 열렸습니다.'

  addMessage(
    myName,
    text
  )

  window.giftAction.send({
    name:myName,
    text:text
  })
}

/* 제비뽑기 */
window.drawLottery=
function(){

  const prizes=[
    '꽝',
    '꽝',
    '장미 1개',
    '장미 2개',
    '장미 3개',
    '장미 4개',
    '장미 5개'
  ]

  const result=
  prizes[
    Math.floor(
      Math.random()*
      prizes.length
    )
  ]

  alert(
    '제비뽑기 결과 : '+
    result
  )
}

/* 엔터 채팅 */
document
.getElementById('chatText')
.addEventListener(
  'keydown',
  event=>{

    if(event.key==='Enter'){
      window.sendChat()
    }
  }
)

/* 시계 */
setInterval(()=>{

  const now=
  new Date()

  document
  .getElementById('clock')
  .textContent=

  String(
    now.getHours()
  ).padStart(2,'0')
  +
  ':'
  +
  String(
    now.getMinutes()
  ).padStart(2,'0')
  +
  ':'
  +
  String(
    now.getSeconds()
  ).padStart(2,'0')

},1000)

</script>
