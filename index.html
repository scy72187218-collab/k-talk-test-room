<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk LIVE</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08070d;color:#fff;
 font-family:Arial,"Noto Sans KR",sans-serif
}
.app{max-width:480px;margin:auto;min-height:100vh;background:#0c0912}
header{
 display:flex;align-items:center;justify-content:space-between;
 padding:13px 14px;background:#15101d;position:sticky;top:0;z-index:10
}
.logo{font-size:22px;font-weight:900;color:#ff4fa3}
.live{background:#ff245f;padding:5px 9px;border-radius:8px;font-size:12px}
.auth button{
 border:0;border-radius:15px;padding:7px 10px;margin-left:4px;
 background:#7c3cff;color:#fff;font-weight:bold
}
.notice{
 padding:9px 12px;text-align:center;font-size:12px;
 background:#241632;color:#ffd9eb
}
.grid{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:4px;padding:5px
}
.slot{
 position:relative;background:#17131e;border-radius:9px;
 overflow:hidden;aspect-ratio:3/4;border:1px solid #2c2436
}
.slot.host{grid-column:span 2;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;background:#111}
.tag{
 position:absolute;top:5px;left:5px;background:#5d496e;
 border-radius:8px;padding:3px 6px;font-size:10px
}
.name{
 position:absolute;bottom:34px;left:5px;right:5px;
 font-size:12px;font-weight:bold;text-shadow:0 1px 3px #000
}
.gift{
 position:absolute;bottom:5px;left:5px;
 border:0;border-radius:14px;background:#e9277d;
 color:#fff;padding:5px 9px;font-size:12px;font-weight:bold
}
.join{
 position:absolute;bottom:5px;right:5px;
 border:0;border-radius:50%;width:27px;height:27px;
 background:#444;color:white;font-size:18px
}
.controls{
 padding:8px;display:flex;gap:6px;background:#100c17;
 position:sticky;bottom:0
}
.controls button{
 border:0;border-radius:18px;padding:10px;
 background:#292131;color:white;font-weight:bold
}
.controls .start{background:#7c3cff;flex:1}
.controls .rose{background:#d91f73}
.chat{flex:1;background:#292131;border:0;border-radius:18px;padding:10px;color:white}

.membership{
 margin:10px;padding:12px;background:#17111f;border-radius:12px
}
.membership h3{margin:0 0 8px;color:#ff63ad}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.plan{
 background:#251b31;border-radius:10px;padding:8px 5px;
 text-align:center;font-size:11px
}
.plan b{display:block;font-size:13px;color:#ffd05c}
.plan.vip{border:1px solid #ffc52c}
.level{
 margin:8px 10px;padding:9px;background:#14101b;
 border-radius:10px;font-size:12px
}
.toast{
 display:none;position:fixed;left:50%;bottom:85px;
 transform:translateX(-50%);background:#000e;
 padding:10px 16px;border-radius:20px;z-index:50
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">K-Talk <span class="live">LIVE</span></div>
 <div class="auth">
  <button onclick="login()">로그인</button>
  <button onclick="signup()">가입</button>
 </div>
</header>

<div class="notice">
 QR로 바로 방송 구경 · 채팅/선물/참여는 가입 후 이용
</div>

<div class="grid" id="grid"></div>

<div class="level">
 ⭐ 내 레벨 <b id="level">1</b> · 🎁 선물 활동으로 레벨 UP
 · 일반회원은 <b>Lv.10부터 비밀방 개설</b>
</div>

<div class="membership">
 <h3>💎 K-Talk 구독 혜택</h3>
 <div class="plans">
  <div class="plan">
   <b>일반회원</b>
   월 5,000원<br>장미 5% 할인<br>비밀방 입장
  </div>
  <div class="plan">
   <b>중회원</b>
   월 14,900원<br>장미 10% 할인<br>비밀방 입장
  </div>
  <div class="plan vip">
   <b>👑 VIP</b>
   월 19,900원<br>장미 15% 할인<br>비밀방 입장<br>같이보기
  </div>
 </div>
</div>

<div class="controls">
 <input class="chat" placeholder="입력하세요...">
 <button>👥</button>
 <button class="rose" onclick="gift(1)">🌹</button>
 <button onclick="giftBox()">🎁</button>
 <button class="start" onclick="startCamera()">방송 시작</button>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
const MAX=13;
let stream=null;
let peer=null;
let mySlot=0;
let calls={};
let level=1;
let giftPoints=0;

const grid=document.getElementById("grid");

function buildSlots(){
 grid.innerHTML="";
 for(let i=0;i<MAX;i++){
  const d=document.createElement("div");
  d.className="slot"+(i===0?" host":"");
  d.id="slot"+i;
  d.innerHTML=
   '<video id="v'+i+'" autoplay playsinline></video>'+
   '<span class="tag">'+(i===0?"호스트":"게스트 "+i)+'</span>'+
   '<div class="name" id="n'+i+'">'+(i===0?"호스트":"참가자")+'</div>'+
   '<button class="gift" onclick="giftTo('+i+')">🌹 선물</button>'+
   '<button class="join" onclick="joinPerson('+i+')">+</button>';
  grid.appendChild(d);
 }
}
buildSlots();

function msg(t){
 const x=document.getElementById("toast");
 x.innerText=t;x.style.display="block";
 setTimeout(()=>x.style.display="none",1800);
}

function signup(){
 const nick=prompt("사용할 닉네임을 입력하세요.");
 if(nick){
  localStorage.setItem("ktalkUser",nick);
  msg(nick+"님 가입되었습니다.");
 }
}

function login(){
 const nick=prompt("닉네임을 입력하세요.");
 if(nick){
  localStorage.setItem("ktalkUser",nick);
  msg(nick+"님 로그인되었습니다.");
 }
}

function userCheck(){
 if(!localStorage.getItem("ktalkUser")){
  if(confirm("이 기능은 가입 후 이용할 수 있습니다.\n지금 가입하시겠습니까?")){
   signup();
  }
  return false;
 }
 return true;
}

async function startCamera(){
 if(!userCheck())return;
 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},
   audio:true
  });
  document.getElementById("v0").srcObject=stream;
  document.getElementById("n0").innerText=
   localStorage.getItem("ktalkUser")||"호스트";
  startPeer();
  msg("방송을 시작했습니다.");
 }catch(e){
  alert("카메라와 마이크를 허용해 주세요.");
 }
}

function startPeer(){
 if(peer)return;
 const room=new URLSearchParams(location.search).get("room")||"main";
 const id="ktalk-"+room+"-"+Math.random().toString(36).slice(2,8);
 peer=new Peer(id);

 peer.on("open",()=>{
  localStorage.setItem("ktalkPeer",id);
 });

 peer.on("call",call=>{
  if(!stream)return;
  call.answer(stream);
  call.on("stream",remote=>{
   const slot=findEmpty();
   if(slot<0)return;
   calls[slot]=call;
   document.getElementById("v"+slot).srcObject=remote;
   document.getElementById("n"+slot).innerText="게스트";
  });
 });
}

function findEmpty(){
 for(let i=1;i<MAX;i++){
  const v=document.getElementById("v"+i);
  if(v && !v.srcObject)return i;
 }
 return -1;
}

function joinPerson(i){
 if(!userCheck())return;
 msg(i===0?"호스트에게 참여 요청했습니다.":"게스트에게 참여 요청했습니다.");
}

function giftTo(i){
 if(!userCheck())return;
 giftPoints+=1;
 updateLevel();
 msg((i===0?"호스트":"게스트 "+i)+"에게 🌹 장미를 보냈습니다.");
}

function gift(n){
 if(!userCheck())return;
 giftPoints+=n;
 updateLevel();
 msg("🌹 장미 "+n+"송이를 보냈습니다.");
}

function giftBox(){
 if(!userCheck())return;
 msg("🎁 선물박스가 올라왔습니다!");
}

function updateLevel(){
 level=Math.min(50,1+Math.floor(giftPoints/10));
 document.getElementById("level").innerText=level;
 localStorage.setItem("ktalkLevel",level);
}

window.addEventListener("load",()=>{
 const lv=parseInt(localStorage.getItem("ktalkLevel")||"1");
 level=lv;
 document.getElementById("level").innerText=level;
});
</script>
</body>
</html>
