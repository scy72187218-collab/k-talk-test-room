<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk 실시간 방송</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#07070b;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* 상단 */
header{
  height:54px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  background:#0c0c12;
  border-bottom:1px solid #44234f;
}

.logo{
  color:#ffd64a;
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.live{
  background:#e82247;
  padding:5px 7px;
  border-radius:8px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.room-title{
  flex:1;
  text-align:center;
  color:#ddd;
  font-size:10px;
}

#startBtn{
  border:0;
  border-radius:8px;
  background:#8c32e2;
  color:white;
  padding:8px;
  font-size:11px;
  font-weight:900;
}

/* 공지 */
.notice{
  margin:5px 6px;
  padding:7px 4px;
  text-align:center;
  background:#110b15;
  border:1px solid #512760;
  border-radius:8px;
  color:#ffdc64;
  font-size:10px;
}

/* =========================
   방송 화면
========================= */

.broadcast{
  display:grid;
  grid-template-columns:46% 54%;
  gap:5px;
  padding:0 6px;
  align-items:start;
}

/* 왼쪽 큰 화면 */
.stage{
  position:relative;
  height:250px;
  overflow:hidden;
  border:1px solid #60306e;
  border-radius:9px;
  background:#121217;
}

.stage video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#121217;
}

.stage-info{
  position:absolute;
  left:6px;
  right:6px;
  bottom:6px;
  padding:5px 6px;
  border-radius:6px;
  background:rgba(0,0,0,.68);
}

#stageName{
  color:#ffd84d;
  font-size:11px;
  font-weight:900;
}

.stage-help{
  margin-top:2px;
  color:#ddd;
  font-size:8px;
}

/* 오른쪽 13명 */
.members{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.member{
  position:relative;
  height:47px;
  overflow:hidden;
  background:#17131c;
  border:1px solid #51305c;
  border-radius:6px;
}

.member video{
  display:none;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#776d7d;
  font-size:8px;
}

.number{
  position:absolute;
  top:2px;
  left:2px;
  width:15px;
  height:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:4px;
  background:rgba(0,0,0,.75);
  font-size:7px;
}

.member-name{
  position:absolute;
  left:2px;
  bottom:2px;
  max-width:78%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  padding:1px 3px;
  border-radius:3px;
  background:rgba(0,0,0,.75);
  font-size:7px;
}

.mini-rose{
  position:absolute;
  right:2px;
  bottom:1px;
  font-size:10px;
}

/* 상태 */
.status{
  margin:5px 6px;
  padding:6px 8px;
  border:1px solid #492655;
  border-radius:7px;
  background:#100b14;
  color:#ffd95c;
  font-size:9px;
}

/* =========================
   채팅 + 선물
========================= */

.lower{
  display:grid;
  grid-template-columns:50% 50%;
  gap:5px;
  padding:0 6px 68px;
}

/* 채팅 */
.chat{
  overflow:hidden;
  border:1px solid #52285f;
  border-radius:8px;
  background:#0e0a12;
}

.chat-title{
  padding:6px 7px;
  border-bottom:1px solid #402148;
  color:#f5ddff;
  font-size:10px;
  font-weight:900;
}

#messages{
  height:125px;
  overflow-y:auto;
  padding:6px;
  font-size:9px;
  line-height:1.45;
}

.message{
  margin-bottom:4px;
}

.system{
  color:#ffd95c;
}

.chat-input{
  display:flex;
  border-top:1px solid #402148;
}

#chatText{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:#18111d;
  color:#fff;
  padding:8px 5px;
  font-size:9px;
}

.send{
  width:44px;
  border:0;
  background:#8132d6;
  color:#fff;
  font-size:9px;
  font-weight:900;
}

/* 선물 */
.right-panel{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.panel{
  overflow:hidden;
  border:1px solid #52285f;
  border-radius:8px;
  background:#0e0a12;
}

.panel-title{
  padding:5px 6px;
  border-bottom:1px solid #402148;
  font-size:9px;
  font-weight:900;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
  padding:4px;
}

.gift{
  border:0;
  border-radius:6px;
  background:#1c1422;
  color:#fff;
  padding:5px 1px;
  font-size:7px;
}

.gift span{
  display:block;
  margin-bottom:1px;
  font-size:18px;
}

.events{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
  padding:4px;
}

.event{
  border:1px solid #77368f;
  border-radius:6px;
  background:#211029;
  color:#fff;
  padding:8px 2px;
  font-size:8px;
  font-weight:900;
}

/* =========================
   아래 고정 버튼
========================= */

.controls{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  padding:5px 6px;
  background:rgba(9,9,14,.98);
  border-top:1px solid #402149;
}

.control{
  min-height:49px;
  border:0;
  border-radius:9px;
  background:#211829;
  color:#fff;
  font-size:8px;
}

.control span{
  display:block;
  margin-bottom:1px;
  font-size:17px;
}

.control.end{
  background:#dc264a;
}

/* 선물상자 */
#giftPopup{
  display:none;
  position:fixed;
  z-index:500;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  width:170px;
  padding:13px 8px;
  text-align:center;
  background:#23102c;
  border:2px solid #b84cff;
  border-radius:13px;
  box-shadow:0 0 30px rgba(173,61,255,.45);
}

.gift-icon{
  font-size:45px;
}

#giftReceive{
  margin-top:8px;
  border:0;
  border-radius:7px;
  background:#ffd53f;
  padding:7px 12px;
  font-weight:900;
}

/* 큰 휴대폰 */
@media(min-width:600px){
  .stage{height:275px}
  .member{height:52px}
  #messages{height:140px}
}

/* 작은 휴대폰 */
@media(max-width:380px){
  .broadcast{
    grid-template-columns:45% 55%;
  }

  .stage{
    height:235px;
  }

  .member{
    height:44px;
  }

  #messages{
    height:115px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">♛ K-Talk</div>
  <div class="live">● ON AIR</div>
  <div class="room-title">실시간 화상 방송 · 13명</div>
  <button id="startBtn">방송 시작</button>
</header>

<div class="notice">
  ⭐ 출석체크 · 신청곡 · 선물 · 실시간 채팅 ⭐
</div>

<div class="broadcast">

  <div class="stage">
    <video id="stageVideo" autoplay playsinline></video>

    <div class="stage-info">
      <div id="stageName">진행자 큰 화면</div>
      <div class="stage-help">
        호스트가 참가자를 누르면 큰 화면으로 이동합니다.
      </div>
    </div>
  </div>

  <div id="members" class="members"></div>

</div>

<div id="status" class="status">
  방송 시작을 눌러주세요.
</div>

<div class="lower">

  <div class="chat">

    <div class="chat-title">
      💬 실시간 채팅
    </div>

    <div id="messages">
      <div class="message system">
        관리자 : K-Talk 방송방입니다.
      </div>
    </div>

    <div class="chat-input">
      <input
        id="chatText"
        maxlength="120"
        placeholder="메시지 입력"
      >
      <button class="send" onclick="sendChat()">
        전송
      </button>
    </div>

  </div>

  <div class="right-panel">

    <div class="panel">

      <div class="panel-title">
        🎁 선물 / 후원
      </div>

      <div class="gifts">

        <button class="gift" onclick="sendRose(1)">
          <span>🌹</span>
          장미 1
        </button>

        <button class="gift" onclick="sendRose(10)">
          <span>💐</span>
          장미 10
        </button>

        <button class="gift" onclick="sendRose(50)">
          <span>🌹</span>
          장미 50
        </button>

        <button class="gift" onclick="sendGift('❤️ 하트')">
          <span>❤️</span>
          하트
        </button>

        <button class="gift" onclick="sendGift('⭐ 별')">
          <span>⭐</span>
          별
        </button>

        <button class="gift" onclick="sendGift('🐋 고래')">
          <span>🐋</span>
          고래
        </button>

      </div>
    </div>

    <div class="panel">

      <div class="panel-title">
        🎉 이벤트
      </div>

      <div class="events">

        <button class="event" onclick="openGiftBox()">
          🎁 선물상자
        </button>

        <button class="event" onclick="lottery()">
          🎯 제비뽑기
        </button>

      </div>
    </div>

  </div>
</div>

<div class="controls">

  <button id="micBtn" class="control" onclick="toggleMic()">
    <span>🎤</span>
    마이크
  </button>

  <button id="camBtn" class="control" onclick="toggleCamera()">
    <span>📷</span>
    카메라
  </button>

  <button class="control" onclick="copyInvite()">
    <span>🔗</span>
    초대
  </button>

  <button class="control end" onclick="leaveRoom()">
    <span>☎️</span>
    나가기
  </button>

</div>

<div id="giftPopup">

  <div class="gift-icon">🎁</div>

  <b>선물상자</b>

  <div id="giftCount"
       style="margin-top:5px;color:#ffda59">
    10초
  </div>

  <button
    id="giftReceive"
    onclick="receiveGift()"
    disabled>
    기다리는 중
  </button>

</div>

<script>
"use strict";

const MAX_USERS = 13;

const params =
  new URLSearchParams(location.search);

const ROOM =
  (params.get("room") || "main")
  .replace(/[^a-zA-Z0-9_-]/g,"")
  .slice(0,30);

const PREFIX =
  "ktalk-" + ROOM + "-";

let peer = null;
let localStream = null;
let mySlot = null;

const calls = {};
const connections = {};
const streams = {};

let bigSlot = null;

let micOn = true;
let cameraOn = true;

let giftTimer = null;
let giftSeconds = 0;
let giftReceived = false;

const members =
  document.getElementById("members");

const stageVideo =
  document.getElementById("stageVideo");

const stageName =
  document.getElementById("stageName");

const statusEl =
  document.getElementById("status");

const messages =
  document.getElementById("messages");

const startBtn =
  document.getElementById("startBtn");


/* 13자리 만들기 */
function buildSlots(){

  members.innerHTML = "";

  for(let i=1;i<=MAX_USERS;i++){

    const box =
      document.createElement("div");

    box.className = "member";
    box.id = "member-" + i;

    box.innerHTML = `
      <div id="empty-${i}" class="empty">
        대기
      </div>

      <video
        id="video-${i}"
        autoplay
        playsinline>
      </video>

      <div class="number">${i}</div>

      <div
        id="name-${i}"
        class="member-name">
        참가자 ${i}
      </div>

      <div class="mini-rose">🌹</div>
    `;

    box.addEventListener("click",()=>{

      if(
        mySlot === 1 &&
        streams[i]
      ){
        setBigScreen(i,true);
      }

    });

    members.appendChild(box);
  }
}

buildSlots();


/* Peer ID */
function peerId(slot){
  return PREFIX + slot;
}

function getSlot(id){

  if(
    !id ||
    !id.startsWith(PREFIX)
  ){
    return null;
  }

  const n =
    Number(id.slice(PREFIX.length));

  if(
    Number.isInteger(n) &&
    n >= 1 &&
    n <= MAX_USERS
  ){
    return n;
  }

  return null;
}


/* 방송 시작 */
startBtn.addEventListener(
  "click",
  startBroadcast
);

async function startBroadcast(){

  if(localStream) return;

  try{

    statusEl.textContent =
      "카메라와 마이크 연결 중...";

    localStream =
      await navigator.mediaDevices
      .getUserMedia({
        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });

    await claimSlot(1);

  }catch(error){

    console.error(error);

    statusEl.textContent =
      "카메라와 마이크 권한을 허용해 주세요.";

    alert(
      "카메라와 마이크 사용을 허용해 주세요."
    );
  }
}


/* 빈 자리 찾기 */
function claimSlot(slot){

  return new Promise((resolve,reject)=>{

    if(slot > MAX_USERS){

      alert("방송방이 가득 찼습니다.");

      reject(
        new Error("room-full")
      );

      return;
    }

    statusEl.textContent =
      slot + "번 자리 확인 중...";

    const candidate =
      new Peer(
        peerId(slot),
        {debug:0}
      );

    let finished = false;

    candidate.on("open",()=>{

      if(finished) return;

      finished = true;

      peer = candidate;
      mySlot = slot;

      streams[mySlot] =
        localStream;

      showSlot(
        mySlot,
        localStream,
        true
      );

      setupPeer();

      if(mySlot === 1){

        document
          .getElementById("name-1")
          .textContent =
          "👑 호스트";

        setBigScreen(1,false);

      }else{

        document
          .getElementById(
            "name-" + mySlot
          )
          .textContent =
          "나";
      }

      startBtn.style.display =
        "none";

      statusEl.textContent =
        mySlot === 1
        ? "호스트로 입장했습니다."
        : mySlot +
          "번 참가자로 입장했습니다.";

      addSystem(
        "참가자 " +
        mySlot +
        "님이 입장했습니다."
      );

      setTimeout(
        syncRoom,
        500
      );

      resolve();
    });

    candidate.on("error",error=>{

      if(
        error.type ===
        "unavailable-id"
      ){

        if(finished) return;

        finished = true;

        try{
          candidate.destroy();
        }catch(e){}

        setTimeout(()=>{

          claimSlot(slot+1)
            .then(resolve)
            .catch(reject);

        },100);

        return;
      }

      if(
        error.type !==
        "peer-unavailable"
      ){
        console.log(error);
      }
    });
  });
}


/* Peer 이벤트 */
function setupPeer(){

  peer.on("call",call=>{

    const slot =
      getSlot(call.peer);

    if(!slot) return;

    call.answer(localStream);

    registerCall(
      slot,
      call
    );
  });


  peer.on(
    "connection",
    connection=>{

      registerConnection(
        connection
      );
    }
  );


  peer.on("disconnected",()=>{

    statusEl.textContent =
      "연결 복구 중...";

    try{
      peer.reconnect();
    }catch(e){}
  });


  peer.on("error",error=>{

    if(
      error.type !==
      "peer-unavailable"
    ){
      console.log(
        "Peer 오류:",
        error
      );
    }
  });
}


/* 참가자 자동 연결 */
function syncRoom(){

  if(
    !peer ||
    !localStream ||
    !mySlot
  ){
    return;
  }

  /*
   작은 번호가 큰 번호에게 연결합니다.
   모든 참가자가 주기적으로 확인하므로
   나중에 들어온 사람도 자동 연결됩니다.
  */

  for(
    let slot=mySlot+1;
    slot<=MAX_USERS;
    slot++
  ){

    if(
      !connections[slot] ||
      !connections[slot].open
    ){

      try{

        const connection =
          peer.connect(
            peerId(slot),
            {reliable:true}
          );

        registerConnection(
          connection
        );

      }catch(e){}
    }

    if(!calls[slot]){

      try{

        const call =
          peer.call(
            peerId(slot),
            localStream
          );

        if(call){

          registerCall(
            slot,
            call
          );
        }

      }catch(e){}
    }
  }
}


/* 영상 통화 */
function registerCall(
  slot,
  call
){

  if(
    calls[slot] &&
    calls[slot] !== call
  ){

    try{
      calls[slot].close();
    }catch(e){}
  }

  calls[slot] = call;

  call.on("stream",stream=>{

    streams[slot] =
      stream;

    showSlot(
      slot,
      stream,
      false
    );

    if(
      slot === bigSlot
    ){
      setBigScreen(
        slot,
        false
      );
    }
  });

  call.on("close",()=>{
    clearSlot(slot);
  });

  call.on("error",()=>{
    clearSlot(slot);
  });
}


/* 데이터 연결 */
function registerConnection(
  connection
){

  const slot =
    getSlot(
      connection.peer
    );

  if(!slot) return;

  connections[slot] =
    connection;

  connection.on("open",()=>{

    sendOne(
      connection,
      {
        type:"hello",
        slot:mySlot,
        bigSlot:bigSlot
      }
    );
  });

  connection.on("data",data=>{
    handleData(data);
  });

  connection.on("close",()=>{

    if(
      connections[slot] ===
      connection
    ){
      delete connections[slot];
    }
  });

  connection.on(
    "error",
    ()=>{}
  );
}


/* 데이터 받기 */
function handleData(data){

  if(
    !data ||
    typeof data !== "object"
  ){
    return;
  }

  if(data.type === "hello"){

    if(
      data.bigSlot &&
      streams[data.bigSlot]
    ){
      setBigScreen(
        Number(data.bigSlot),
        false
      );
    }
  }

  else if(data.type === "big"){

    setBigScreen(
      Number(data.slot),
      false
    );
  }

  else if(data.type === "chat"){

    addChat(
      data.slot,
      data.text
    );
  }

  else if(data.type === "rose"){

    addSystem(
      "🌹 참가자 " +
      data.slot +
      "님이 장미 " +
      data.count +
      "송이를 보냈습니다."
    );
  }

  else if(data.type === "gift"){

    addSystem(
      "🎁 참가자 " +
      data.slot +
      "님이 " +
      data.name +
      " 선물을 보냈습니다."
    );
  }

  else if(
    data.type === "giftbox"
  ){

    startGiftBox(
      Number(
        data.seconds || 10
      )
    );
  }

  else if(
    data.type === "lottery"
  ){

    addSystem(
      data.text
    );
  }
}


/* 작은 참가자 영상 */
function showSlot(
  slot,
  stream,
  isLocal
){

  const video =
    document.getElementById(
      "video-" + slot
    );

  const empty =
    document.getElementById(
      "empty-" + slot
    );

  if(!video) return;

  video.srcObject =
    stream;

  video.style.display =
    "block";

  video.muted =
    isLocal ||
    slot === bigSlot;

  if(empty){
    empty.style.display =
      "none";
  }
}


/* 큰 화면 */
function setBigScreen(
  slot,
  notify
){

  const stream =
    streams[slot];

  if(!stream) return;

  /* 전에 큰 화면이던 사람의 작은 영상 소리 복원 */
  if(
    bigSlot &&
    bigSlot !== slot
  ){

    const oldVideo =
      document.getElementById(
        "video-" + bigSlot
      );

    if(oldVideo){

      oldVideo.muted =
        bigSlot === mySlot;
    }
  }

  bigSlot = slot;

  stageVideo.srcObject =
    stream;

  /* 내 목소리가 내 폰에서 울리지 않게 */
  stageVideo.muted =
    slot === mySlot;

  /* 큰 화면과 작은 화면 소리 중복 방지 */
  const small =
    document.getElementById(
      "video-" + slot
    );

  if(small){
    small.muted = true;
  }

  stageName.textContent =
    slot === 1
    ? "👑 호스트"
    : "🎤 참가자 " + slot;

  if(notify){

    sendAll({
      type:"big",
      slot:slot
    });

    addSystem(
      "참가자 " +
      slot +
      "님이 큰 화면으로 이동했습니다."
    );
  }
}


/* 자리 정리 */
function clearSlot(slot){

  if(calls[slot]){
    delete calls[slot];
  }

  if(streams[slot]){
    delete streams[slot];
  }

  const video =
    document.getElementById(
      "video-" + slot
    );

  const empty =
    document.getElementById(
      "empty-" + slot
    );

  if(video){

    video.srcObject = null;
    video.style.display =
      "none";
  }

  if(empty){
    empty.style.display =
      "flex";
  }

  if(bigSlot === slot){

    bigSlot = null;

    if(streams[1]){

      setBigScreen(
        1,
        false
      );

    }else{

      stageVideo.srcObject =
        null;

      stageName.textContent =
        "진행자 큰 화면";
    }
  }
}


/* 채팅 */
function sendChat(){

  if(!mySlot){

    alert(
      "먼저 방송 시작을 눌러주세요."
    );

    return;
  }

  const input =
    document.getElementById(
      "chatText"
    );

  const text =
    input.value.trim();

  if(!text) return;

  addChat(
    mySlot,
    text
  );

  sendAll({
    type:"chat",
    slot:mySlot,
    text:text
  });

  input.value = "";
}

document
  .getElementById("chatText")
  .addEventListener(
    "keydown",
    event=>{

      if(event.key === "Enter"){
        sendChat();
      }
    }
  );

function addChat(slot,text){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message";

  div.textContent =
    "참가자 " +
    slot +
    " : " +
    text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}

function addSystem(text){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message system";

  div.textContent =
    text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}


/* 데이터 보내기 */
function sendOne(
  connection,
  data
){

  try{

    if(
      connection &&
      connection.open
    ){
      connection.send(data);
    }

  }catch(e){}
}

function sendAll(data){

  Object.values(
    connections
  ).forEach(connection=>{

    sendOne(
      connection,
      data
    );
  });
}

/* 선물상자 */
function openGiftBox(){

  if(!mySlot){

    alert(
      "먼저 방송방에 입장해 주세요."
    );

    return;
  }

  startGiftBox(10);

  sendAll({
    type:"giftbox",
    seconds:10
  });

  addSystem(
    "🎁 선물상자가 올라왔습니다."
  );
}

function startGiftBox(seconds){

  clearInterval(giftTimer);

  giftSeconds =
    seconds;

  giftReceived =
    false;

  const popup =
    document.getElementById(
      "giftPopup"
    );

  const count =
    document.getElementById(
      "giftCount"
    );

  const button =
    document.getElementById(
      "giftReceive"
    );

  popup.style.display =
    "block";

  button.disabled =
    true;

  button.textContent =
    "기다리는 중";

  count.textContent =
    giftSeconds + "초";

  giftTimer =
    setInterval(()=>{

      giftSeconds--;

      if(giftSeconds > 0){

        count.textContent =
          giftSeconds + "초";

      }else{

        clearInterval(
          giftTimer
        );

        giftSeconds = 0;

        count.textContent =
          "지금 누르세요!";

        button.disabled =
          false;

        button.textContent =
          "선물 받기";

        setTimeout(()=>{

          if(!giftReceived){
            popup.style.display =
              "none";
          }

        },7000);
      }

    },1000);
}

function receiveGift(){

  if(
    giftReceived ||
    giftSeconds > 0
  ){
    return;
  }

  giftReceived = true;

  const reward =
    Math.floor(
      Math.random()*5
    ) + 1;

  document
    .getElementById(
      "giftCount"
    )
    .textContent =
    "🌹 장미 " +
    reward +
    "개";

  document
    .getElementById(
      "giftReceive"
    )
    .disabled = true;

  addSystem(
    "🎉 참가자 " +
    mySlot +
    "님이 선물상자에서 장미 " +
    reward +
    "개를 받았습니다."
  );

  setTimeout(()=>{

    document
      .getElementById(
        "giftPopup"
      )
      .style.display =
      "none";

  },2500);
}

/* 나가기 */
function leaveRoom(){

  Object.values(
    calls
  ).forEach(call=>{

    try{
      call.close();
    }catch(e){}
  });

  Object.values(
    connections
  ).forEach(connection=>{

    try{
      connection.close();
    }catch(e){}
  });

  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{
        track.stop();
      });
  }

  if(peer){

    try{
      peer.destroy();
    }catch(e){}
  }

  location.reload();
}


/* 끊어진 연결 자동 정리 */
const lostSince = {};

setInterval(()=>{

  if(
    !peer ||
    !localStream ||
    !mySlot
  ){
    return;
  }

  Object.keys(
    calls
  ).forEach(key=>{

    const slot =
      Number(key);

    const call =
      calls[slot];

    if(!call) return;

    const pc =
      call.peerConnection;

    if(!pc) return;

    const state =
      pc.connectionState;

    if(state === "connected"){

      delete lostSince[slot];
      return;
    }

    if(
      state === "failed" ||
      state === "closed" ||
      state === "disconnected"
    ){

      if(!lostSince[slot]){
        lostSince[slot] =
          Date.now();
      }

      if(
        Date.now() -
        lostSince[slot] >
        5000
      ){

        try{
          call.close();
        }catch(e){}

        delete calls[slot];
        delete lostSince[slot];

        clearSlot(slot);
      }
    }
  });

  syncRoom();

},2500);


/* 화면을 다시 켰을 때 */
document.addEventListener(
  "visibilitychange",
  ()=>{

    if(!document.hidden){

      setTimeout(
        syncRoom,
        500
      );
    }
  }
);


/* 종료 정리 */
window.addEventListener(
  "beforeunload",
  ()=>{

    try{

      if(peer){
        peer.destroy();
      }

    }catch(e){}
  }
);
</script>
