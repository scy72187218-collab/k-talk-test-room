<!-- ===== 선물 부분만 교체 ===== -->
<div class="giftsPanel"
style="
min-width:0;
min-height:0;
overflow:hidden;
border:1px solid #47234e;
border-radius:6px;
background:#08080b;
padding:5px;
display:grid;
grid-template-rows:auto 1fr;
gap:4px;
">

  <!-- 위: 선물 / 후원 -->
  <div style="font-size:8px;color:#fff;">
    선물 / 후원
  </div>

  <div style="
  min-height:0;
  display:grid;
  grid-template-rows:48% 52%;
  gap:4px;
  ">

    <!-- 장미 / 하트 / 별 / 풍선 / 슈퍼하트 -->
    <div style="
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:3px;
    align-items:center;
    ">

      <button onclick="sendGift('장미',100)"
      style="border:0;background:transparent;color:#fff;text-align:center;padding:0;font-size:6px;">
        <span style="display:block;font-size:23px;line-height:25px;">🌹</span>
        장미
        <strong style="display:block;color:#ffd331;font-size:6px;">🪙100</strong>
      </button>

      <button onclick="sendGift('하트',300)"
      style="border:0;background:transparent;color:#fff;text-align:center;padding:0;font-size:6px;">
        <span style="display:block;font-size:23px;line-height:25px;">❤️</span>
        하트
        <strong style="display:block;color:#ffd331;font-size:6px;">🪙300</strong>
      </button>

      <button onclick="sendGift('별',500)"
      style="border:0;background:transparent;color:#fff;text-align:center;padding:0;font-size:6px;">
        <span style="display:block;font-size:23px;line-height:25px;">⭐</span>
        별
        <strong style="display:block;color:#ffd331;font-size:6px;">🪙500</strong>
      </button>

      <button onclick="sendGift('풍선',1000)"
      style="border:0;background:transparent;color:#fff;text-align:center;padding:0;font-size:6px;">
        <span style="display:block;font-size:23px;line-height:25px;">🎈</span>
        풍선
        <strong style="display:block;color:#ffd331;font-size:6px;">🪙1,000</strong>
      </button>

      <button onclick="sendGift('슈퍼하트',10000)"
      style="border:0;background:transparent;color:#fff;text-align:center;padding:0;font-size:5.8px;">
        <span style="display:block;font-size:23px;line-height:25px;">❤️‍🔥</span>
        슈퍼 하트
        <strong style="display:block;color:#ffd331;font-size:6px;">🪙10,000</strong>
      </button>

    </div>

    <!-- 아래: 장미 3개 + 선물상자 -->
    <div style="
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1fr) 31%;
    gap:4px;
    ">

      <!-- 장미 선물 -->
      <div style="
      min-width:0;
      border:1px solid #552456;
      border-radius:5px;
      padding:4px;
      overflow:hidden;
      ">

        <div style="
        color:#ffd331;
        font-size:7px;
        font-weight:900;
        margin-bottom:3px;
        ">
          장미 선물
        </div>

        <div style="
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:3px;
        ">

          <button onclick="sendRose(1)"
          style="
          min-width:0;
          border:0;
          background:transparent;
          color:#fff;
          text-align:center;
          padding:0;
          font-size:6px;
          white-space:nowrap;
          ">
            <span style="display:block;font-size:23px;line-height:25px;">🌹</span>
            장미 1송이
            <strong style="display:block;color:#ffd331;font-size:6px;">🪙10</strong>
          </button>

          <button onclick="sendRose(5)"
          style="
          min-width:0;
          border:0;
          background:transparent;
          color:#fff;
          text-align:center;
          padding:0;
          font-size:6px;
          white-space:nowrap;
          ">
            <span style="display:block;font-size:23px;line-height:25px;">💐</span>
            장미 5송이
            <strong style="display:block;color:#ffd331;font-size:6px;">🪙50</strong>
          </button>

          <button onclick="sendRose(10)"
          style="
          min-width:0;
          border:0;
          background:transparent;
          color:#fff;
          text-align:center;
          padding:0;
          font-size:6px;
          white-space:nowrap;
          ">
            <span style="display:block;font-size:23px;line-height:25px;">💐</span>
            장미 10송이
            <strong style="display:block;color:#ffd331;font-size:6px;">🪙100</strong>
          </button>

        </div>

      </div>

      <!-- 선물 상자 -->
      <button onclick="openGiftBox()"
      style="
      min-width:0;
      border:1px solid #a73cff;
      border-radius:6px;
      background:radial-gradient(circle,#451451,#16081b);
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:3px;
      ">
        <span style="font-size:35px;line-height:38px;">🎁</span>

        <strong style="font-size:8px;">
          선물 상자
        </strong>

        <span style="
        font-size:5.5px;
        line-height:1.25;
        margin-top:3px;
        ">
          다른 선물을<br>
          선택할 수 있어요!
        </span>
      </button>

    </div>

  </div>

</div>
<!-- ===== 선물 부분 끝 ===== -->
