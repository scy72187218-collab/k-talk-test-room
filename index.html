<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk 방송방</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#06050a;
  color:white;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
button,input{font-family:inherit}
button{cursor:pointer}

:root{
  --purple:#b521ff;
  --pink:#ff228c;
  --gold:#ffd43b;
  --panel:#100b16;
  --line:#542365;
}

.wrap{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:5px;
}

/* 상단 */
.header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  height:48px;
}

.onair{
  font-weight:900;
  font-size:11px;
}

.onair span{
  background:#f11e51;
  border-radius:7px;
  padding:5px 7px;
}

.logo{
  text-align:center;
  color:var(--gold);
  font-size:22px;
  font-weight:900;
}

.logo small{
  display:block;
  color:#fff;
  font-size:8px;
}

.viewer{
  text-align:right;
  font-size:11px;
}

/* 방 선택 */
.roomSelect{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:5px;
}

.roomBtn{
  border:1px solid #663178;
  border-radius:11px;
  padding:9px 5px;
  font-weight:900;
  font-size:13px;
  color:white;
}

.publicRoom{
  background:linear-gradient(135deg,#ffbd25,#ff6e00);
  color:#171000;
}

.secretRoom{
  background:linear-gradient(135deg,#8528ff,#e225ff);
}

.roomBtn.active{
  box-shadow:0 0 14px rgba(255,64,220,.75);
  border:2px solid white;
}

.notice{
  border:1px solid #5b286c;
  border-radius:8px;
  padding:6px;
  text-align:center;
  font-size:9px;
  font-weight:900;
  margin-bottom:5px;
}

.notice b{color:#ffd73d}

/* 입장 */
.enterArea{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-bottom:5px;
}

.enterBtn{
  border:0;
  border-radius:14px;
  min-height:43px;
  font-size:13px;
  font-weight:900;
}

.hostEnter{
  background:linear-gradient(135deg,#ffe45d,#ff9c00);
  color:#1d1300;
  box-shadow:0 0 12px rgba(255,193,35,.35);
}

.guestEnter{
  background:linear-gradient(135deg,#9d33ff,#f227bb);
  color:white;
  box-shadow:0 0 12px rgba(190,40,255,.38);
}

/* 비밀방 번호 */
.secretCode{
  display:none;
  margin-bottom:5px;
}

.secretCode input{
  width:100%;
  border:1px solid #8834a4;
  border-radius:9px;
  padding:8px;
  background:#18101f;
  color:#fff;
  text-align:center;
}

/* 메인 */
.stage{
  display:grid;
  grid-template-columns:49% 51%;
  gap:4px;
}

/* 호스트 */
.host{
  height:260px;
  position:relative;
  border:1px solid #6f2d83;
  border-radius:9px;
  overflow:hidden;
  background:#0d0911;
}

.host video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hostLive{
  position:absolute;
  left:7px;
  top:7px;
  color:#ff355d;
  font-size:9px;
  font-weight:900;
}

/* 작은 하트 날개 출석체크 */
.attendance{
  position:absolute;
  top:8px;
  right:8px;
  display:flex;
  align-items:center;
  gap:2px;
  padding:3px 6px;
  border-radius:18px;
  background:rgba(56,4,65,.78);
  border:1px solid #ff45d7;
  box-shadow:0 0 8px rgba(255,48,215,.55);
  font-size:8px;
  color:#ffe44f;
  font-weight:900;
}

.wing{
  color:#fff;
  font-size:10px;
}

.heart{
  color:#ff4abf;
  font-size:12px;
}

.hostName{
  position:absolute;
  bottom:7px;
  left:7px;
  background:rgba(0,0,0,.72);
  padding:5px 7px;
  border-radius:7px;
  color:#ffd83f;
  font-size:10px;
  font-weight:900;
}

/* 게스트 */
.guestGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.slot{
  height:49px;
  position:relative;
  overflow:hidden;
  border:1px solid #39303f;
  border-radius:5px;
  background:#131018;
}

.slot video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slotNo{
  position:absolute;
  top:2px;
  left:2px;
  min-width:15px;
  height:15px;
  border-radius:4px;
  background:#737373;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:900;
}

.slot:nth-child(1) .slotNo{background:#ffd333;color:#111}
.slot:nth-child(2) .slotNo{background:#ff3d84}
.slot:nth-child(3) .slotNo{background:#e87a19}
.slot:nth-child(4) .slotNo{background:#1ca8d0}
.slot:nth-child(5) .slotNo{background:#7030e5}

.slotName{
  position:absolute;
  left:2px;
  right:2px;
  bottom:1px;
  font-size:6.5px;
  font-weight:900;
  padding:7px 1px 1px;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
}

.slotRose{
  position:absolute;
  right:2px;
  bottom:1px;
  font-size:9px;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#625b69;
  font-size:7px;
}

/* 아래 */
.lower{
  display:grid;
  grid-template-columns:49% 51%;
  gap:4px;
  margin-top:4px;
}

.panel{
  border:1px solid #5d276e;
  background:#0d0912;
  border-radius:8px;
  overflow:hidden;
}

.title{
  padding:6px;
  border-bottom:1px solid #452052;
  font-size:9px;
  font-weight:900;
}

/* 채팅 더 크게 */
.messages{
  height:120px;
  overflow-y:auto;
  padding:6px;
  font-size:9px;
  line-height:1.55;
}

.messages b{
  color:#46dcff;
}

.chatInput{
  display:grid;
  grid-template-columns:1fr auto;
  gap:4px;
  padding:5px;
}

.chatInput input{
  min-width:0;
  border:1px solid #3c3043;
  background:#1a1420;
  color:#fff;
  border-radius:7px;
  padding:7px;
  font-size:9px;
}

.chatInput button{
  border:0;
  border-radius:7px;
  background:#8f31df;
  color:#fff;
  padding:0 10px;
  font-weight:900;
}

/* 선물 */
.gifts{
  padding:5px;
}

.giftRow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
}

.gift{
  border:1px solid #4b2b55;
  border-radius:7px;
  background:#17101d;
  color:white;
  padding:5px 1px;
  font-size:7px;
}

.gift span{
  display:block;
  font-size:20px;
  filter:drop-shadow(0 0 5px rgba(255,100,180,.7));
}

.gift strong{
  display:block;
  color:#ffd83c;
  font-size:7px;
  margin-top:2px;
}

.giftBottom{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:4px;
  margin-top:4px;
}

.roseArea{
  border:1px solid #73315c;
  border-radius:7px;
  padding:4px;
}

.roseTitle{
  color:#ffd83c;
  font-size:8px;
  font-weight:900;
}

.roseButtons{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
  margin-top:3px;
}

.roseButtons button{
  border:0;
  border-radius:5px;
  background:#19101d;
  color:white;
  padding:4px 0;
  font-size:6px;
}

.roseButtons span{
  display:block;
  font-size:15px;
}

.giftBox{
  border:1px solid #9e42ff;
  border-radius:8px;
  background:linear-gradient(145deg,#4a1663,#160a20);
  color:white;
  font-size:7px;
  font-weight:900;
}

.giftBox span{
  display:block;
  font-size:29px;
}

/* 제비 */
.lottery{
  margin-top:4px;
  border:1px solid #9d39ff;
  border-radius:8px;
  background:linear-gradient(90deg,#290c37,#100815);
  padding:5px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.lottery b{
  color:#ffb9ff;
  font-size:10px;
}

.lottery small{
  display:block;
  margin-top:3px;
  font-size:6px;
}

.machine{
  font-size:27px;
}

/* 기능 */
.controls{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  margin-top:4px;
  margin-bottom:58px;
}

.controls button{
  border:1px solid #392940;
  border-radius:7px;
  background:#100b14;
  color:white;
  padding:6px 1px;
  font-size:7px;
}

.controls span{
  display:block;
  font-size:15px;
}

/* 하단 */
.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:55px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  background:#131019;
  border-top:1px solid #302637;
  z-index:100;
}

.nav{
  text-align:center;
  font-size:8px;
}

.nav span{
  display:block;
  font-size:18px;
}

.charge{
  margin:4px 7px;
  padding:6px 2px;
  background:#f9005c;
  border-radius:25px;
  font-weight:900;
}

/* 휴대폰 */
@media(max-width:700px){

  .host{
    height:260px;
  }

  .guestGrid{
    grid-auto-rows:49px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">

    <div class="onair">
      <span>● ON AIR</span>
      <label id="clock">00:00:00</label>
    </div>

    <div class="logo">
      👑 K-Talk
      <small>화상 방송 · 일반방 / 비밀방</small>
    </div>

    <div class="viewer">
      👤 <b id="viewerCount">0</b>

  </div>

  <!-- 1번 일반방 / 2번 비밀방 -->

    <button

    <button
      id="secretBtn"

      onclick="selectRoom('secret')">

    </button>

  </div>

  <div class="secretCode" id="secretCode">
    <input

      value="7777"

  </div>

  <div class="notice">
    <b>💗 출석체크</b>
    · 즐거운 방송 부탁드립니다 ·
    🌹 장미 1개 50원
  </div>

  <!-- 흰색 이름 팝업 없음 -->
  <div class="enterArea" id="enterArea">

    <button
      class="enterBtn hostEnter"

    <div class="host">

      <video
        id="hostVideo"
        autoplay
        playsinline>
      </video>

      <div class="hostLive">
        ● ON AIR
      </div>

      <div class="attendance">
        <span class="wing">ʚ</span>
        <span class="heart">💗</span>
        출석체크
        <span class="heart">💗</span>
        <span class="wing">ɞ</span>
      </div>

      <div class="hostName" id="hostName">
        👑 호스트
      </div>

    </div>

    <div
      class="guestGrid"
      id="guestGrid">
    </div>

  </div>

  <div class="lower">

    <!-- 채팅 -->
    <div class="panel">

      <div class="title">
        💬 실시간 채팅
      </div>

      <div
        class="messages"
        id="messages">

        <div>
          <b>K-Talk</b>
          방송방에 오신 것을 환영합니다.
        </div>

      </div>

      <div class="chatInput">

        <input
          id="chatText"
          placeholder="메시지 입력">

        <button onclick="sendChat()">
          전송

      </div>

    </div>

    <!-- 선물 -->
    <div>

      <div class="panel gifts">

        <div class="title">
          🎁 선물 / 후원
        </div>

        <div class="giftRow">

          <button
            class="gift"
            onclick="sendGift('장미',50)">
            <span>🌹</span>
            장미
            <strong>50</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('하트',100)">
            <span>💖</span>

          <button
            class="gift"
            onclick="sendGift('별',200)">
            <span>⭐</span>
            별
            <strong>200</strong>
          </button>

          <button
            class="gift"
            onclick="sendGift('자동차',500)">
            <span>🚗</span>
            자동차

          </button>

          <button
            class="gift"
            onclick="sendGift('고래',1000)">
            <span>🐋</span>
            고래
            <strong>1000</strong>
          </button>

        </div>

        <div class="giftBottom">

          <div class="roseArea">

            <div class="roseTitle">
              🌹 장미 선물
            </div>

            <div class="roseButtons">

              <button onclick="sendRose(1)">
                <span>🌹</span>1
              </button>

              <button onclick="sendRose(5)">
                <span>🌹</span>5

              <button onclick="sendRose(10)">
                <span>🌹</span>10
              </button>

              <button onclick="sendRose(50)">
                <span>💐</span>50
              </button>

      <div

        onclick="drawLottery()">

        <div>

            아침 · 점심 · 저녁 하루 3회

    </div>

      <span>📷</span>
      카메라
    </button>

    <button onclick="switchCamera()">
      <span>🔄</span>
      전환
    </button>

    <button onclick="shareRoom()">
      <span>🔗</span>
      공유
    </button>

    <button onclick="leaveRoom()">
      <span>🚪</span>
      나가기
    </button>

  </div>

</div>

<div class="bottomNav">

  <div class="nav">
    <span>🏠</span>
    홈
  </div>

  <div class="nav">
    <span>👤</span>
    마이페이지
  </div>

    <span>🪙</span>
    충전

    <span>🔔</span>
    알림
  </div>

  <div class="nav">
    <span>⚙️</span>
    설정
  </div>

</div>

<script type="module">

import {
  joinRoom,
  selfId
} from 'https://esm.run/trystero'

let room=null
let stream=null

let selectedRoom='public'
let myRole=''
let myName=''
let facingMode='user'

const peers={}
const peerStreams={}

const grid=
document.getElementById('guestGrid')

/* 13개 자리 */
for(let i=1;i<=13;i++){

  const box=
  document.createElement('div')

  box.className='slot'

  box.innerHTML=`
    <video id="video${i}" autoplay playsinline></video>

    <div
      class="empty"
      id="empty${i}">
      빈자리
    </div>

    <div class="slotNo">
      ${i}
    </div>

    <div
      class="slotName"
      id="name${i}">
      빈자리
    </div>

    <div class="slotRose">
      🌹
    </div>
  `

  grid.appendChild(box)
}

/* 일반방 / 비밀방 */
window.selectRoom=
function(type){

  selectedRoom=type

  document
  .getElementById('publicBtn')
  .classList
  .toggle(
    'active',
    type==='public'
  )

  document
  .getElementById('secretBtn')
  .classList
  .toggle(
    'active',
    type==='secret'
  )

  document
  .getElementById('secretCode')
  .style.display=
  type==='secret'
  ?'block'
  :'none'

}

/* 팝업 없이 자동 이름 */
window.enterRoom=
async function(role){

  if(room)return

  myRole=role

  myName=
  role==='host'
  ?'호스트'
  :'참가자'

  let roomName='ktalk-public-main'

  if(selectedRoom==='secret'){

    const code=
    document
    .getElementById('secretInput')
    .value
    .trim()
    ||
    '7777'

    roomName=
    'ktalk-secret-'+code
  }

  try{

    stream=
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:facingMode
      },

      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }

    })

  }catch(error){

    alert(
      '카메라와 마이크 사용을 허용해 주세요.'
    )

    return
  }

  room=
  joinRoom(
    {
      appId:'ktalk-main-2026'
    },
    roomName
  )

  const profile=
  room.makeAction('profile')

  const chat=
  room.makeAction('chat')

  const gift=
  room.makeAction('gift')

  window.chatAction=chat
  window.giftAction=gift

  peers[selfId]={
    name:myName,
    role:myRole
  }

  peerStreams[selfId]=stream

  profile.onMessage=
  (data,{peerId})=>{

    peers[peerId]=data
    render()
  }

  chat.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  gift.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  room.onPeerJoin=
  peerId=>{

    profile.send(
      {
        name:myName,
        role:myRole
      },
      {
        target:peerId
      }
    )

    room.addStream(
      stream,
      {
        target:peerId
      }
    )
  }

  room.onPeerLeave=
  peerId=>{

    delete peers[peerId]
    delete peerStreams[peerId]

    render()
  }

  room.onPeerStream=
  (incoming,peerId)=>{

    peerStreams[peerId]=incoming

    render()
  }

  room.addStream(stream)

  profile.send({
    name:myName,
    role:myRole
  })

  document
  .getElementById('enterArea')
  .style.display='none'

  render()
}

/* 화면 */
function render(){

  const ids=
  Object.keys(peers)

  document
  .getElementById('viewerCount')
  .textContent=
  ids.length

  const hostId=
  ids.find(
    id=>
    peers[id]?.role==='host'
  )

  const hostVideo=
  document.getElementById(
    'hostVideo'
  )

  if(
    hostId &&
    peerStreams[hostId]
  ){

    hostVideo.srcObject=
    peerStreams[hostId]

    hostVideo.muted=
    hostId===selfId

    document
    .getElementById('hostName')
    .textContent=
    '👑 '+
    (
      peers[hostId]?.name
      ||
      '호스트'
    )
  }

  const guests=
  ids.filter(
    id=>id!==hostId
  )

  /* 비밀방은 6명까지만 표시 */
  const maxGuests=
  selectedRoom==='secret'
  ?6
  :13

  for(let i=1;i<=13;i++){

    const video=
    document.getElementById(
      'video'+i
    )

    const empty=
    document.getElementById(
      'empty'+i
    )

    const name=
    document.getElementById(
      'name'+i
    )

    const slot=
    video.closest('.slot')

    if(i>maxGuests){

      slot.style.display='none'
      continue

    }else{

      slot.style.display='block'
    }

    const peerId=
    guests[i-1]

    if(peerId){

      empty.style.display='none'

      name.textContent=
      peers[peerId]?.name
      ||
      '참가자 '+i

      if(peerStreams[peerId]){

        video.srcObject=
        peerStreams[peerId]

        video.muted=
        peerId===selfId
      }

    }else{

      video.srcObject=null

      empty.style.display='flex'

      name.textContent='빈자리'
    }
  }
}

/* 채팅 */
function safe(text){

  return String(text)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
}

function addMessage(
  name,
  text
){

  const line=
  document.createElement('div')

  line.innerHTML=
  '<b>'+
  safe(name)+
  '</b> '+
  safe(text)

  const box=
  document.getElementById(
    'messages'
  )

  box.appendChild(line)

  box.scrollTop=
  box.scrollHeight
}

window.sendChat=
function(){

  if(!window.chatAction)return

  const input=
  document.getElementById(
    'chatText'
  )

  const text=
  input.value.trim()

  if(!text)return

  addMessage(
    myName,
    text
  )

  window.chatAction.send({
    name:myName,
    text:text
  })

  input.value=''
}

/* 카메라 전환 */
window.switchCamera=
async function(){

  if(!stream)return

  try{

    facingMode=
    facingMode==='user'
    ?'environment'
    :'user'

    const next=
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:facingMode
      },

      audio:false
    })

    const oldTrack=
    stream.getVideoTracks()[0]

    const newTrack=
    next.getVideoTracks()[0]

    if(
      room &&
      room.replaceTrack
    ){

      await room.replaceTrack(
        oldTrack,
        newTrack
      )
    }

    oldTrack.stop()

    stream.removeTrack(
      oldTrack
    )

    stream.addTrack(
      newTrack
    )

    peerStreams[selfId]=
    stream

    render()

  }catch(error){

    alert(
      '카메라 전환을 할 수 없습니다.'
    )
  }
}

/* 공유 */
window.shareRoom=
async function(){

  try{

    if(navigator.share){

      await navigator.share({
        title:'K-Talk',
        url:location.href
      })

    }else{

      await navigator
      .clipboard
      .writeText(
        location.href
      )

      alert(
        '주소를 복사했습니다.'
      )
    }

  }catch(error){}
}

/* 나가기 */
window.leaveRoom=
function(){

  if(stream){

    stream
    .getTracks()
    .forEach(
      track=>track.stop()
    )
  }

  if(room){
    room.leave()
  }

  location.reload()
}
