<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>K-Talk 화상 방송방</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#05050a;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* 상단 */
.header{
  height:58px;
  display:flex;
  align-items:center;
  padding:8px 10px;
  background:#090a0f;
  border-bottom:1px solid #392143;
  gap:8px;
}

.logo{
  font-size:23px;
  font-weight:900;
  color:#ffd84d;
  white-space:nowrap;
}

.live{
  background:#ed1745;
  border-radius:9px;
  padding:6px 9px;
  font-size:12px;
  font-weight:bold;
}

.roomText{
  font-size:12px;
  color:#ccc;
  flex:1;
  text-align:center;
}

.startButton{
  border:0;
  border-radius:9px;
  background:#922ff1;
  color:#fff;
  font-weight:800;
  padding:9px 11px;
}

/* 공지 */
.notice{
  margin:7px;
  padding:8px;
  text-align:center;
  border:1px solid #522566;
  border-radius:9px;
  color:#ffd963;
  font-size:12px;
  background:#0e0912;
}

/* 메인 방송 */
.broadcast{
  display:grid;
  grid-template-columns:46% 54%;
  gap:5px;
  padding:0 6px;
}

/* 큰 진행자 화면 */
.mainStage{
  position:relative;
  height:430px;
  background:#13111a;
  border:1px solid #5d2a70;
  border-radius:10px;
  overflow:hidden;
}

.mainStage video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.stageOverlay{
  position:absolute;
  left:7px;
  right:7px;
  bottom:7px;
  background:rgba(0,0,0,.64);
  border-radius:7px;
  padding:6px 7px;
}

.stageName{
  font-weight:900;
  font-size:13px;
  color:#ffd64f;
}

.stageHelp{
  font-size:10px;
  color:#ddd;
  margin-top:2px;
}

/* 참가자 13자리 */
.members{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  align-content:start;
}

.member{
  height:82px;
  background:#17131d;
  border:1px solid #573063;
  border-radius:8px;
  overflow:hidden;
  position:relative;
}

.member video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#121017;
  display:none;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#82758b;
  font-size:10px;
}

.num{
  position:absolute;
  top:3px;
  left:3px;
  background:rgba(0,0,0,.72);
  width:18px;
  height:18px;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
}

.memberName{
  position:absolute;
  left:3px;
  bottom:3px;
  max-width:75%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  background:rgba(0,0,0,.72);
  border-radius:4px;
  padding:2px 3px;
  font-size:8px;
}

.roseMini{
  position:absolute;
  right:3px;
  bottom:3px;
  font-size:15px;
}

/* 채팅 + 선물 */
.lower{
  display:grid;
  grid-template-columns:48% 52%;
  gap:6px;
  padding:7px 6px 85px 6px;
}

/* 채팅 */
.chat{
  min-height:250px;
  border:1px solid #50265d;
  border-radius:10px;
  overflow:hidden;
  background:#0d0911;
}

.chatTitle{
  padding:8px;
  font-size:13px;
  font-weight:900;
  border-bottom:1px solid #41214a;
  color:#f4d7ff;
}

.messages{
  height:185px;
  padding:8px;
  overflow-y:auto;
  font-size:11px;
  line-height:1.5;
}

.message{
  margin-bottom:5px;
}

.system{
  color:#ffd85d;
}

.chatInput{
  display:flex;
  border-top:1px solid #41214a;
}

.chatInput input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  background:#17111d;
  color:#fff;
  padding:10px 7px;
  font-size:11px;
}

.send{
  width:50px;
  border:0;
  background:#7d31d5;
  color:#fff;
  font-size:11px;
  font-weight:bold;
}

/* 선물 */
.giftArea{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.panel{
  border:1px solid #50265d;
  border-radius:10px;
  background:#0d0911;
  overflow:hidden;
}

.panelTitle{
  padding:7px 8px;
  border-bottom:1px solid #3f2048;
  font-size:12px;
  font-weight:900;
  color:#f6ddff;
}

.giftButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:6px;
}

.gift{
  border:0;
  border-radius:8px;
  background:#1b1422;
  color:white;
  padding:6px 2px;
  font-size:10px;
}

.gift .emoji{
  font-size:25px;
  display:block;
  margin-bottom:2px;
}

.specialButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  padding:6px;
}

.special{
  border:1px solid #7e34a3;
  border-radius:8px;
  background:#211029;
  color:white;
  padding:11px 4px;
  font-size:11px;
  font-weight:bold;
}

/* 상태 */
.statusBox{
  margin:0 6px 6px;
  border:1px solid #482555;
  border-radius:9px;
  padding:7px 9px;
  color:#ffd967;
  font-size:11px;
  background:#100b14;
}

/* 하단 고정 버튼 */
.controls{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  padding:6px;
  background:rgba(8,8,13,.97);
  border-top:1px solid #44224d;
}

.control{
  border:0;
  border-radius:10px;
  background:#201728;
  color:#fff;
  min-height:55px;
  font-size:10px;
}

.control span{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.control.end{
  background:#d92348;
}

/* 선물상자 팝업 */
.giftPopup{
  position:fixed;
  width:180px;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  z-index:500;
  padding:15px 10px;
  text-align:center;
  background:#24102d;
  border:2px solid #bf4bff;
  border-radius:15px;
  box-shadow:0 0 35px #7b21a8;
  display:none;
}

.giftPopupIcon{
  font-size:55px;
}

.giftPopup button{
  margin-top:9px;
  border:0;
  border-radius:8px;
  background:#ffd33d;
  padding:8px 15px;
  font-weight:900;
}

/* 휴대폰 */
@media(max-width:760px){

  .header{
    height:54px;
  }

  .logo{
    font-size:20px;
  }

  .roomText{
    font-size:10px;
  }

  .startButton{
    padding:8px 9px;
    font-size:12px;
  }

  .mainStage{
    height:410px;
  }

  .member{
    height:78px;
  }

  .lower{
    grid-template-columns:48% 52%;
  }

  .chat{
    min-height:235px;
  }

  .messages{
    height:170px;
  }
}

/* 아주 작은 휴대폰 */
@media(max-width:380px){

  .broadcast{
    grid-template-columns:45% 55%;
  }

  .mainStage{
    height:390px;
  }

  .member{
    height:74px;
  }

  .lower{
    grid-template-columns:47% 53%;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">♛ K-Talk</div>
  <div class="live">● ON AIR</div>
  <div class="roomText">화상 방송방 · 최대 13명</div>
  <button id="startBtn" class="startButton">방송 시작</button>
</header>

<div class="notice">
  ⭐ 출석체크 · 신청곡 · 선물 · 실시간 채팅 ⭐
</div>

<section class="broadcast">

  <div class="mainStage">
    <video id="stageVideo" autoplay playsinline></video>

    <div class="stageOverlay">
      <div id="stageName" class="stageName">진행자 큰 화면</div>
      <div class="stageHelp">
        호스트가 참가자를 누르면 이곳으로 올릴 수 있습니다.
      </div>
    </div>
  </div>

  <div id="members" class="members"></div>

</section>

<div id="statusBox" class="statusBox">
  방송 시작을 눌러주세요.
</div>

<section class="lower">

  <div class="chat">
    <div class="chatTitle">💬 채팅</div>

    <div id="messages" class="messages">
      <div class="message system">
        관리자 : K-Talk 방송방입니다.
      </div>
    </div>

    <div class="chatInput">
      <input id="chatText" type="text" maxlength="100"
             placeholder="메시지를 입력하세요">
      <button class="send" onclick="sendChat()">전송</button>
    </div>
  </div>

  <div class="giftArea">

    <div class="panel">
      <div class="panelTitle">🎁 선물 / 후원</div>

      <div class="giftButtons">

        <button class="gift" onclick="sendRose(1)">
          <span class="emoji">🌹</span>
          장미 1
        </button>

        <button class="gift" onclick="sendRose(10)">
          <span class="emoji">💐</span>
          장미 10
        </button>

        <button class="gift" onclick="sendRose(50)">
          <span class="emoji">🌹</span>
          장미 50
        </button>

        <button class="gift" onclick="sendNormalGift('❤️ 하트')">
          <span class="emoji">❤️</span>
          하트
        </button>

        <button class="gift" onclick="sendNormalGift('⭐ 별')">
          <span class="emoji">⭐</span>
          별
        </button>

        <button class="gift" onclick="sendNormalGift('🐋 고래')">
          <span class="emoji">🐋</span>
          고래
        </button>

      </div>
    </div>

    <div class="panel">

      <div class="panelTitle">🎉 이벤트</div>

      <div class="specialButtons">
        <button class="special" onclick="openGiftBox()">
          🎁 선물상자
        </button>

        <button class="special" onclick="lottery()">
          🎯 제비뽑기
        </button>
      </div>

    </div>

  </div>

</section>

<div class="controls">

  <button id="micBtn" class="control" onclick="toggleMic()">
    <span>🎤</span>
    마이크
  </button>

  <button id="camBtn" class="control" onclick="toggleCam()">
    <span>📷</span>
    카메라
  </button>

  <button class="control" onclick="copyInvite()">
    <span>🔗</span>
    초대
  </button>

  <button class="control" onclick="promoteMyself()">
    <span>🎙️</span>
    큰 화면
  </button>

  <button class="control end" onclick="leaveRoom()">
    <span>☎️</span>
    나가기
  </button>

</div>

<div id="giftPopup" class="giftPopup">
  <div class="giftPopupIcon">🎁</div>
  <b>선물상자</b>
  <div id="giftCount" style="margin-top:6px;color:#ffd95a">
    10초
  </div>
  <button id="giftReceive" onclick="receiveGift()" disabled>
    기다리는 중
  </button>
</div>

<script>
const MAX_USERS = 13;

const query = new URLSearchParams(location.search);

const ROOM =
  (query.get("room") || "main")
  .replace(/[^a-zA-Z0-9_-]/g,"")
  .substring(0,30);

const PEER_PREFIX = "ktalk-" + ROOM + "-";

let peer = null;
let localStream = null;
let mySlot = null;

let calls = {};
let connections = {};
let remoteStreams = {};

let bigSlot = 1;

let micEnabled = true;
let cameraEnabled = true;

let giftTimer = null;
let giftSeconds = 0;
let giftReceived = false;

const members =
  document.getElementById("members");

const stageVideo =
  document.getElementById("stageVideo");

const stageName =
  document.getElementById("stageName");

const statusBox =
  document.getElementById("statusBox");

const messages =
  document.getElementById("messages");

const startBtn =
  document.getElementById("startBtn");


/* =========================
   13자리 만들기
========================= */

function makeMemberSlots(){

  members.innerHTML = "";

  for(let i=1;i<=MAX_USERS;i++){

    const box =
      document.createElement("div");

    box.className = "member";
    box.id = "member-"+i;

    box.innerHTML = `
      <div id="empty-${i}" class="empty">
        대기
      </div>

      <video
        id="video-${i}"
        autoplay
        playsinline>
      </video>

      <div class="num">${i}</div>

      <div id="memberName-${i}"
           class="memberName">
        참가자 ${i}
      </div>

      <div class="roseMini">🌹</div>
    `;

    box.onclick = function(){

      /*
       1번 참가자가 호스트
       호스트만 다른 참가자를
       큰 화면으로 올림
      */

      if(mySlot === 1){

        if(remoteStreams[i] || i === mySlot){

          setBigScreen(i,true);

        }

      }

    };

    members.appendChild(box);
  }
}

makeMemberSlots();


/* =========================
   Peer ID
========================= */

function getPeerId(slot){

  return PEER_PREFIX + slot;

}

function getSlotFromPeerId(id){

  if(!id ||
     !id.startsWith(PEER_PREFIX)){
    return null;
  }

  const n =
    Number(
      id.substring(
        PEER_PREFIX.length
      )
    );

  if(
    Number.isInteger(n) &&
    n >= 1 &&
    n <= MAX_USERS
  ){
    return n;
  }

  return null;
}


/* =========================
   방송 시작
========================= */

startBtn.onclick = startBroadcast;

async function startBroadcast(){

  if(localStream){
    return;
  }

  try{

    statusBox.textContent =
      "카메라와 마이크 연결 중...";

    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }

      });

    await findEmptySlot(1);

  }
  catch(error){

    console.error(error);

    statusBox.textContent =
      "카메라 또는 마이크 사용을 허용해 주세요.";

    alert(
      "카메라와 마이크 권한을 허용해 주세요."
    );

  }
}


/* =========================
   빈 자리 자동 찾기
========================= */

function findEmptySlot(slot){

  return new Promise(
    (resolve,reject)=>{

      if(slot > MAX_USERS){

        alert(
          "현재 방송방이 가득 찼습니다."
        );

        reject();

        return;
      }

      const candidate =
        new Peer(
          getPeerId(slot),
          {debug:0}
        );

      let settled = false;

      candidate.on(
        "open",
        ()=>{

          if(settled){
            return;
          }

          settled = true;

          peer = candidate;
          mySlot = slot;

          remoteStreams[mySlot] =
            localStream;

          showStreamInSlot(
            mySlot,
            localStream,
            true
          );

          setupPeer();

          if(mySlot === 1){

            document
            .getElementById(
              "memberName-1"
            )
            .textContent =
              "👑 호스트";

            bigSlot = 1;

            setBigScreen(
              1,
              false
            );

          }

          else{

            document
            .getElementById(
              "memberName-"+mySlot
            )
            .textContent =
              "나";

          }

          startBtn.style.display =
            "none";

          statusBox.textContent =
            mySlot === 1
            ? "호스트로 입장했습니다."
            : mySlot +
              "번 참가자로 입장했습니다.";

          addSystemMessage(
            "참가자 " +
            mySlot +
            "님이 입장했습니다."
          );

          setTimeout(
            connectToRoom,
            600
          );

          resolve();

        }
      );


      candidate.on(
        "error",
        error=>{

          if(
            error.type ===
            "unavailable-id"
          ){

            if(settled){
              return;
            }

            settled = true;

            try{
              candidate.destroy();
            }
            catch(e){}

            setTimeout(
              ()=>{
                findEmptySlot(
                  slot+1
                )
                .then(resolve)
                .catch(reject);
              },
              100
            );

            return;

          }

          if(
            error.type !==
            "peer-unavailable"
          ){

            console.log(
              error
            );

          }

        }
      );

    }
  );
}


/* =========================
   Peer 이벤트
========================= */

function setupPeer(){

  peer.on(
    "call",
    call=>{

      const slot =
        getSlotFromPeerId(
          call.peer
        );

      if(!slot){
        return;
      }

      call.answer(
        localStream
      );

      registerCall(
        slot,
        call
      );

    }
  );


  peer.on(
    "connection",
    connection=>{

      registerConnection(
        connection
      );

    }
  );


  peer.on(
    "disconnected",
    ()=>{

      statusBox.textContent =
        "연결을 다시 시도하고 있습니다.";

      try{
        peer.reconnect();
      }
      catch(e){}

    }
  );


  peer.on(
    "open",
    ()=>{

      setTimeout(
        connectToRoom,
        500
      );

    }
  );


  peer.on(
    "error",
    error=>{

      if(
        error.type !==
        "peer-unavailable"
      ){

        console.log(
          "Peer 오류",
          error
        );

      }

    }
  );

}


/* =========================
   다른 참가자 찾기
========================= */

function connectToRoom(){

  if(
    !peer ||
    !localStream ||
    !mySlot
  ){
    return;
  }

  /*
   번호가 작은 쪽에서
   큰 번호 참가자에게 연결.
   중복 통화 방지.
  */

  for(
    let slot = mySlot + 1;
    slot <= MAX_USERS;
    slot++
  ){

    if(
      !connections[slot] ||
      !connections[slot].open
    ){

      try{

        const connection =
          peer.connect(
            getPeerId(slot),
            {
              reliable:true
            }
          );

        registerConnection(
          connection
        );

      }
      catch(e){}

    }


    if(!calls[slot]){

      try{

        const call =
          peer.call(
            getPeerId(slot),
            localStream
          );

        if(call){

          registerCall(
            slot,
            call
          );

        }

      }
      catch(e){}

    }

  }

}


/* =========================
   영상 통화 관리
========================= */

function registerCall(
  slot,
  call
){

  if(
    calls[slot] &&
    calls[slot] !== call
  ){

    try{
      calls[slot].close();
    }
    catch(e){}

  }

  calls[slot] = call;


  call.on(
    "stream",
    stream=>{

      remoteStreams[slot] =
        stream;

      showStreamInSlot(
        slot,
        stream,
        false
      );

      if(
        slot === bigSlot
      ){

        setBigScreen(
          slot,
          false
        );

      }

    }
  );


  call.on(
    "close",
    ()=>{

      clearSlot(slot);

    }
  );


  call.on(
    "error",
    ()=>{

      clearSlot(slot);

    }
  );

}


/* =========================
   데이터 연결
========================= */

function registerConnection(
  connection
){

  const slot =
    getSlotFromPeerId(
      connection.peer
    );

  if(!slot){
    return;
  }

  connections[slot] =
    connection;


  connection.on(
    "open",
    ()=>{

      sendToConnection(
        connection,
        {
          type:"hello",
          slot:mySlot,
          bigSlot:bigSlot
        }
      );

    }
  );


  connection.on(
    "data",
    data=>{

      handleData(
        data,
        slot
      );

    }
  );


  connection.on(
    "close",
    ()=>{

      if(
        connections[slot] ===
        connection
      ){

        delete connections[slot];

      }

    }
  );


  connection.on(
    "error",
    ()=>{}
  );

}


/* =========================
   수신 데이터
========================= */

function handleData(
  data,
  sender
){

  if(
    !data ||
    typeof data !== "object"
  ){
    return;
  }


  if(data.type === "chat"){

    addChatMessage(
      data.slot,
      data.text
    );

  }


  else if(
    data.type === "big"
  ){

    bigSlot =
      Number(data.slot);

    setBigScreen(
      bigSlot,
      false
    );

  }


  else if(
    data.type === "hello"
  ){

    if(data.bigSlot){

      bigSlot =
        Number(
          data.bigSlot
        );

      setBigScreen(
        bigSlot,
        false
      );

    }

  }


  else if(
    data.type === "rose"
  ){

    addSystemMessage(
      "🌹 참가자 " +
      data.slot +
      "님이 장미 " +
      data.count +
      "송이를 선물했습니다."
    );

  }


  else if(
    data.type === "gift"
  ){

    addSystemMessage(
      "🎁 참가자 " +
      data.slot +
      "님이 " +
      data.name +
      " 선물을 보냈습니다."
    );

  }


  else if(
    data.type === "giftbox"
  ){

    startGiftBox(
      Number(
        data.seconds || 10
      )
    );

  }


  else if(
    data.type === "lottery"
  ){

    addSystemMessage(
      data.text
    );

  }

}


/* =========================
   참가자 영상
========================= */

function showStreamInSlot(
  slot,
  stream,
  muted
){

  const video =
    document.getElementById(
      "video-"+slot
    );

  const empty =
    document.getElementById(
      "empty-"+slot
    );

  if(!video){
    return;
  }

  video.srcObject =
    stream;

  video.muted =
    muted;

  video.style.display =
    "block";

  if(empty){

    empty.style.display =
      "none";

  }

}


/* =========================
   참가자 나감
========================= */

function clearSlot(slot){

  delete calls[slot];
  delete remoteStreams[slot];

  const video =
    document.getElementById(
      "video-"+slot
    );

  const empty =
    document.getElementById(
      "empty-"+slot
    );

  if(video){

    video.srcObject =
      null;

    video.style.display =
      "none";

  }

  if(empty){

    empty.style.display =
      "flex";

  }

  if(
    bigSlot === slot
  ){

    bigSlot = 1;

    if(
      remoteStreams[1]
    ){

      setBigScreen(
        1,
        false
      );

    }

    else{

      stageVideo.srcObject =
        null;

      stageName.textContent =
        "진행자 큰 화면";

    }

  }

}


/* =========================
   큰 방송 화면
========================= */

function setBigScreen(
  slot,
  send
){

  const stream =
    remoteStreams[slot];

  if(!stream){
    return;
  }

  bigSlot =
    slot;

  stageVideo.srcObject =
    stream;

  stageVideo.muted =
    slot === mySlot;

  if(slot === 1){

    stageName.textContent =
      "👑 호스트";

  }

  else{

    stageName.textContent =
      "🎤 참가자 " +
      slot;

  }


  if(send){

    broadcastData({
      type:"big",
      slot:slot
    });

    addSystemMessage(
      "참가자 " +
      slot +
      "님이 큰 화면으로 이동했습니다."
    );

  }

}


function promoteMyself(){

  if(!mySlot){
    return;
  }

  if(mySlot === 1){

    setBigScreen(
      mySlot,
      true
    );

  }

  else{

    alert(
      "큰 화면 이동은 호스트가 선택합니다."
    );

  }

}


/* =========================
   채팅
========================= */

function sendChat(){

  if(!mySlot){

    alert(
      "먼저 방송 시작을 눌러주세요."
    );

    return;
  }

  const input =
    document.getElementById(
      "chatText"
    );

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addChatMessage(
    mySlot,
    text
  );

  broadcastData({
    type:"chat",
    slot:mySlot,
    text:text
  });

  input.value = "";

}


document
.getElementById("chatText")
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter"
    ){

      sendChat();

    }

  }
);


function addChatMessage(
  slot,
  text
){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message";

  div.textContent =
    "참가자 " +
    slot +
    " : " +
    text;

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;

}


function addSystemMessage(
  text
){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message system";

  div.textContent =
    text;

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   데이터 전송
========================= */

function sendToConnection(
  connection,
  data
){

  try{

    if(
      connection &&
      connection.open
    ){

      connection.send(
        data
      );

    }

  }
  catch(e){}

}


function broadcastData(data){

  Object.values(
    connections
  )
  .forEach(
    connection=>{

      sendToConnection(
        connection,
        data
      );

    }
  );

}

/* =========================
   선물상자
========================= */

function openGiftBox(){

  if(!mySlot){

    alert(
      "먼저 방송방에 입장해 주세요."
    );

    return;
  }

  startGiftBox(10);

  broadcastData({
    type:"giftbox",
    seconds:10
  });

  addSystemMessage(
    "🎁 선물상자가 올라왔습니다."
  );

}


function startGiftBox(seconds){

  clearInterval(
    giftTimer
  );

  giftSeconds =
    seconds;

  giftReceived =
    false;

  const popup =
    document.getElementById(
      "giftPopup"
    );

  const count =
    document.getElementById(
      "giftCount"
    );

  const button =
    document.getElementById(
      "giftReceive"
    );

  popup.style.display =
    "block";

  button.disabled =
    true;

  button.textContent =
    "기다리는 중";

  count.textContent =
    giftSeconds +
    "초";

  giftTimer =
    setInterval(
      ()=>{

        giftSeconds--;

        if(
          giftSeconds > 0
        ){

          count.textContent =
            giftSeconds +
            "초";

        }

        else{

          clearInterval(
            giftTimer
          );

          count.textContent =
            "지금 누르세요!";

          button.disabled =
            false;

          button.textContent =
            "선물 받기";

          setTimeout(
            ()=>{

              if(
                !giftReceived
              ){

                popup.style.display =
                  "none";

              }

            },
            7000
          );

        }

      },
      1000
    );

}


function receiveGift(){

  if(
    giftReceived ||
    giftSeconds > 0
  ){
    return;
  }

  giftReceived =
    true;

  const reward =
    Math.floor(
      Math.random()*5
    ) + 1;

  document.getElementById(
    "giftCount"
  ).textContent =
    "🌹 장미 " +
    reward +
    "개";

  document.getElementById(
    "giftReceive"
  ).disabled =
    true;

  addSystemMessage(
    "🎉 참가자 " +
    mySlot +
    "님이 선물상자에서 장미 " +
    reward +
    "개를 받았습니다."
  );

  setTimeout(
    ()=>{

      document.getElementById(
        "giftPopup"
      ).style.display =
        "none";

    },
    2500
  );

}

========================= */

async function copyInvite(){

  const url =
    location.origin +
    location.pathname +
    "?room=" +
    ROOM;

  try{

    await navigator
    .clipboard
    .writeText(
      url
    );

    alert(
      "방송방 주소가 복사되었습니다."
    );

  }

  catch(e){

    prompt(
      "아래 주소를 복사하세요.",
      url
    );

  }

}


/* =========================
   나가기
========================= */

function leaveRoom(){

  Object.values(
    calls
  )
  .forEach(
    call=>{

      try{
        call.close();
      }
      catch(e){}

    }
  );

  Object.values(
    connections
  )
  .forEach(
    connection=>{

      try{
        connection.close();
      }
      catch(e){}

    }
  );

  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track=>{
        track.stop();
      }
    );

  }

  if(peer){

    try{
      peer.destroy();
    }
    catch(e){}

  }

  location.reload();

}


/* =========================
   끊어진 참가자 자동정리
========================= */

const disconnectedSince = {};

setInterval(
  ()=>{

    if(
      !peer ||
      !localStream ||
      !mySlot
    ){
      return;
    }

    Object.keys(
      calls
    )
    .forEach(
      key=>{

        const slot =
          Number(key);

        const call =
          calls[slot];

        if(!call){
          return;
        }

        const pc =
          call.peerConnection;

        if(!pc){
          return;
        }

        const state =
          pc.connectionState;

        if(
          state ===
          "connected"
        ){

          delete disconnectedSince[
            slot
          ];

          return;

        }

        if(
          state === "failed" ||
          state === "closed" ||
          state === "disconnected"
        ){

          if(
            !disconnectedSince[
              slot
            ]
          ){

            disconnectedSince[
              slot
            ] =
              Date.now();

          }

          if(
            Date.now() -
            disconnectedSince[
              slot
            ] >
            5000
          ){

            try{
              call.close();
            }
            catch(e){}

            delete calls[slot];

            delete disconnectedSince[
              slot
            ];

            clearSlot(slot);

          }

        }

      }
    );

    connectToRoom();

  },
  2500
);


/* 화면 다시 켰을 때 재연결 */
document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      !document.hidden
    ){

      setTimeout(
        connectToRoom,
        500
      );

    }

  }
);


window.addEventListener(
  "beforeunload",
  ()=>{

    try{

      if(peer){
        peer.destroy();
      }

    }
    catch(e){}

  }
);
</script>
