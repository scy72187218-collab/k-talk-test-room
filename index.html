<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#050509;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

body{overflow-x:hidden}
button,input{font-family:inherit}

.wrap{
  width:100%;
  max-width:1180px;
  margin:auto;
  padding:6px;
}

/* 상단 */
.header{
  height:52px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

.live{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:900;
}

.liveBadge{
  background:#f0184e;
  border-radius:7px;
  padding:6px 8px;
  font-size:12px;
}

.logo{
  text-align:center;
  color:#ffd83c;
  font-size:25px;
  font-weight:900;
}

.logo small{
  display:block;
  color:#fff;
  font-size:10px;
  margin-top:2px;
}

.viewer{
  text-align:right;
  font-size:12px;
}

.notice{
  border:1px solid #57225f;
  border-radius:8px;
  text-align:center;
  padding:7px 3px;
  font-size:12px;
  font-weight:900;
  margin-bottom:5px;
}

.yellow{color:#ffd52d}
.pink{color:#ff2c99}

.enter{
  display:flex;
  justify-content:center;
  gap:7px;
  margin:5px 0;
}

.enter button{
  border:0;
  border-radius:8px;
  padding:8px 14px;
  font-weight:900;
}

.hostBtn{background:#ffd43d;color:#111}
.guestBtn{background:#1dc977;color:#111}

.status{
  text-align:center;
  color:#aaa;
  font-size:10px;
  margin-bottom:5px;
}

/* 방송 영역 */
.stage{
  display:grid;
  grid-template-columns:46% 54%;
  gap:4px;
}

.host{
  height:420px;
  position:relative;
  overflow:hidden;
  border:1px solid #65266d;
  border-radius:8px;
  background:#09070c;
}

.host video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#09070c;
}

.onair{
  position:absolute;
  left:8px;
  top:8px;
  color:#ff315f;
  font-weight:900;
  font-size:12px;
}

.attendance{
  position:absolute;
  left:50%;
  top:44px;
  transform:translateX(-50%);
  color:#ffd53a;
  border:2px solid #ff26d4;
  background:rgba(35,0,45,.7);
  border-radius:20px;
  padding:7px 12px;
  font-weight:900;
  white-space:nowrap;
}

.hostName{
  position:absolute;
  left:8px;
  bottom:8px;
  border-radius:7px;
  background:rgba(0,0,0,.75);
  padding:5px 8px;
  color:#ffd53a;
  font-weight:900;
}

/* 참가자 */
.guestGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-auto-rows:80px;
  gap:3px;
  align-content:start;
}

.slot{
  position:relative;
  overflow:hidden;
  border:1px solid #36313e;
  border-radius:6px;
  background:#101014;
}

.slot video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.slotNumber{
  position:absolute;
  left:3px;
  top:3px;
  width:20px;
  height:20px;
  border-radius:5px;
  background:#777;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
  font-weight:900;
}

.slot:nth-child(1) .slotNumber{background:#ffc928;color:#111}
.slot:nth-child(3) .slotNumber{background:#e36c00}
.slot:nth-child(5) .slotNumber{background:#17a9cd}
.slot:nth-child(6) .slotNumber{background:#681bdc}

.slotMute{
  position:absolute;
  right:3px;
  top:3px;
  font-size:10px;
  background:rgba(0,0,0,.7);
  border-radius:5px;
  padding:2px;
}

.slotName{
  position:absolute;
  left:3px;
  right:3px;
  bottom:2px;
  font-size:8px;
  font-weight:900;
  padding:10px 2px 2px;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
}

.slotRose{
  position:absolute;
  right:3px;
  bottom:2px;
  font-size:12px;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#555;
  font-size:8px;
}

/* 아래 */
.lower{
  display:grid;
  grid-template-columns:46% 54%;
  gap:4px;
  margin-top:4px;
}

.panel{
  border:1px solid #57225f;
  border-radius:8px;
  background:#09070c;
  overflow:hidden;
}

.title{
  padding:6px 7px;
  border-bottom:1px solid #3b1d43;
  font-size:10px;
  font-weight:900;
}

.messages{
  height:130px;
  overflow:auto;
  padding:6px;
  font-size:8px;
  line-height:1.55;
}

.messages b{color:#39dbff}

.chatInput{
  display:grid;
  grid-template-columns:1fr auto;
  gap:3px;
  padding:4px;
}

.chatInput input{
  min-width:0;
  border:1px solid #2e2831;
  border-radius:6px;
  padding:6px;
  background:#161219;
  color:#fff;
  font-size:8px;
}

.chatInput button{
  border:0;
  border-radius:6px;
  background:#7d2adb;
  color:#fff;
  font-size:8px;
  padding:0 8px;
  font-weight:900;
}

.right{
  display:grid;
  gap:4px;
}

.gifts{
  padding:4px;
}

.giftRow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:2px;
}

.gift{
  border:0;
  background:#110d15;
  color:#fff;
  padding:3px 0;
  font-size:6px;
  border-radius:5px;
}

.gift span{
  display:block;
  font-size:18px;
}

.gift small{
  display:block;
  font-size:6px;
}

.giftBottom{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:3px;
  margin-top:4px;
}

.roseArea{
  border:1px solid #67294e;
  border-radius:6px;
  padding:4px;
}

.roseTitle{
  color:#ffd53a;
  font-size:8px;
  font-weight:900;
}

.roseButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
  margin-top:2px;
}

.roseButtons button{
  border:0;
  border-radius:5px;
  background:#110d15;
  color:#fff;
  font-size:6px;
  padding:3px 0;
}

.roseButtons span{
  display:block;
  font-size:17px;
}

.giftBox{
  border:1px solid #9b34ff;
  border-radius:6px;
  background:#17091e;
  color:#fff;
  font-size:7px;
  font-weight:900;
}

.giftBox span{
  display:block;
  font-size:27px;
}

.lottery{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  border:1px solid #9b34ff;
  border-radius:7px;
  padding:5px;
  background:#16071c;
}

.lotteryTitle{
  color:#ffb3ff;
  font-size:10px;
  font-weight:900;
}

.times{
  display:flex;
  gap:2px;
  margin-top:3px;
}

.time{
  background:#211126;
  border-radius:5px;
  padding:3px;
  text-align:center;
  font-size:6px;
}

.machine{
  font-size:32px;
}

/* 기능버튼 */
.controls{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  margin-top:4px;
  margin-bottom:62px;
}

.controls button{
  border:1px solid #332638;
  border-radius:7px;
  padding:6px 1px;
  background:#0b0910;
  color:#fff;
  font-size:7px;
}

.controls span{
  display:block;
  font-size:16px;
}

/* 하단 */
.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:58px;
  z-index:50;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  background:#121019;
  border-top:1px solid #28222d;
}

.nav{
  text-align:center;
  font-size:9px;
}

.nav span{
  display:block;
  font-size:20px;
}

.charge{
  margin:4px 8px;
  padding:7px 2px;
  background:#f90059;
  border-radius:25px;
  font-weight:900;
}

/* 휴대폰 핵심 */
@media(max-width:700px){

  .wrap{padding:4px}

  .header{height:43px}
  .logo{font-size:18px}
  .logo small{font-size:8px}

  .liveBadge{
    padding:4px 5px;
    font-size:8px;
  }

  #clock{font-size:9px}
  .viewer{font-size:9px}

  .notice{
    font-size:8px;
    padding:5px 2px;
  }

  .enter{
    margin:3px 0;
  }

  .enter button{
    font-size:8px;
    padding:5px 8px;
  }

  .status{
    font-size:8px;
    margin-bottom:3px;
  }

  /* 중요: 두 번째 사진에 맞춘 방송 높이 */
  .host{
    height:220px;
  }

  .onair{
    left:5px;
    top:5px;
    font-size:8px;
  }

  .attendance{
    top:29px;
    padding:4px 7px;
    font-size:7px;
  }

  .hostName{
    left:5px;
    bottom:5px;
    padding:3px 5px;
    font-size:8px;
  }

  /* 5줄 × 약 42px = 호스트와 거의 동일 */
  .guestGrid{
    grid-auto-rows:42px;
    gap:2px;
  }

  .slot{
    border-radius:4px;
  }

  .slotNumber{
    width:14px;
    height:14px;
    font-size:7px;
    border-radius:3px;
    left:2px;
    top:2px;
  }

  .slotMute{
    right:2px;
    top:2px;
    font-size:6px;
  }

  .slotName{
    left:2px;
    bottom:1px;
    font-size:5.5px;
    padding:6px 1px 1px;
  }

  .slotRose{
    right:2px;
    bottom:1px;
    font-size:8px;
  }

  .empty{
    font-size:6px;
  }

  .title{
    padding:4px;
    font-size:7px;
  }

  .messages{
    height:88px;
    padding:4px;
    font-size:6.5px;
  }

  .chatInput{
    padding:3px;
  }

  .chatInput input{
    padding:4px;
    font-size:6px;
  }

  .chatInput button{
    font-size:6px;
    padding:0 5px;
  }

  .gifts{padding:3px}

  .gift{
    font-size:5px;
  }

  .gift span{font-size:13px}
  .gift small{font-size:5px}

  .roseArea{padding:3px}
  .roseTitle{font-size:6px}

  .roseButtons button{
    font-size:5px;
    padding:2px 0;
  }

  .roseButtons span{
    font-size:12px;
  }

  .giftBox{
    font-size:5.5px;
  }

  .giftBox span{
    font-size:20px;
  }

  .lottery{
    padding:3px;
  }

  .lotteryTitle{
    font-size:7px;
  }

  .time{
    font-size:5px;
    padding:2px;
  }

  .machine{
    font-size:23px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">

    <div class="live">
      <span class="liveBadge">● ON AIR</span>
      <span id="clock">00:00:00</span>
    </div>

    <div class="logo">
      ♛ K-Talk
      <small>화상 방송방 · 최대 13명</small>
    </div>

    <div class="viewer">
      👤 <span id="viewerCount">0</span>
    </div>

  </div>

  <div class="notice">
    <span class="yellow">★ 출석체크 눌러주세요 ★</span>
    &nbsp; 신청곡 5,000원 &nbsp;
    <span class="pink">★ 광고 문의 환영합니다 ★</span>
  </div>

  <div class="enter" id="enterButtons">
    <button class="hostBtn" onclick="enterRoom('host')">👑 호스트 시작</button>
    <button class="guestBtn" onclick="enterRoom('guest')">🎥 참가자 입장</button>
  </div>

  <div class="status" id="status">
    입장 버튼을 눌러 주세요.
  </div>

  <div class="stage">

    <div class="host">

      <video id="hostVideo" autoplay playsinline></video>

      <div class="onair">
        ● ON AIR
      </div>

      <div class="attendance">
        출석체크
      </div>

      <div class="hostName" id="hostName">
        👑 호스트
      </div>

    </div>

    <div class="guestGrid" id="guestGrid"></div>

  </div>

  <div class="lower">

    <div class="panel">

      <div class="title">
        채팅　 참가자 (13)
      </div>

      <div class="messages" id="messages">
        <div><b>채팅창 관리자</b> 좋은 방송 감사합니다! 💜</div>
        <div><b>안내</b> 즐겁게 이용해 주세요. ❤️</div>
      </div>

      <div class="chatInput">
        <input id="chatText" placeholder="메시지를 입력하세요...">
        <button onclick="sendChat()">전송</button>
      </div>

    </div>

    <div class="right">

      <div class="panel gifts">

        <div class="title">
          선물 / 후원
        </div>

        <div class="giftRow">

          <button class="gift" onclick="sendGift('장미',50)">
            <span>🌹</span>
            장미
            <small>50</small>
          </button>

          <button class="gift" onclick="sendGift('하트',100)">
            <span>❤️</span>
            하트
            <small>100</small>
          </button>

          <button class="gift" onclick="sendGift('별',200)">
            <span>⭐</span>
            별
            <small>200</small>
          </button>

          <button class="gift" onclick="sendGift('풍선',300)">
            <span>🎈</span>
            풍선
            <small>300</small>
          </button>

          <button class="gift" onclick="sendGift('슈퍼하트',500)">
            <span>💖</span>
            슈퍼하트
            <small>500</small>
          </button>

        </div>

        <div class="giftBottom">

          <div class="roseArea">

            <div class="roseTitle">
              장미 선물
            </div>

            <div class="roseButtons">

              <button onclick="sendRose(1)">
                <span>🌹</span>
                1송이
              </button>

              <button onclick="sendRose(5)">
                <span>💐</span>
                5송이
              </button>

              <button onclick="sendRose(10)">
                <span>🌹🌹</span>
                10송이
              </button>

            </div>

          </div>

          <button class="giftBox" onclick="openGiftBox()">
            <span>🎁</span>
            선물상자
          </button>

        </div>

      </div>

      <div class="lottery" onclick="drawLottery()">

        <div>

          <div class="lotteryTitle">
            제비뽑기 이벤트
          </div>

          <div class="times">
            <div class="time">☀️ 아침<br>09:00</div>
            <div class="time">☀️ 점심<br>13:00</div>
            <div class="time">🌙 저녁<br>20:00</div>
          </div>

        </div>

        <div class="machine">
          🎰
        </div>

      </div>

    </div>

  </div>

  <div class="controls">

    <button onclick="toggleMic()">
      <span>🎤</span>
      마이크
    </button>

    <button onclick="toggleCam()">
      <span>📷</span>
      카메라
    </button>

    <button onclick="switchCamera()">
      <span>🔄</span>
      화면전환
    </button>

    <button onclick="shareRoom()">
      <span>🔗</span>
      공유
    </button>

    <button onclick="leaveRoom()">
      <span>🚪</span>
      나가기
    </button>

  </div>

</div>

<div class="bottomNav">

  <div class="nav">
    <span>🏠</span>
    홈
  </div>

  <div class="nav">
    <span>👤</span>
    마이페이지
  </div>

  <div class="nav charge">
    <span>🪙</span>
    충전하기
  </div>

  <div class="nav">
    <span>🔔</span>
    알림
  </div>

  <div class="nav">
    <span>⚙️</span>
    설정
  </div>

</div>

<script type="module">

import {
  joinRoom,
  selfId
} from 'https://esm.run/trystero'

let room=null
let stream=null
let myRole=''
let myName=''
let facingMode='user'

const peers={}
const peerStreams={}

const guestGrid=
document.getElementById('guestGrid')

/* 1~13 참가자 칸 */
for(let i=1;i<=13;i++){

  const box=
  document.createElement('div')

  box.className='slot'

  box.innerHTML=`
    <video id="video${i}" autoplay playsinline></video>
    <div class="empty" id="empty${i}">빈자리</div>
    <div class="slotNumber">${i}</div>
    <div class="slotMute">🔇</div>
    <div class="slotName" id="name${i}">빈자리</div>
    <div class="slotRose">🌹</div>
  `

  guestGrid.appendChild(box)
}

/* 글자 안전처리 */
function esc(text){

  return String(text)
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
}

/* 입장 */
window.enterRoom=
async function(role){

  if(room)return

  myRole=role

  myName=
  prompt(
    role==='host'
      ? '호스트 이름'
      : '닉네임',

    role==='host'
      ? '호스트'
      : '참가자'
  )
  ||
  (
    role==='host'
      ? '호스트'
      : '참가자'
  )

  try{

    stream=
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:facingMode
      },

      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }

    })

  }catch(error){

    alert(
      '카메라와 마이크를 허용해 주세요.'
    )

    return
  }

  const roomId=
  new URLSearchParams(
    location.search
  ).get('room')
  ||
  'main'

  room=
  joinRoom(
    {
      appId:'k-talk-room-13-2026'
    },
    roomId
  )

  const profile=
  room.makeAction('profile')

  const chat=
  room.makeAction('chat')

  const gift=
  room.makeAction('gift')

  window.profileAction=profile
  window.chatAction=chat
  window.giftAction=gift

  peers[selfId]={
    name:myName,
    role:myRole
  }

  peerStreams[selfId]=stream

  profile.onMessage=
  (data,{peerId})=>{

    peers[peerId]=data
    render()
  }

  chat.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  gift.onMessage=
  data=>{

    addMessage(
      data.name,
      data.text
    )
  }

  room.onPeerJoin=
  peerId=>{

    profile.send(
      {
        name:myName,
        role:myRole
      },
      {
        target:peerId
      }
    )

    room.addStream(
      stream,
      {
        target:peerId
      }
    )
  }

  room.onPeerLeave=
  peerId=>{

    delete peers[peerId]
    delete peerStreams[peerId]

    render()
  }

  room.onPeerStream=
  (incoming,peerId)=>{

    peerStreams[peerId]=incoming
    render()
  }

  room.addStream(stream)

  profile.send({
    name:myName,
    role:myRole
  })

  document
  .getElementById('enterButtons')
  .style.display='none'

  document
  .getElementById('status')
  .textContent=
  '방송방에 입장했습니다.'

  render()
}

/* 화면 배치 */
function render(){

  const ids=
  Object.keys(peers)

  document
  .getElementById('viewerCount')
  .textContent=
  ids.length

  const hostId=
  ids.find(
    id=>
    peers[id]?.role==='host'
  )

  const hostVideo=
  document.getElementById(
    'hostVideo'
  )

  if(
    hostId &&
    peerStreams[hostId]
  ){

    hostVideo.srcObject=
    peerStreams[hostId]

    hostVideo.muted=
    hostId===selfId

    document
    .getElementById('hostName')
    .textContent=
    '👑 '+
    (
      peers[hostId]?.name
      ||
      '호스트'
    )

  }else{

    hostVideo.srcObject=null
  }

  const guests=
  ids.filter(
    id=>id!==hostId
  )

  for(let i=1;i<=13;i++){

    const peerId=
    guests[i-1]

    const video=
    document.getElementById(
      'video'+i
    )

    const empty=
    document.getElementById(
      'empty'+i
    )

    const name=
    document.getElementById(
      'name'+i
    )

    if(peerId){

      empty.style.display='none'

      name.textContent=
      peers[peerId]?.name
      ||
      '참가자 '+i

      if(
        peerStreams[peerId]
      ){

        video.srcObject=
        peerStreams[peerId]

        video.muted=
        peerId===selfId
      }

    }else{

      video.srcObject=null

      empty.style.display='flex'

      name.textContent='빈자리'
    }
  }
}

function addMessage(
  name,
  text
){

  const line=
  document.createElement('div')

  line.innerHTML=
  '<b>'+
  esc(name)+
  '</b> '+
  esc(text)

  const messages=
  document.getElementById(
    'messages'
  )

  messages.appendChild(line)

  messages.scrollTop=
  messages.scrollHeight
}

/* 전면/후면 */
window.switchCamera=
async function(){

  if(!stream)return

  try{

    facingMode=
    facingMode==='user'
      ? 'environment'
      : 'user'

    const next=
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:facingMode
      },

      audio:false
    })

    const oldTrack=
    stream.getVideoTracks()[0]

    const newTrack=
    next.getVideoTracks()[0]

    if(
      room &&
      room.replaceTrack
    ){

      await room.replaceTrack(
        oldTrack,
        newTrack
      )
    }

    oldTrack.stop()

    stream.removeTrack(
      oldTrack
    )

    stream.addTrack(
      newTrack
    )

    peerStreams[selfId]=
    stream

    render()

  }catch(error){

    alert(
      '카메라 전환을 할 수 없습니다.'
    )
  }
}

/* 공유 */
window.shareRoom=
async function(){

  try{

    if(navigator.share){

      await navigator.share({
        title:'K-Talk',
        url:location.href
      })

    }else{

      await navigator.clipboard
      .writeText(
        location.href
      )

      alert(
        '주소를 복사했습니다.'
      )
    }

  }catch(error){}
}

/* 나가기 */
window.leaveRoom=
function(){

  if(stream){

    stream
    .getTracks()
    .forEach(
      track=>track.stop()
    )
  }

  if(room){

    room.leave()
  }

  location.reload()
}
