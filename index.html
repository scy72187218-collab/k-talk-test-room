
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk 방송방</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07090d;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
button,input{font-family:inherit}
button{cursor:pointer}

.top{
  height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  background:#11151d;
  border-bottom:1px solid #282e39;
}
.logo{
  font-size:20px;
  font-weight:900;
  color:#ffd54a;
}
.live{
  background:#ed2d45;
  padding:5px 10px;
  border-radius:15px;
  font-size:12px;
  font-weight:900;
}
.count{
  font-size:13px;
  color:#d5d9e1;
}

.startBox{
  padding:8px;
  display:flex;
  gap:8px;
  justify-content:center;
  background:#0b0e14;
}
.startBox button{
  border:0;
  border-radius:10px;
  padding:10px 18px;
  font-weight:900;
  font-size:14px;
}
.hostStart{background:#ffd43b;color:#111}
.guestStart{background:#22c777;color:#04170d}

.stage{
  width:100%;
  display:grid;
  grid-template-columns:minmax(210px,1.35fr) minmax(170px,1fr);
  gap:6px;
  padding:6px;
}

.hostBox{
  position:relative;
  background:#141822;
  border-radius:13px;
  overflow:hidden;
  min-height:440px;
  border:2px solid #e0b92e;
}
.hostBox video{
  width:100%;
  height:100%;
  min-height:440px;
  object-fit:cover;
  background:#111;
}
.hostBadge{
  position:absolute;
  left:9px;
  top:9px;
  padding:5px 9px;
  border-radius:16px;
  background:rgba(0,0,0,.72);
  color:#ffd640;
  font-weight:900;
  font-size:13px;
}
.hostName{
  position:absolute;
  bottom:10px;
  left:10px;
  padding:5px 9px;
  border-radius:10px;
  background:rgba(0,0,0,.65);
  font-weight:800;
}

.guestGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  align-content:start;
}
.slot{
  position:relative;
  aspect-ratio:3/4;
  min-height:102px;
  border-radius:9px;
  overflow:hidden;
  background:#171b24;
  border:1px solid #343b48;
}
.slot video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#10131a;
}
.slotNo{
  position:absolute;
  top:5px;
  left:5px;
  background:rgba(0,0,0,.65);
  padding:3px 6px;
  border-radius:8px;
  font-size:10px;
  font-weight:900;
}
.slotName{
  position:absolute;
  bottom:4px;
  left:4px;
  right:4px;
  background:rgba(0,0,0,.6);
  padding:3px;
  border-radius:6px;
  font-size:10px;
  text-align:center;
  overflow:hidden;
  white-space:nowrap;
}
.empty{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#555f70;
  font-size:26px;
}

.controlBar{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:7px;
  background:#0e1219;
}
.controlBar button{
  border:0;
  border-radius:22px;
  min-width:78px;
  padding:9px 12px;
  background:#262c37;
  color:#fff;
  font-weight:800;
}
.controlBar .end{
  background:#d92e40;
}

.bottom{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:6px;
  padding:6px;
}

.panel{
  background:#121722;
  border:1px solid #2b3340;
  border-radius:12px;
  overflow:hidden;
}
.panelTitle{
  padding:8px 10px;
  font-size:13px;
  font-weight:900;
  border-bottom:1px solid #292f39;
}

.messages{
  height:140px;
  overflow-y:auto;
  padding:8px;
  font-size:12px;
  line-height:1.6;
}
.msg{
  padding:3px 0;
  border-bottom:1px solid rgba(255,255,255,.035);
}
.msg b{color:#ffd54a}

.chatInput{
  display:flex;
  padding:7px;
  gap:5px;
}
.chatInput input{
  flex:1;
  border:1px solid #333b49;
  background:#090c11;
  color:#fff;
  border-radius:18px;
  padding:9px 12px;
  outline:none;
}
.chatInput button{
  border:0;
  border-radius:18px;
  background:#ffca28;
  color:#111;
  font-weight:900;
  padding:0 14px;
}

.gifts{
  padding:8px;
}
.roseRow{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}
.giftBtn{
  border:1px solid #3b4351;
  background:#1b202a;
  color:#fff;
  border-radius:9px;
  padding:7px 2px;
  font-size:11px;
  font-weight:800;
}
.giftBtn span{
  display:block;
  font-size:20px;
}
.eventRow{
  margin-top:8px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.eventBtn{
  border:0;
  border-radius:9px;
  padding:10px 4px;
  font-weight:900;
}
.giftBox{background:#714bff;color:#fff}
.lottery{background:#ffb52b;color:#211400}

.notice{
  display:none;
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);
  z-index:999;
  background:rgba(0,0,0,.9);
  border:1px solid #ffd54a;
  border-radius:13px;
  padding:13px 20px;
  font-size:15px;
  font-weight:900;
  text-align:center;
}

@media(max-width:620px){
  .top{height:48px}
  .logo{font-size:17px}
  .stage{
    grid-template-columns:1.22fr 1fr;
    gap:4px;
    padding:4px;
  }
  .hostBox,.hostBox video{
    min-height:350px;
  }
  .guestGrid{
    grid-template-columns:repeat(2,1fr);
    gap:4px;
  }
  .slot{
    min-height:82px;
  }
  .bottom{
    grid-template-columns:1fr;
  }
  .messages{height:105px}
  .controlBar button{
    min-width:67px;
    padding:8px 7px;
    font-size:12px;
  }
}

@media(max-width:390px){
  .hostBox,.hostBox video{
    min-height:330px;
  }
  .slot{
    min-height:76px;
  }
}
</style>
</head>

<body>

<div class="top">
  <div class="logo">👑 K-Talk</div>
  <div class="live">● 방송중</div>
  <div class="count">접속 <b id="peopleCount">0</b>명</div>
</div>

<div class="startBox" id="startBox">
  <button class="hostStart" id="hostStart">👑 호스트 시작</button>
  <button class="guestStart" id="guestStart">🎥 참가자 입장</button>
</div>

<div class="stage">

  <div class="hostBox">
    <video id="hostVideo" autoplay playsinline></video>
    <div class="hostBadge">👑 HOST</div>
    <div class="hostName" id="hostName">호스트 대기중</div>
  </div>

  <div class="guestGrid" id="guestGrid"></div>

</div>

<div class="controlBar">
  <button id="micBtn">🎤 마이크</button>
  <button id="camBtn">📷 카메라</button>
  <button id="switchBtn">🔄 전환</button>
  <button class="end" id="endBtn">☎ 종료</button>
</div>

<div class="bottom">

  <div class="panel">
    <div class="panelTitle">💬 실시간 채팅</div>
    <div class="messages" id="messages">
      <div class="msg"><b>K-Talk</b> 방송방에 오신 것을 환영합니다.</div>
    </div>
    <div class="chatInput">
      <input id="chatText" placeholder="메시지 입력">
      <button id="sendBtn">전송</button>
    </div>
  </div>

  <div class="panel">
    <div class="panelTitle">🎁 선물 / 이벤트</div>
    <div class="gifts">

      <div class="roseRow">
        <button class="giftBtn" data-rose="1"><span>🌹</span>1개</button>
        <button class="giftBtn" data-rose="5"><span>🌹</span>5개</button>
        <button class="giftBtn" data-rose="10"><span>🌹</span>10개</button>
        <button class="giftBtn" data-rose="50"><span>🌹</span>50개</button>
        <button class="giftBtn" data-rose="100"><span>🌹</span>100개</button>
      </div>

      <div class="eventRow">
        <button class="eventBtn giftBox" id="giftBoxBtn">🎁 선물상자</button>
        <button class="eventBtn lottery" id="lotteryBtn">🎯 제비뽑기</button>
      </div>

    </div>
  </div>

</div>

<div class="notice" id="notice"></div>

<script type="module">

import {
  joinRoom,
  selfId
} from 'https://esm.run/trystero'

/* =========================
   기본 설정
========================= */

const APP_ID = 'ktalk-live13-room-2026'
const ROOM_ID = new URLSearchParams(location.search).get('room') || 'main-room'

let room = null
let localStream = null
let localRole = ''
let localName = ''
let facingMode = 'user'

const peerInfo = {}
const peerStreams = {}

const hostVideo = document.getElementById('hostVideo')
const hostName = document.getElementById('hostName')
const peopleCount = document.getElementById('peopleCount')
const guestGrid = document.getElementById('guestGrid')
const messages = document.getElementById('messages')
const notice = document.getElementById('notice')

/* =========================
   참가자 칸 1~13 생성
========================= */

for(let i=1;i<=13;i++){
  const box=document.createElement('div')
  box.className='slot'
  box.id='slot-'+i

  box.innerHTML=`
    <video id="video-${i}" autoplay playsinline></video>
    <div class="empty" id="empty-${i}">👤</div>
    <div class="slotNo">${i}</div>
    <div class="slotName" id="name-${i}">빈자리</div>
  `

  guestGrid.appendChild(box)
}

/* =========================
   안내
========================= */

function showNotice(text){
  notice.textContent=text
  notice.style.display='block'

  clearTimeout(showNotice.timer)

  showNotice.timer=setTimeout(()=>{
    notice.style.display='none'
  },2500)
}

/* =========================
   채팅 표시
========================= */

function addMessage(name,text){
  const d=document.createElement('div')
  d.className='msg'
  d.innerHTML=`<b>${escapeHtml(name)}</b> ${escapeHtml(text)}`
  messages.appendChild(d)
  messages.scrollTop=messages.scrollHeight
}

function escapeHtml(v){
  return String(v)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
}

/* =========================
   방 입장
========================= */

async function start(role){

  if(room) return

  localRole=role

  localName=prompt(
    role==='host'
      ? '호스트 이름을 입력하세요'
      : '닉네임을 입력하세요',
    role==='host'
      ? '호스트'
      : '참가자'
  ) || (role==='host' ? '호스트' : '참가자')

  try{

    localStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:facingMode,
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    })

  }catch(e){
    alert('카메라와 마이크 사용을 허용해 주세요.')
    return
  }

  room=joinRoom(
    {appId:APP_ID},
    ROOM_ID
  )

  peerInfo[selfId]={
    id:selfId,
    name:localName,
    role:localRole
  }

  peerStreams[selfId]=localStream

  const metaAction=room.makeAction('meta')
  const chatAction=room.makeAction('chat')
  const giftAction=room.makeAction('gift')

  window.metaAction=metaAction
  window.chatAction=chatAction
  window.giftAction=giftAction

  metaAction.onMessage=(data,{peerId})=>{
    peerInfo[peerId]={
      id:peerId,
      name:data.name || '참가자',
      role:data.role || 'guest'
    }
    renderPeople()
  }

  chatAction.onMessage=(data)=>{
    addMessage(
      data.name || '참가자',
      data.text || ''
    )
  }

  giftAction.onMessage=(data)=>{
    if(data.type==='rose'){
      addMessage(
        data.name,
        `🌹 장미 ${data.count}개를 보냈습니다.`
      )
      showNotice(`🌹 ${data.name}님 장미 ${data.count}개`)
    }

    if(data.type==='giftbox'){
      showNotice(`🎁 ${data.name}님이 선물상자를 열었습니다!`)
    }

    if(data.type==='lottery'){
      showNotice(`🎯 ${data.name}님 결과 : ${data.result}`)
    }
  }

  room.onPeerJoin=peerId=>{

    metaAction.send({
      name:localName,
      role:localRole
    },{
      target:peerId
    })

    if(localStream){
      room.addStream(localStream,{
        target:peerId
      })
    }

    setTimeout(renderPeople,300)
  }

  room.onPeerLeave=peerId=>{
    delete peerInfo[peerId]
    delete peerStreams[peerId]
    renderPeople()
  }

  room.onPeerStream=(stream,peerId)=>{
    peerStreams[peerId]=stream
    renderPeople()
  }

  room.addStream(localStream)

  metaAction.send({
    name:localName,
    role:localRole
  })

  document.getElementById('startBox').style.display='none'

  renderPeople()

  showNotice(
    role==='host'
      ? '👑 호스트 방송 시작'
      : '🎥 방송방 입장 완료'
  )
}

/* =========================
   화면 배치
========================= */

function renderPeople(){

  const allIds=Object.keys(peerInfo)

  peopleCount.textContent=allIds.length

  let hostId=null

  if(
    peerInfo[selfId] &&
    peerInfo[selfId].role==='host'
  ){
    hostId=selfId
  }

  if(!hostId){
    hostId=allIds.find(
      id=>peerInfo[id]?.role==='host'
    )
  }

  if(hostId && peerStreams[hostId]){
    hostVideo.srcObject=peerStreams[hostId]
    hostVideo.muted=(hostId===selfId)

    hostName.textContent=
      peerInfo[hostId]?.name || '호스트'
  }else{
    hostVideo.srcObject=null
    hostName.textContent='호스트 대기중'
  }

  const guests=allIds
    .filter(id=>id!==hostId)
    .sort()

  for(let i=1;i<=13;i++){

    const video=document.getElementById('video-'+i)
    const name=document.getElementById('name-'+i)
    const empty=document.getElementById('empty-'+i)

    const peerId=guests[i-1]

    if(peerId){

      name.textContent=
        peerInfo[peerId]?.name || `참가자 ${i}`

      empty.style.display='none'

      if(peerStreams[peerId]){
        video.srcObject=peerStreams[peerId]
        video.muted=(peerId===selfId)
      }else{
        video.srcObject=null
      }

    }else{

      video.srcObject=null
      name.textContent='빈자리'
      empty.style.display='flex'
    }
  }
}

/* =========================
   버튼
========================= */

document.getElementById('hostStart')
.onclick=()=>start('host')

document.getElementById('guestStart')
.onclick=()=>start('guest')

document.getElementById('micBtn')
.onclick=()=>{

  if(!localStream) return

  const track=localStream.getAudioTracks()[0]

  if(!track) return

  track.enabled=!track.enabled

  document.getElementById('micBtn').textContent=
    track.enabled
      ? '🎤 마이크'
      : '🔇 음소거'
}

document.getElementById('camBtn')
.onclick=()=>{

  if(!localStream) return

  const track=localStream.getVideoTracks()[0]

  if(!track) return

  track.enabled=!track.enabled

  document.getElementById('camBtn').textContent=
    track.enabled
      ? '📷 카메라'
      : '🚫 카메라'
}

/* =========================
   전면 / 후면 카메라
========================= */

document.getElementById('switchBtn')
.onclick=async()=>{

  if(!room || !localStream) return

  try{

    const oldTrack=localStream.getVideoTracks()[0]

    facingMode=
      facingMode==='user'
        ? 'environment'
        : 'user'

    const newStream=
      await navigator.mediaDevices.getUserMedia({
        video:{facingMode},
        audio:false
      })

    const newTrack=newStream.getVideoTracks()[0]

    await room.replaceTrack(
      oldTrack,
      newTrack
    )

    localStream.removeTrack(oldTrack)
    oldTrack.stop()
    localStream.addTrack(newTrack)

    peerStreams[selfId]=localStream

    renderPeople()

  }catch(e){
    showNotice('카메라 전환을 할 수 없습니다.')
  }
}

/* =========================
   종료
========================= */

document.getElementById('endBtn')
.onclick=()=>{

  if(localStream){
    localStream
      .getTracks()
      .forEach(t=>t.stop())
  }

  if(room){
    room.leave()
  }

  location.reload()
}

/* =========================
   채팅 전송
========================= */

function sendChat(){

  if(!window.chatAction){
    showNotice('먼저 방송방에 입장하세요.')
    return
  }

  const input=
    document.getElementById('chatText')

  const text=input.value.trim()

  if(!text) return

  addMessage(localName,text)

  window.chatAction.send({
    name:localName,
    text:text
  })

  input.value=''
}

document.getElementById('sendBtn')
.onclick=sendChat

document.getElementById('chatText')
.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    sendChat()
  }
})

/* =========================
   장미
========================= */

document.querySelectorAll('[data-rose]')
.forEach(btn=>{

  btn.onclick=()=>{

    if(!window.giftAction){
      showNotice('먼저 방송방에 입장하세요.')
      return
    }

    const count=
      Number(btn.dataset.rose)

    addMessage(
      localName,
      `🌹 장미 ${count}개를 보냈습니다.`
    )

    window.giftAction.send({
      type:'rose',
      name:localName,
      count
    })

    showNotice(`🌹 장미 ${count}개`)
  }
})

/* =========================
   선물상자
========================= */

document.getElementById('giftBoxBtn')
.onclick=()=>{

  if(!window.giftAction){
    showNotice('먼저 방송방에 입장하세요.')
    return
  }

  let sec=5

  showNotice(`🎁 선물상자 ${sec}초`)

  const timer=setInterval(()=>{

    sec--

    if(sec>0){
      showNotice(`🎁 선물상자 ${sec}초`)
    }else{

      clearInterval(timer)

      showNotice('🎁 선물상자 열림!')

      window.giftAction.send({
        type:'giftbox',
        name:localName
      })
    }

  },1000)
}

/* =========================
   제비뽑기
========================= */

document.getElementById('lotteryBtn')
.onclick=()=>{

  if(!window.giftAction){
    showNotice('먼저 방송방에 입장하세요.')
    return
  }

  const prizes=[
    '꽝',
    '꽝',
    '장미 1개',
    '장미 2개',
    '장미 3개',
    '장미 4개',
    '장미 5개'
  ]

  const result=
    prizes[
      Math.floor(
        Math.random()*prizes.length
      )
    ]

  showNotice(`🎯 ${result}`)

  window.giftAction.send({
    type:'lottery',
    name:localName,
    result
  })
}

</script>
</body>
</html>
