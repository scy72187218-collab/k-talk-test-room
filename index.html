<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk 방송</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#07050d;color:white;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
.app{max-width:720px;margin:auto;padding:12px}

header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.logo{font-size:29px;font-weight:900;color:#ffd75a}
.onair{
  background:#f52261;padding:11px 15px;
  border-radius:13px;font-weight:900
}
.notice{
  border:1px solid #59305f;border-radius:12px;
  padding:11px;text-align:center;color:#ffd75a;
  font-weight:800;margin-bottom:12px;
}

/* 호스트가 너무 길어지지 않도록 고정 */
.host{
  position:relative;
  width:100%;
  height:300px;
  max-height:300px;
  overflow:hidden;
  border:1px solid #63316a;
  border-radius:18px;
  background:#111018;
}
.host video{
  width:100%;height:100%;
  object-fit:cover;
}
.hostmsg{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:#aaa;font-size:19px;
}

.buttons{display:flex;gap:8px;margin-top:10px}
button{
  border:0;border-radius:12px;padding:12px;
  color:#fff;font-weight:900;font-size:15px;
}
.start{background:#9346ff;flex:1}
.stop{background:#383838;flex:1}

.status{
  margin:10px 0;background:#1d1525;
  padding:10px;border-radius:10px;color:#ffd75a
}

.people{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.person{
  height:95px;background:#1c1522;
  border:1px solid #503058;border-radius:11px;
  overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  color:#bbb;font-size:12px;
}
.person video{
  width:100%;height:100%;object-fit:cover
}
.person span{
  position:absolute;bottom:3px;left:3px;
  background:#000a;padding:2px 5px;border-radius:5px
}

.panel{
  margin-top:12px;border:1px solid #57305d;
  border-radius:14px;padding:10px;background:#0d0912
}
.panel h3{margin:0 0 8px;color:#f4c9ff}

.chat{
  height:150px;overflow:auto;
  background:#08070c;border-radius:9px;
  padding:8px;font-size:14px;line-height:1.6
}
.chatrow{display:flex;gap:6px;margin-top:7px}
.chatrow input{
  flex:1;background:#19171e;color:white;
  border:0;border-radius:9px;padding:12px;
}
.send{background:#8d3ce7}

.gifts{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:6px;text-align:center
}
.gift{
  background:#17101d;border:1px solid #57305d;
  border-radius:10px;padding:9px 3px;
}
.gift .emoji{font-size:27px}
.gift small{display:block;color:#aaa;margin-top:4px}

.bottom{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:7px;margin-top:12px
}
.bottom button{background:#201526}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <div class="logo">👑 K-Talk</div>
    <small>화상 방송방 · 최대 13명</small>
  </div>
  <div class="onair">● ON AIR</div>
</header>

<div class="notice">
  ★ 출석체크 눌러주세요 ★　 광고 문의 환영합니다
</div>

<div class="host">
  <video id="hostVideo" autoplay playsinline muted></video>
  <div id="hostMsg" class="hostmsg">방송 시작을 눌러주세요</div>
</div>

<div class="buttons">
  <button class="start" onclick="startBroadcast()">📹 방송 시작</button>
  <button class="stop" onclick="stopBroadcast()">방송 종료</button>
</div>

<div id="status" class="status">방송 대기 중</div>

<div id="people" class="people"></div>

<div class="panel">
  <h3>💬 채팅</h3>
  <div id="chat" class="chat">
    <div>관리자 : K-Talk 방송방입니다.</div>
  </div>

  <div class="chatrow">
    <input id="chatInput" placeholder="메시지를 입력하세요">
    <button class="send" onclick="sendChat()">전송</button>
  </div>
</div>

<div class="panel">
  <h3>🎁 선물 / 후원 — 테스트 모드</h3>

  <div class="gifts">
    <div class="gift" onclick="testGift('장미')">
      <div class="emoji">🌹</div>장미
      <small>1송이 50원 표시</small>
    </div>

    <div class="gift" onclick="testGift('하트')">
      <div class="emoji">❤️</div>하트
      <small>테스트</small>
    </div>

    <div class="gift" onclick="testGift('별')">
      <div class="emoji">⭐</div>별
      <small>테스트</small>
    </div>

    <div class="gift" onclick="testGift('풍선')">
      <div class="emoji">🎈</div>풍선
      <small>테스트</small>
    </div>

    <div class="gift" onclick="testGift('선물상자')">
      <div class="emoji">🎁</div>선물상자
      <small>테스트</small>
    </div>
  </div>
</div>

<div class="bottom">
  <button onclick="attendance()">💗 출석체크</button>
  <button onclick="lottery()">🎰 제비뽑기</button>
  <button onclick="importantNotice('방송 공지사항을 확인해 주세요.')">📢 공지</button>
  <button onclick="stopBroadcast()">🚪 나가기</button>
</div>

</div>

<script>
const MAX_USERS = 13;
const ROOM_PREFIX = "ktalk-live-room-20260817-";

let peer = null;
let localStream = null;
let mySlot = 0;
let timer = null;

const calls = new Map();

const $ = id => document.getElementById(id);

function makePeople(){
  const box=$("people");
  box.innerHTML="";

  for(let i=1;i<=MAX_USERS;i++){
    const d=document.createElement("div");
    d.className="person";
    d.id="person"+i;
    d.innerHTML=i===1 ? "진행자" : "참가자 "+i;
    box.appendChild(d);
  }
}
makePeople();

function slotFromId(id){
  const m=String(id).match(/-(\d+)$/);
  return m ? Number(m[1]) : 0;
}

function resetPerson(slot){
  const box=$("person"+slot);
  if(!box)return;
  box.innerHTML=slot===1 ? "진행자" : "참가자 "+slot;
}

function showRemote(slot,stream){
  const box=$("person"+slot);
  if(!box)return;

  box.innerHTML="";

  const video=document.createElement("video");
  video.autoplay=true;
  video.playsInline=true;
  video.srcObject=stream;

  const label=document.createElement("span");
  label.textContent=slot===1 ? "진행자" : "참가자 "+slot;

  box.appendChild(video);
  box.appendChild(label);
}

function claimSlot(slot){
  return new Promise(resolve=>{
    const p=new Peer(ROOM_PREFIX+slot,{
      debug:0,
      config:{
        iceServers:[
          {urls:"stun:stun.l.google.com:19302"},
          {urls:"stun:stun1.l.google.com:19302"}
        ]
      }
    });

    let done=false;

    p.on("open",()=>{
      if(done)return;
      done=true;
      resolve(p);
    });

    p.on("error",()=>{
      if(done)return;
      done=true;
      try{p.destroy()}catch(e){}
      resolve(null);
    });

    setTimeout(()=>{
      if(done)return;
      done=true;
      try{p.destroy()}catch(e){}
      resolve(null);
    },2200);
  });
}

async function startBroadcast(){

  if(localStream)return;

  try{
    localStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:640},
        height:{ideal:480}
      },
      audio:{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

  }catch(e){
    alert("카메라와 마이크를 허용해 주세요.");
    return;
  }

  $("hostVideo").srcObject=localStream;
  $("hostMsg").style.display="none";
  $("status").textContent="방송 연결 중...";

  for(let i=1;i<=MAX_USERS;i++){
    const p=await claimSlot(i);

    if(p){
      peer=p;
      mySlot=i;
      break;
    }
  }

  if(!peer){
    alert("현재 방이 가득 찼습니다.");
    stopBroadcast();
    return;
  }

  $("status").textContent=
    "✅ "+(mySlot===1?"진행자":"참가자 "+mySlot)+
    " 입장 완료 · 최대 13명";

  peer.on("call",call=>{
    const slot=slotFromId(call.peer);

    call.answer(localStream);

    call.on("stream",stream=>{
      calls.set(slot,call);
      showRemote(slot,stream);
    });

    call.on("close",()=>{
      calls.delete(slot);
      resetPerson(slot);
    });
  });

  syncUsers();

  timer=setInterval(syncUsers,2500);

  speakImportant(
    mySlot===1
      ? "K Talk 방송을 시작합니다."
      : "방송방에 입장했습니다."
  );
}

function syncUsers(){

  if(!peer || !localStream)return;

  for(let slot=1;slot<=MAX_USERS;slot++){

    if(slot===mySlot)continue;
    if(calls.has(slot))continue;

    let call;

    try{
      call=peer.call(
        ROOM_PREFIX+slot,
        localStream,
        {metadata:{slot:mySlot}}
      );
    }catch(e){
      continue;
    }

    if(!call)continue;

    call.on("stream",stream=>{
      calls.set(slot,call);
      showRemote(slot,stream);
    });

    call.on("close",()=>{
      if(calls.get(slot)===call){
        calls.delete(slot);
        resetPerson(slot);
      }
    });

    call.on("error",()=>{});
  }
}

function stopBroadcast(){

  if(timer){
    clearInterval(timer);
    timer=null;
  }

  calls.forEach(call=>{
    try{call.close()}catch(e){}
  });
  calls.clear();

  if(peer){
    try{peer.destroy()}catch(e){}
  }

  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
  }

  peer=null;
  localStream=null;
  mySlot=0;

  $("hostVideo").srcObject=null;
  $("hostMsg").style.display="flex";
  $("status").textContent="방송 대기 중";

  makePeople();
}

/* =========================
   채팅 자동 음성 읽기
========================= */

let voiceEnabled=true;

function speak(text,important=false){

  if(!voiceEnabled || !text)return;

  if(!("speechSynthesis" in window))return;

  if(important){
    speechSynthesis.cancel();
  }

  const msg=new SpeechSynthesisUtterance(text);

  msg.lang="ko-KR";
  msg.rate=1;
  msg.pitch=1;
  msg.volume=1;

  speechSynthesis.speak(msg);
}

function speakImportant(text){
  speak(text,true);
}

function addChat(name,text,important=false){

  const d=document.createElement("div");

  d.textContent=name+" : "+text;

  $("chat").appendChild(d);
  $("chat").scrollTop=$("chat").scrollHeight;

  if(important){
    speakImportant(name+" 안내. "+text);
  }else{
    speak(name+"님, "+text);
  }
}

function sendChat(){

  const input=$("chatInput");
  const text=input.value.trim();

  if(!text)return;

  addChat("나",text);

  input.value="";
}

/* 중요 공지는 일반 채팅보다 먼저 읽음 */
function importantNotice(text){
  addChat("관리자",text,true);
}

/* =========================
   선물 테스트
   실제 코인/돈 계산 없음
========================= */

function testGift(name){

  addChat(
    "선물",
    name+" 선물이 전송되었습니다. 테스트 방송이므로 실제 금액은 계산되지 않습니다.",
    true
  );
}

/* 출석체크 테스트 */
function attendance(){

  addChat(
    "출석체크",
    "출석체크가 완료되었습니다. 테스트 모드입니다."
  );
}

/* 제비뽑기 테스트 */
function lottery(){

  const result=[
    "꽝",
    "꽝",
    "장미 1송이",
    "장미 2송이",
    "장미 3송이",
    "장미 4송이",
    "장미 5송이"
  ];

  const pick=result[
    Math.floor(Math.random()*result.length)
  ];

  addChat(
    "제비뽑기",
    pick+" 당첨. 테스트 결과입니다."
  );
}

window.addEventListener("beforeunload",()=>{
  try{stopBroadcast()}catch(e){}
});
</script>

</body>
  </html>
