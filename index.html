<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-Talk 화상 방송방</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#050509;
  color:#fff;
  font-family:Arial,"Noto Sans KR",sans-serif;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* 상단 */
.header{
  height:55px;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  background:#08090d;
  border-bottom:1px solid #42234c;
}

.logo{
  color:#ffd74d;
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.live{
  background:#ed2348;
  padding:6px 8px;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.roomTitle{
  flex:1;
  text-align:center;
  color:#ddd;
  font-size:10px;
}

.startBtn{
  border:0;
  border-radius:9px;
  background:#9133e9;
  color:#fff;
  padding:8px 9px;
  font-weight:800;
  font-size:12px;
}

/* 공지 */
.notice{
  margin:6px;
  padding:8px 4px;
  text-align:center;
  border:1px solid #532664;
  border-radius:9px;
  color:#ffd95f;
  background:#0e0912;
  font-size:11px;
}

/* 위쪽 방송 영역 */
.broadcast{
  display:grid;
  grid-template-columns:46% 54%;
  gap:5px;
  padding:0 6px;
  align-items:start;
}

/* 왼쪽 큰 화면 */
.mainStage{
  position:relative;
  height:335px;
  overflow:hidden;
  border:1px solid #5c2b69;
  border-radius:10px;
  background:#101014;
}

.mainStage video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#101014;
}

.stageInfo{
  position:absolute;
  left:7px;
  right:7px;
  bottom:7px;
  padding:6px;
  border-radius:7px;
  background:rgba(0,0,0,.68);
}

.stageName{
  color:#ffd64c;
  font-weight:900;
  font-size:12px;
}

.stageText{
  color:#ddd;
  font-size:9px;
  margin-top:2px;
}

/* 오른쪽 13자리 */
.members{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.member{
  position:relative;
  height:64px;
  overflow:hidden;
  border-radius:7px;
  border:1px solid #563061;
  background:#17131d;
}

.member video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  background:#111;
}

.empty{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#817587;
  font-size:9px;
}

.slotNum{
  position:absolute;
  top:2px;
  left:2px;
  width:17px;
  height:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:5px;
  background:rgba(0,0,0,.76);
  font-size:8px;
}

.memberName{
  position:absolute;
  left:2px;
  bottom:2px;
  max-width:78%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  border-radius:4px;
  background:rgba(0,0,0,.76);
  padding:2px 3px;
  font-size:7px;
}

.rose{
  position:absolute;
  right:2px;
  bottom:1px;
  font-size:12px;
}

/* 연결 상태 */
.status{
  margin:6px;
  padding:7px 8px;
  border:1px solid #492655;
  border-radius:8px;
  background:#100b14;
  color:#ffd861;
  font-size:10px;
}

/* 채팅 + 선물 */
.lower{
  display:grid;
  grid-template-columns:48% 52%;
  gap:5px;
  padding:0 6px 7px;
}

.chat{
  border:1px solid #50265d;
  border-radius:9px;
  overflow:hidden;
  background:#0c0910;
}

.chatHead{
  display:flex;
  justify-content:space-between;
  padding:7px;
  border-bottom:1px solid #41214a;
  color:#f3d8ff;
  font-size:11px;
  font-weight:900;
}

.messages{
  height:150px;
  padding:7px;
  overflow-y:auto;
  font-size:10px;
  line-height:1.45;
}

.message{
  margin-bottom:5px;
}

.system{
  color:#ffd860;
}

.chatInput{
  display:flex;
  border-top:1px solid #41214a;
}

.chatInput input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:9px 6px;
  background:#17111d;
  color:#fff;
  font-size:10px;
}

.sendBtn{
  width:48px;
  border:0;
  background:#8132d9;
  color:#fff;
  font-size:10px;
  font-weight:800;
}

/* 선물 */
.giftArea{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.panel{
  overflow:hidden;
  border:1px solid #50265d;
  border-radius:9px;
  background:#0c0910;
}

.panelTitle{
  padding:6px 7px;
  border-bottom:1px solid #41214a;
  font-size:10px;
  font-weight:900;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
  padding:5px;
}

.giftBtn{
  border:0;
  border-radius:7px;
  padding:6px 1px;
  background:#1c1422;
  color:#fff;
  font-size:8px;
}

.giftEmoji{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.events{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:5px;
}

.eventBtn{
  border:1px solid #773895;
  border-radius:7px;
  padding:9px 3px;
  background:#211029;
  color:#fff;
  font-size:9px;
  font-weight:800;
}

/* 하단 버튼 */
.controls{
  position:sticky;
  bottom:0;
  z-index:100;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
  padding:5px 6px;
  background:#09090e;
  border-top:1px solid #402148;
}

.controlBtn{
  min-height:51px;
  border:0;
  border-radius:10px;
  background:#201728;
  color:#fff;
  font-size:9px;
}

.controlBtn .icon{
  display:block;
  font-size:18px;
  margin-bottom:2px;
}

.controlBtn.end{
  background:#dd264a;
}

/* 선물상자 */
.giftPopup{
  display:none;
  position:fixed;
  z-index:500;
  top:115px;
  left:50%;
  transform:translateX(-50%);
  width:175px;
  padding:14px 9px;
  text-align:center;
  border:2px solid #b94aff;
  border-radius:14px;
  background:#22102b;
  box-shadow:0 0 30px #672090;
}

.giftPopupIcon{
  font-size:48px;
}

.giftPopup button{
  margin-top:8px;
  border:0;
  border-radius:7px;
  padding:7px 12px;
  background:#ffd43b;
  font-weight:900;
}

/* 조금 큰 휴대폰 */
@media(min-width:600px){
  .mainStage{
    height:350px;
  }

  .member{
    height:67px;
  }

  .messages{
    height:165px;
  }
}

/* 아주 작은 화면 */
@media(max-width:380px){
  .broadcast{
    grid-template-columns:45% 55%;
  }

  .mainStage{
    height:320px;
  }

  .member{
    height:61px;
  }

  .messages{
    height:140px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">♛ K-Talk</div>
  <div class="live">● ON AIR</div>

  <div class="roomTitle">
    화상 방송방 · 최대 13명
  </div>

  <button id="startBtn" class="startBtn">
    방송 시작
  </button>
</div>

<div class="notice">
  ⭐ 출석체크 · 신청곡 · 선물 · 실시간 채팅 ⭐
</div>

<div class="broadcast">

  <div class="mainStage">

    <video id="stageVideo"
           autoplay
           playsinline>
    </video>

    <div class="stageInfo">

      <div id="stageName"
           class="stageName">
        진행자 큰 화면
      </div>

      <div class="stageText">
        호스트가 참가자를 누르면
        큰 화면으로 올릴 수 있습니다.
      </div>

    </div>

  </div>

  <div id="members"
       class="members">
  </div>

</div>

<div id="status"
     class="status">
  방송 시작을 눌러주세요.
</div>

<div class="lower">

  <!-- 채팅 -->
  <div class="chat">

    <div class="chatHead">
      <span>💬 채팅</span>
      <span>참가자 최대 13명</span>
    </div>

    <div id="messages"
         class="messages">

      <div class="message system">
        관리자 : K-Talk 방송방입니다.
      </div>

    </div>

    <div class="chatInput">

      <input id="chatText"
             maxlength="120"
             placeholder="메시지를 입력하세요">

      <button class="sendBtn"
              onclick="sendChat()">
        전송
      </button>

    </div>

  </div>

  <!-- 선물 -->
  <div class="giftArea">

    <div class="panel">

      <div class="panelTitle">
        🎁 선물 / 후원
      </div>

      <div class="gifts">

        <button class="giftBtn"
                onclick="sendRose(1)">
          <span class="giftEmoji">🌹</span>
          장미 1
        </button>

        <button class="giftBtn"
                onclick="sendRose(10)">
          <span class="giftEmoji">💐</span>
          장미 10
        </button>

        <button class="giftBtn"
                onclick="sendRose(50)">
          <span class="giftEmoji">🌹</span>
          장미 50
        </button>

        <button class="giftBtn"
                onclick="sendGift('❤️ 하트')">
          <span class="giftEmoji">❤️</span>
          하트
        </button>

        <button class="giftBtn"
                onclick="sendGift('⭐ 별')">
          <span class="giftEmoji">⭐</span>
          별
        </button>

        <button class="giftBtn"
                onclick="sendGift('🐋 고래')">
          <span class="giftEmoji">🐋</span>
          고래
        </button>

      </div>
    </div>

    <div class="panel">

      <div class="panelTitle">
        🎉 이벤트
      </div>

      <div class="events">

        <button class="eventBtn"
                onclick="openGiftBox()">
          🎁 선물상자
        </button>

        <button class="eventBtn"
                onclick="lottery()">
          🎯 제비뽑기
        </button>

      </div>

    </div>

  </div>

</div>

<div class="controls">

  <button id="micBtn"
          class="controlBtn"
          onclick="toggleMic()">

    <span class="icon">🎤</span>
    마이크

  </button>

  <button id="camBtn"
          class="controlBtn"
          onclick="toggleCamera()">

    <span class="icon">📷</span>
    카메라

  </button>

  <button class="controlBtn"
          onclick="copyInvite()">

    <span class="icon">🔗</span>
    초대

  </button>

  <button class="controlBtn"
          onclick="promoteMyself()">

    <span class="icon">🎙️</span>
    큰 화면

  </button>

  <button class="controlBtn end"
          onclick="leaveRoom()">

    <span class="icon">☎️</span>
    나가기

  </button>

</div>

<div id="giftPopup"
     class="giftPopup">

  <div class="giftPopupIcon">
    🎁
  </div>

  <b>선물상자</b>

  <div id="giftCount"
       style="margin-top:6px;color:#ffd85b">
    10초
  </div>

  <button id="giftReceive"
          onclick="receiveGift()"
          disabled>
    기다리는 중
  </button>

</div>

<script>
const MAX_USERS = 13;

const params =
  new URLSearchParams(
    location.search
  );

const ROOM =
  (params.get("room") || "main")
  .replace(
    /[^a-zA-Z0-9_-]/g,
    ""
  )
  .substring(0,30);

const PREFIX =
  "ktalk-" +
  ROOM +
  "-";

let peer = null;
let localStream = null;
let mySlot = null;

let calls = {};
let connections = {};
let streams = {};

let bigSlot = 1;

let micOn = true;
let cameraOn = true;

let giftTimer = null;
let giftSeconds = 0;
let giftReceived = false;

const members =
  document.getElementById(
    "members"
  );

const stageVideo =
  document.getElementById(
    "stageVideo"
  );

const stageName =
  document.getElementById(
    "stageName"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const messages =
  document.getElementById(
    "messages"
  );

const startBtn =
  document.getElementById(
    "startBtn"
  );

/* ===========================
   참가자 13자리 생성
=========================== */

function buildSlots(){

  members.innerHTML = "";

  for(
    let i=1;
    i<=MAX_USERS;
    i++
  ){

    const box =
      document.createElement(
        "div"
      );

    box.className =
      "member";

    box.id =
      "member-" + i;

    box.innerHTML = `

      <div id="empty-${i}"
           class="empty">
        대기
      </div>

      <video
        id="video-${i}"
        autoplay
        playsinline>
      </video>

      <div class="slotNum">
        ${i}
      </div>

      <div id="name-${i}"
           class="memberName">
        참가자 ${i}
      </div>

      <div class="rose">
        🌹
      </div>

    `;

    box.addEventListener(
      "click",
      ()=>{

        if(
          mySlot === 1 &&
          streams[i]
        ){

          setBigScreen(
            i,
            true
          );

        }

      }
    );

    members.appendChild(
      box
    );

  }

}

buildSlots();

/* ===========================
   Peer ID
=========================== */

function peerId(slot){

  return PREFIX + slot;

}

function slotFromPeer(id){

  if(
    !id ||
    !id.startsWith(PREFIX)
  ){
    return null;
  }

  const slot =
    Number(
      id.slice(
        PREFIX.length
      )
    );

  if(
    Number.isInteger(slot) &&
    slot >= 1 &&
    slot <= MAX_USERS
  ){
    return slot;
  }

  return null;

}

/* ===========================
   방송 시작
=========================== */

startBtn.addEventListener(
  "click",
  startBroadcast
);

async function startBroadcast(){

  if(localStream){
    return;
  }

  try{

    statusEl.textContent =
      "카메라와 마이크 연결 중...";

    localStream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:1280},
          height:{ideal:720}
        },

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }

      });

    await claimSlot(1);

  }
  catch(error){

    console.error(error);

    statusEl.textContent =
      "카메라와 마이크 권한을 허용해 주세요.";

    alert(
      "카메라와 마이크 사용을 허용해 주세요."
    );

  }

}

/* ===========================
   빈 자리 찾기
=========================== */

function claimSlot(slot){

  return new Promise(
    (resolve,reject)=>{

      if(
        slot > MAX_USERS
      ){

        alert(
          "현재 방송방이 가득 찼습니다."
        );

        reject(
          new Error(
            "room-full"
          )
        );

        return;

      }

      const candidate =
        new Peer(
          peerId(slot),
          {debug:0}
        );

      let completed =
        false;

      candidate.on(
        "open",
        ()=>{

          if(completed){
            return;
          }

          completed =
            true;

          peer =
            candidate;

          mySlot =
            slot;

          streams[mySlot] =
            localStream;

          showSlot(
            mySlot,
            localStream,
            true
          );

          setupPeerEvents();

          if(
            mySlot === 1
          ){

            document
            .getElementById(
              "name-1"
            )
            .textContent =
              "👑 호스트";

            bigSlot = 1;

            setBigScreen(
              1,
              false
            );

          }
          else{

            document
            .getElementById(
              "name-" +
              mySlot
            )
            .textContent =
              "나";

          }

          startBtn.style.display =
            "none";

          statusEl.textContent =
            mySlot === 1
            ? "호스트로 입장했습니다."
            : mySlot +
              "번 참가자로 입장했습니다.";

          addSystem(
            "참가자 " +
            mySlot +
            "님이 입장했습니다."
          );

          setTimeout(
            syncRoom,
            500
          );

          resolve();

        }
      );

      candidate.on(
        "error",
        error=>{

          if(
            error.type ===
            "unavailable-id"
          ){

            if(completed){
              return;
            }

            completed =
              true;

            try{
              candidate.destroy();
            }
            catch(e){}

            setTimeout(
              ()=>{

                claimSlot(
                  slot + 1
                )
                .then(resolve)
                .catch(reject);

              },
              100
            );

            return;

          }

          if(
            error.type !==
            "peer-unavailable"
          ){

            console.log(
              error
            );

          }

        }
      );

    }
  );

}

/* ===========================
   Peer 이벤트
=========================== */

function setupPeerEvents(){

  peer.on(
    "call",
    call=>{

      const slot =
        slotFromPeer(
          call.peer
        );

      if(!slot){
        return;
      }

      call.answer(
        localStream
      );

      registerCall(
        slot,
        call
      );

    }
  );

  peer.on(
    "connection",
    connection=>{

      registerConnection(
        connection
      );

    }
  );

  peer.on(
    "disconnected",
    ()=>{

      statusEl.textContent =
        "연결 복구 중...";

      try{
        peer.reconnect();
      }
      catch(e){}

    }
  );

  peer.on(
    "error",
    error=>{

      if(
        error.type !==
        "peer-unavailable"
      ){

        console.log(
          "Peer 오류",
          error
        );

      }

    }
  );

}

/* ===========================
   참가자 연결
=========================== */

function syncRoom(){

  if(
    !peer ||
    !localStream ||
    !mySlot
  ){
    return;
  }

  /*
    작은 번호 참가자가
    큰 번호 참가자에게 연결
    중복 연결 방지
  */

  for(
    let slot =
      mySlot + 1;

    slot <= MAX_USERS;

    slot++
  ){

    if(
      !connections[slot] ||
      !connections[slot].open
    ){

      try{

        const connection =
          peer.connect(
            peerId(slot),
            {
              reliable:true
            }
          );

        registerConnection(
          connection
        );

      }
      catch(e){}

    }

    if(
      !calls[slot]
    ){

      try{

        const call =
          peer.call(
            peerId(slot),
            localStream
          );

        if(call){

          registerCall(
            slot,
            call
          );

        }

      }
      catch(e){}

    }

  }

}

/* ===========================
   영상 연결
=========================== */

function registerCall(
  slot,
  call
){

  if(
    calls[slot] &&
    calls[slot] !== call
  ){

    try{
      calls[slot].close();
    }
    catch(e){}

  }

  calls[slot] =
    call;

  call.on(
    "stream",
    stream=>{

      streams[slot] =
        stream;

      showSlot(
        slot,
        stream,
        false
      );

      if(
        slot === bigSlot
      ){

        setBigScreen(
          slot,
          false
        );

      }

    }
  );

  call.on(
    "close",
    ()=>{

      clearSlot(slot);

    }
  );

  call.on(
    "error",
    ()=>{

      clearSlot(slot);

    }
  );

}

/* ===========================
   데이터 연결
=========================== */

function registerConnection(
  connection
){

  const slot =
    slotFromPeer(
      connection.peer
    );

  if(!slot){
    return;
  }

  connections[slot] =
    connection;

  connection.on(
    "open",
    ()=>{

      sendOne(
        connection,
        {
          type:"hello",
          slot:mySlot,
          bigSlot:bigSlot
        }
      );

    }
  );

  connection.on(
    "data",
    data=>{

      handleData(
        data
      );

    }
  );

  connection.on(
    "close",
    ()=>{

      if(
        connections[slot] ===
        connection
      ){

        delete connections[
          slot
        ];

      }

    }
  );

  connection.on(
    "error",
    ()=>{}
  );

}

/* ===========================
   데이터 받기
=========================== */

function handleData(data){

  if(
    !data ||
    typeof data !== "object"
  ){
    return;
  }

  switch(data.type){

    case "hello":

      if(data.bigSlot){

        bigSlot =
          Number(
            data.bigSlot
          );

        setBigScreen(
          bigSlot,
          false
        );

      }

      break;


    case "big":

      bigSlot =
        Number(
          data.slot
        );

      setBigScreen(
        bigSlot,
        false
      );

      break;


    case "chat":

      addChat(
        data.slot,
        data.text
      );

      break;


    case "rose":

      addSystem(
        "🌹 참가자 " +
        data.slot +
        "님이 장미 " +
        data.count +
        "송이를 선물했습니다."
      );

      break;


    case "gift":

      addSystem(
        "🎁 참가자 " +
        data.slot +
        "님이 " +
        data.name +
        " 선물을 보냈습니다."
      );

      break;


    case "giftbox":

      startGiftBox(
        Number(
          data.seconds || 10
        )
      );

      break;


    case "lottery":

      addSystem(
        data.text
      );

      break;
  }

}

/* ===========================
   참가자 영상 표시
=========================== */

function showSlot(
  slot,
  stream,
  local
){

  const video =
    document.getElementById(
      "video-" + slot
    );

  const empty =
    document.getElementById(
      "empty-" + slot
    );

  if(!video){
    return;
  }

  video.srcObject =
    stream;

  video.style.display =
    "block";

  /*
    내 영상은 항상 음소거
    큰 화면으로 올라간 사람도
    작은 칸에서는 음소거해서
    소리가 두 번 나오지 않게 함
  */

  video.muted =
    local ||
    slot === bigSlot;

  if(empty){

    empty.style.display =
      "none";

  }

}

/* ===========================
   큰 화면
=========================== */

function setBigScreen(
  slot,
  broadcast
){

  const stream =
    streams[slot];

  if(!stream){
    return;
  }

  /*
    기존 큰 화면 참가자는
    다시 작은 칸에서 소리 나오게
  */

  if(
    bigSlot &&
    bigSlot !== slot
  ){

    const oldVideo =
      document.getElementById(
        "video-" +
        bigSlot
      );

    if(oldVideo){

      oldVideo.muted =
        bigSlot ===
        mySlot;

    }

  }

  bigSlot =
    slot;

  stageVideo.srcObject =
    stream;

  /*
    내 영상이면 울림 방지를 위해
    큰 화면에서도 음소거
  */

  stageVideo.muted =
    slot === mySlot;

  /*
    현재 큰 화면 참가자의
    작은 칸은 음소거
  */

  const smallVideo =
    document.getElementById(
      "video-" +
      slot
    );

  if(smallVideo){

    smallVideo.muted =
      true;

  }

  stageName.textContent =
    slot === 1
    ? "👑 호스트"
    : "🎤 참가자 " +
      slot;

  if(broadcast){

    sendAll({
      type:"big",
      slot:slot
    });

    addSystem(
      "참가자 " +
      slot +
      "님이 큰 화면으로 이동했습니다."
    );

  }

}

/* ===========================
   자리 비우기
=========================== */

function clearSlot(slot){

  delete calls[slot];

  delete streams[slot];

  const video =
    document.getElementById(
      "video-" + slot
    );

  const empty =
    document.getElementById(
      "empty-" + slot
    );

  if(video){

    video.srcObject =
      null;

    video.style.display =
      "none";

  }

  if(empty){

    empty.style.display =
      "flex";

  }

  if(
    bigSlot === slot
  ){

    if(streams[1]){

      setBigScreen(
        1,
        false
      );

    }
    else{

      stageVideo.srcObject =
        null;

      stageName.textContent =
        "진행자 큰 화면";

    }

  }

}

/* ===========================
   채팅
=========================== */

function sendChat(){

  if(!mySlot){

    alert(
      "먼저 방송 시작을 눌러주세요."
    );

    return;
  }

  const input =
    document.getElementById(
      "chatText"
    );

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  addChat(
    mySlot,
    text
  );

  sendAll({
    type:"chat",
    slot:mySlot,
    text:text
  });

  input.value = "";

}

document
.getElementById(
  "chatText"
)
.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      sendChat();

    }

  }
);

function addChat(
  slot,
  text
){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message";

  div.textContent =
    "참가자 " +
    slot +
    " : " +
    text;

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;

}

function addSystem(text){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message system";

  div.textContent =
    text;

  messages.appendChild(
    div
  );

  messages.scrollTop =
    messages.scrollHeight;

}

/* ===========================
   데이터 보내기
=========================== */

function sendOne(
  connection,
  data
){

  try{

    if(
      connection &&
      connection.open
    ){

      connection.send(
        data
      );

    }

  }
  catch(e){}

}

function sendAll(data){

  Object.values(
    connections
  )
  .forEach(
    connection=>{

      sendOne(
        connection,
        data
      );

    }
  );

}

   장미

/* ===========================
   선물상자
=========================== */

function openGiftBox(){

  if(!mySlot){

    alert(
      "먼저 방송방에 입장해 주세요."
    );

    return;
  }

  startGiftBox(10);

  sendAll({
    type:"giftbox",
    seconds:10
  });

  addSystem(
    "🎁 선물상자가 올라왔습니다."
  );

}

function startGiftBox(seconds){

  clearInterval(
    giftTimer
  );

  giftSeconds =
    seconds;

  giftReceived =
    false;

  const popup =
    document.getElementById(
      "giftPopup"
    );

  const count =
    document.getElementById(
      "giftCount"
    );

  const button =
    document.getElementById(
      "giftReceive"
    );

  popup.style.display =
    "block";

  button.disabled =
    true;

  button.textContent =
    "기다리는 중";

  count.textContent =
    giftSeconds +
    "초";

  giftTimer =
    setInterval(
      ()=>{

        giftSeconds--;

        if(
          giftSeconds > 0
        ){

          count.textContent =
            giftSeconds +
            "초";

        }

        else{

          clearInterval(
            giftTimer
          );

          giftSeconds = 0;

          count.textContent =
            "지금 누르세요!";

          button.disabled =
            false;

          button.textContent =
            "선물 받기";

          setTimeout(
            ()=>{

              if(
                !giftReceived
              ){

                popup.style.display =
                  "none";

              }

            },
            7000
          );

        }

      },
      1000
    );

}

function receiveGift(){

  if(
    giftReceived ||
    giftSeconds > 0
  ){
    return;
  }

  giftReceived =
    true;

  const reward =
    Math.floor(
      Math.random()*5
    ) + 1;

  document
  .getElementById(
    "giftCount"
  )
  .textContent =
    "🌹 장미 " +
    reward +
    "개";

  document
  .getElementById(
    "giftReceive"
  )
  .disabled =
    true;

  addSystem(
    "🎉 참가자 " +
    mySlot +
    "님이 선물상자에서 장미 " +
    reward +
    "개를 받았습니다."
  );

  setTimeout(
    ()=>{

      document
      .getElementById(
        "giftPopup"
      )
      .style.display =
        "none";

    },
    2500
  );

}

/* ===========================
   제비뽑기
=========================== */

function lottery(){

  if(!mySlot){
    return;
  }

  const prizes =
    [
      0,
      0,
      1,
      2,
      3,
      4,
      5
    ];

  const prize =
    prizes[
      Math.floor(
        Math.random() *
        prizes.length
      )
    ];

  let text;

  if(
    prize === 0
  ){

    text =
      "🎯 참가자 " +
      mySlot +
      "님 제비뽑기 : 꽝";

  }
  else{

    text =
      "🎯 참가자 " +
      mySlot +
      "님 제비뽑기 : 🌹 장미 " +
      prize +
      "개";

  }

  addSystem(text);

  sendAll({
    type:"lottery",
    text:text
  });

}

=========================== */

function promoteMyself(){

  if(!mySlot){
    return;
  }

  if(
    mySlot !== 1
  ){

    alert(
      "큰 화면 이동은 호스트가 선택합니다."

/* ===========================
   초대 주소
=========================== */

async function copyInvite(){

  const url =
    location.origin +
    location.pathname +
    "?room=" +
    ROOM;

  try{

    await navigator
      .clipboard
      .writeText(
        url
      );

    alert(
      "초대 주소가 복사되었습니다."
    );

  }
  catch(e){

    prompt(
      "아래 주소를 복사하세요.",
      url
    );

  }

}

/* ===========================
   나가기
=========================== */

function leaveRoom(){

  Object.values(
    calls
  )
  .forEach(
    call=>{

      try{
        call.close();
      }
      catch(e){}

    }
  );

  Object.values(
    connections
  )
  .forEach(
    connection=>{

      try{
        connection.close();
      }
      catch(e){}

    }
  );

  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track=>{

        track.stop();

      }
    );

  }

  if(peer){

    try{
      peer.destroy();
    }
    catch(e){}

  }

  location.reload();

}

/* ===========================
   연결 끊김 자동 복구
=========================== */

const lostSince = {};

setInterval(
  ()=>{

    if(
      !peer ||
      !localStream ||
      !mySlot
    ){
      return;
    }

    Object.keys(
      calls
    )
    .forEach(
      key=>{

        const slot =
          Number(key);

        const call =
          calls[slot];

        if(!call){
          return;
        }

        const pc =
          call.peerConnection;

        if(!pc){
          return;
        }

        const state =
          pc.connectionState;

        if(
          state ===
          "connected"
        ){

          delete lostSince[
            slot
          ];

          return;
        }

        if(
          state ===
          "failed" ||
          state ===
          "closed" ||
          state ===
          "disconnected"
        ){

          if(
            !lostSince[
              slot
            ]
          ){

            lostSince[
              slot
            ] =
              Date.now();

          }

          if(
            Date.now() -
            lostSince[
              slot
            ] >
            5000
          ){

            try{
              call.close();
            }
            catch(e){}

            delete calls[
              slot
            ];

            delete lostSince[
              slot
            ];

            clearSlot(
              slot
            );

          }

        }

      }
    );

    syncRoom();

  },
  2500
);

/* 앱 다시 열었을 때 */
document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      !document.hidden
    ){

      setTimeout(
        syncRoom,
        500
      );

    }

  }
);

/* 페이지 종료 */
window.addEventListener(
  "beforeunload",
  ()=>{

    try{

      if(peer){
        peer.destroy();
      }

    }
    catch(e){}

  }
);
