ce-items:center;border-radius:17px;background:linear-gradient(135deg,#2acfff,#9f55ff 50%,#ff56b5);font-size:36px;box-shadow:0 0 18px #9e55ff77}.live{background:radial-gradient(circle at 50% 30%,#421239,#150916 43%,#020204 82%);cursor:pointer}.livecenter{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(180deg,#0002,#0008);z-index:3}.livebadge{display:inline-block;padding:10px 18px;border-radius:999px;background:#ff2d55;font-size:20px;font-weight:950;box-shadow:0 0 26px #ff2d5580}.livecenter .ant{font-size:70px;margin:26px 0 12px}.livecenter b{display:block;font-size:28px}.livecenter span{display:block;margin-top:8px;font-size:18px}.livecenter em{display:block;margin-top:20px;padding:12px 18px;border-radius:999px;border:1px solid #ffffff36;background:#ffffff16;font-style:normal;font-weight:900}.error{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:#ddd;background:#09090b;z-index:2}.error b{display:block;color:#ffe071;font-size:24px}.error span{display:block;margin-top:7px;font-size:14px}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function videoCard(item,i){var eager=i<3;return '<section class="card" data-kind="video"><video class="pub" '+(i===0?'autoplay ':'')+'muted loop playsinline webkit-playsinline preload="'+(eager?'auto':'metadata')+'" '+(eager?'src="'+esc(item[1])+'"':'data-src="'+esc(item[1])+'"')+'></video><div class="error"><div><b>♛ K-Talk</b><span>다음 영상으로 넘겨 주세요.</span></div></div><div class="shade"></div>'+tabs(false)+'<div class="title"><b>♛ K-Talk</b><span>'+esc(item[0])+'</span></div><div class="actions"><button>♡<small>좋아요</small></button><button>💬<small>댓글</small></button><button>🎁<small>선물</small></button><button>↗<small>공유</small></button></div></section>'}
function liveCard(x){var host=esc(x.host_id||'guest'),title=esc(x.title||x.room_name||'K-Talk LIVE'),room=esc(x.room_name||'라이브 방송'),name=esc(x.host_name||'K-Talk');return '<section class="card live" data-kind="live" data-host="'+host+'" data-title="'+title+'" data-room="'+room+'"><div class="livecenter"><div><div class="livebadge">● LIVE</div><div class="ant">📡</div><b>'+name+'</b><span>'+title+'</span><em>눌러서 방송 들어가기</em></div></div>'+tabs(true)+'</section>'}
function render(){var f=document.getElementById('feed');f.innerHTML=ITEMS.map(videoCard).join('');wire();sync(0)}
function ensure(v){if(!v)return;var u=v.getAttribute('data-src');if(u&&!v.getAttribute('src')){v.src=u;v.removeAttribute('data-src');v.preload='auto';try{v.load()}catch(e){}}}
function soundSet(v,on){if(!v)return;try{v.muted=!on;v.defaultMuted=!on;v.volume=on?1:0;if(on)v.removeAttribute('muted');else v.setAttribute('muted','')}catch(e){}}
function play(v,on){if(!v)return;ensure(v);soundSet(v,on);try{var p=v.play();if(p&&p.catch)p.catch(function(){if(on){soundSet(v,false);try{v.play()}catch(e){}}})}catch(e){}}
function cards(){return [].slice.call(document.querySelectorAll('#feed .card'))}
function sync(i){var cs=cards();if(!cs.length)return;if(i<0)i=0;if(i>=cs.length)i=cs.length-1;active=i;cs.forEach(function(c,n){var v=c.querySelector('video.pub');if(!v)return;if(n===i)play(v,sound);else{soundSet(v,false);try{v.pause()}catch(e){}}});for(var n=i+1;n<=Math.min(i+2,cs.length-1);n++){var v=cs[n].querySelector('video.pub');if(v){ensure(v);v.preload='auto'}}}
function nearest(){var f=document.getElementById('feed'),cs=cards(),top=f.getBoundingClientRect().top,best=0,d=1e9;cs.forEach(function(c,i){var x=Math.abs(c.getBoundingClientRect().top-top);if(x<d){d=x;best=i}});return best}
function unlock(){if(sound)return;sound=true;try{sessionStorage.setItem('ktalk_feed_sound','1')}catch(e){};sync(nearest())}
function wire(){var f=document.getElementById('feed');[].slice.call(f.querySelectorAll('video.pub')).forEach(function(v){v.removeAttribute('poster');v.addEventListener('error',function(){var e=v.closest('.card').querySelector('.error');if(e)e.style.display='grid'});v.addEventListener('stalled',function(){setTimeout(function(){if(v.closest('.card')===cards()[active])play(v,sound)},250)});v.addEventListener('waiting',function(){setTimeout(function(){if(v.closest('.card')===cards()[active])play(v,sound)},400)});v.addEventListener('ended',function(){try{v.currentTime=0;play(v,sound)}catch(e){}})});f.addEventListener('scroll',function(){clearTimeout(timer);timer=setTimeout(function(){sync(nearest())},70)},{passive:true});f.addEventListener('touchend',function(){setTimeout(function(){sync(nearest())},0)},{passive:true});f.addEventListener('pointerup',function(){setTimeout(function(){sync(nearest())},0)},{passive:true});f.addEventListener('touchstart',unlock,{passive:true});f.addEventListener('pointerdown',unlock,{passive:true})}
async function addLives(){try{var since=new Date(Date.now()-25000).toISOString();var u=SB+'/rest/v1/ktalk_live_rooms?select=id,host_id,host_name,title,room_name,updated_at&active=eq.true&updated_at=gte.'+encodeURIComponent(since)+'&order=updated_at.desc&limit=4';var r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY},cache:'no-store'});if(!r.ok)return;var rows=await r.json();if(!Array.isArray(rows)||!rows.length)return;var f=document.getElementById('feed'),first=f.querySelector('.card');rows.reverse().forEach(function(x){var w=document.createElement('div');w.innerHTML=liveCard(x);var c=w.firstElementChild;c.onclick=function(){var q='?joinHost='+encodeURIComponent(x.host_id||'guest')+'&joinTitle='+encodeURIComponent(x.title||x.room_name||'K-Talk LIVE')+'&joinRoom='+encodeURIComponent(x.room_name||'라이브 방송');location.href='https://k-talk-live-final.vercel.app/'+q};first.insertAdjacentElement('afterend',c)});sync(nearest())}catch(e){}}
window.goTop=function(){var f=document.getElementById('feed');f.scrollTo({top:0,behavior:'smooth'});setTimeout(function(){sync(0)},350)};
render();setTimeout(addLives,600);setInterval(addLives,12000);
})();
